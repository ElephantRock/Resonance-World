name: C3R G1 Artifact Recovery Only (No Provider)

# One-shot authenticated GitHub Actions read of prior run; no ZAI key.
on:
  push:
    branches:
      - experiment/c3r-g1-result-recovery-20261022

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: c3r-g1-result-recovery-20261022
  cancel-in-progress: false

jobs:
  recover:
    if: github.event.head_commit.message == 'C3R_G1_RECOVER_PRIOR_RUN_NO_PROVIDER_20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline report reader
        run: python -m pip install -e .
      - name: Read previous run and comment only bounded counters
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json
          import os
          import subprocess
          import sys
          import time
          from pathlib import Path
          
          repo = os.environ['GITHUB_REPOSITORY']
          target = '5fccb899d4601cceebfd35bef36f83b2b2d98f12'
          artifact_name = 'c3r-g1-512-token-one-shot-20261022'
          report_dir = Path('output/c3r_recovered')
          report_dir.mkdir(parents=True, exist_ok=True)
          
          def gh(*args, timeout=40):
              return subprocess.run(['gh', *args], capture_output=True, text=True,
                                    timeout=timeout, check=False)
          
          note = ['C3R G1 — offline recovery of the one-shot 512-token technical run.',
                  'NOT scientific G1/G2 evidence; no model-provider requests made by recovery.',
                  f'Target launch commit: {target}']
          api_path = (f'repos/{repo}/actions/runs?event=push&'
                      'branch=experiment%2Fc3r-g1-budget-smoke-20261022&per_page=100')
          query = gh('api', api_path)
          matches = []
          if query.returncode == 0:
              try:
                  matches = [r for r in json.loads(query.stdout)['workflow_runs']
                             if r.get('head_sha') == target and r.get('event') == 'push']
              except (ValueError, KeyError, TypeError):
                  matches = []
          if len(matches) != 1:
              note.append(f'Run lookup not uniquely resolved (matches={len(matches)}).')
              note.append('Provider sends and technical result remain unknown.')
          else:
              run_id = matches[0]['id']
              note.append(f'GitHub run: https://github.com/{repo}/actions/runs/{run_id}')
              state = 'unknown'
              conclusion = 'unknown'
              for _ in range(72):
                  check = gh('api', f'repos/{repo}/actions/runs/{run_id}')
                  if check.returncode != 0:
                      state = 'metadata_unavailable'
                      break
                  try:
                      info = json.loads(check.stdout)
                      state = info.get('status', 'unknown')
                      conclusion = info.get('conclusion') or 'not_concluded'
                  except (ValueError, TypeError):
                      state = 'metadata_invalid'
                      break
                  if state == 'completed':
                      break
                  time.sleep(10)
              note.append(f'GitHub workflow state: {state}; conclusion: {conclusion}')
              if state == 'completed':
                  download = gh('run', 'download', str(run_id), '--repo', repo,
                                '-n', artifact_name, '--dir', str(report_dir), timeout=90)
                  result_file = report_dir / 'technical-qualification.json'
                  if download.returncode == 0 and result_file.is_file():
                      audit = subprocess.run(
                          [sys.executable, 'scripts/audit_c3r_g1_smoke.py',
                           str(result_file), '--model', 'glm-5.3', '--route', 'coding'],
                          capture_output=True, text=True, timeout=45, check=False,
                      )
                      note.append(f'Offline structural audit exit code: {audit.returncode}')
                      try:
                          d = json.loads(result_file.read_text(encoding='utf-8'))
                          ledger = d['send_ledger']
                          report = d['report']
                          entries = ledger['entries']
                          note.append('Report-supplied send reservations: '
                                      f"{int(ledger['reserved'])}")
                          note.append(f'Ledger-reported HTTP 200: '
                                      f"{sum(x.get('http_status') == 200 for x in entries)}")
                          for stage in ('development', 'qualification_learned',
                                        'qualification_fresh'):
                              block = report[stage]
                              note.append(
                                  f'{stage}: attempts={int(block["attempts"])}; '
                                  f'accepted={int(block["accepted"])}; '
                                  f'successes={int(block["successes"])}; '
                                  f'empty_final={int(block.get("empty_output_count", 0))}'
                              )
                          note.append('Paired-analyzable: '
                                      f"{int(report['paired_analyzable'])}")
                          note.append('Source-evidence count: '
                                      f"{int(report['source_evidence_count'])}")
                      except (OSError, ValueError, TypeError, KeyError):
                          note.append('Artifact could not be parsed safely; no outcomes asserted.')
                      if audit.returncode != 0:
                          note.append('Report has NOT passed structural validation.')
                  else:
                      note.append('Bounded report artifact absent/unavailable; '
                                  'provider send count cannot be verified.')
          
          note.append('A GitHub run and self-reported data do not independently '
                      'attest Z.AI billing or establish G1/G2.')
          body = '\n'.join(note)
          (report_dir / 'recovery-comment.md').write_text(body, encoding='utf-8')
          comment = gh('api', '--method', 'POST',
                       f'repos/{repo}/issues/310/comments', '-f', f'body={body}',
                       '--silent', timeout=40)
          if comment.returncode != 0:
              print('Unable to publish sanitized reconciliation comment')
              raise SystemExit(2)
          print('One-shot recovery comment published to Draft PR #310')
          
      - name: Save offline recovery note
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3r-g1-recovery-no-provider
          path: output/c3r_recovered/recovery-comment.md
          retention-days: 7
          if-no-files-found: ignore
