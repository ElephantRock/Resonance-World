name: C3R G1 Single Authorized Smoke

# Disposable workflow: exact push branch AND exact commit message; never runs on PR.
on:
  push:
    branches:
      - experiment/c3r-g1-smoke-20261021

permissions:
  contents: read

concurrency:
  group: c3r-g1-authorized-smoke-once-20261021
  cancel-in-progress: false

jobs:
  single-technical-probe:
    if: github.event.head_commit.message == 'C3R_AUTHORIZED_SMOKE_20261021'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: c3r-provider-qualification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify source and budget controls before provider sends
        run: |
          ruff check .
          pytest -q tests/test_c3r_g1_model_boundary.py tests/test_c3r_g1_zai_transport.py
      - name: Single authorized bounded provider smoke
        env:
          C3R_ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: |
          if [[ -z "${C3R_ZAI_API_KEY}" ]]; then
            echo "BLOCKED: ZAI_API_KEY secret missing; no calls."
            exit 1
          fi
          mkdir -p output/c3r_g1
          python scripts/run_c3r_g1_live_smoke.py \
            --live --model glm-5.3 --route coding --max-sends 8 \
            > output/c3r_g1/technical-qualification.json
          cat output/c3r_g1/technical-qualification.json
      - name: Persist bounded result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3r-g1-authorized-smoke-20261021
          path: output/c3r_g1/technical-qualification.json
          retention-days: 7
          if-no-files-found: ignore
