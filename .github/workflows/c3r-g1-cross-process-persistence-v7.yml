name: C3R G1 Cross-Process Persistence v7
on:
  push:
    branches: [research/c3r-g1-live-acquisition-20261024]
    paths:
      - ".github/workflows/c3r-g1-cross-process-persistence-v7.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c3r-g1-cross-process-v7-single-campaign
  cancel-in-progress: false

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Compile both independent stages and test evaluator without provider calls
        shell: bash
        run: |
          python -m py_compile scripts/run_c3r_g1_live_persistence_v7.py scripts/c3r_g1_capsule_replay_child_v7.py
          PYTHONPATH=scripts python - <<'PY'
          import json
          import random
          import os
          import tempfile
          from pathlib import Path
          from unittest.mock import patch
          import c3r_g1_capsule_replay_child_v7 as child
          import run_c3r_g1_live_persistence_v7 as parent
          assert len(parent.CODES) == 32
          assert len(parent.ARMS) == 3
          rng = random.SystemRandom()
          for family in ("arithmetic", "text"):
              target = "ABBAA"
              src = parent._task(rng,family)
              tasks=[]
              while len(tasks)<2:
                  x=parent._task(rng,family)
                  if x != src and x not in tasks: tasks.append(x)
              view=parent.public_view(family,src)
              assert len(view["ranked_candidates"]) == 32
              assert {r[0] for r in view["ranked_candidates"]} == set(parent.CODES)
              with tempfile.TemporaryDirectory() as d:
                  d=Path(d)
                  cap=d/"private.json"
                  cap.write_text(json.dumps({"family":family,"policy":target,
                    "private_program":target,"holdouts":tasks}))
                  shared=d/"audit.jsonl"
                  parent.RedactedJournal(shared).close()
                  for wave in (1,2):
                      out=d/f"out-{wave}.json"
                      with patch.object(child, "ask", return_value=(
                            parent._execute(family,tasks[wave-1],target),
                            "accepted",16,0.1)):
                          child.replay(cap,wave,out,shared)
                      verdict=json.loads(out.read_text())
                      assert verdict["deterministic_correct"] is True
                      assert verdict["model_execution_correct"] is True
                      assert verdict["source_prompt_visible"] is False
                      assert verdict["grader_secret_visible_in_model_prompt"] is False
                  contents=shared.read_text()
                  assert "private_program" not in contents and target not in contents
                  assert contents.count("request_reserved") == 0 # patched transport
          print("Cross-process contract and grading tests passed; zero network sends.")
          PY

  live-acquisition:
    needs: offline-contract
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        cohort: ["01", "02", "03", "04", "05", "06"]
        position: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      C3R_ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Credential and no-replay safety
        shell: bash
        run: |
          test -n "$C3R_ZAI_API_KEY" || { echo "Missing provider credential."; exit 1; }
          test "${{ github.run_attempt }}" = "1" || { echo "Do not replay a consumed experimental unit."; exit 2; }
      - name: Model acquisition and two fresh-process replays
        shell: bash
        run: |
          umask 077
          mkdir -p output/c3r_g1
          python -u scripts/run_c3r_g1_live_persistence_v7.py \
            --cohort "${{ matrix.cohort }}" \
            --position "${{ matrix.position }}" \
            --out "output/c3r_g1/persistence-${{ matrix.cohort }}-${{ matrix.position }}.jsonl"
      - name: Always preserve per-attempt redacted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3r-g1-cross-process-v7-${{ matrix.cohort }}-${{ matrix.position }}
          path: output/c3r_g1/persistence-${{ matrix.cohort }}-${{ matrix.position }}.jsonl
          retention-days: 30
          if-no-files-found: warn
