name: C3R G1 First Live Experiment - One Re-Run Only

# Initial PR-310 run deliberately fails BEFORE reading the provider key.
# Only an explicitly invoked GitHub re-run (attempt 2) can dispatch.
on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: c3r-g1-first-live-single-use-pr-310
  cancel-in-progress: false

jobs:
  g1-first-live-once:
    if: >-
      github.event.pull_request.number == 310 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'research/c3r-g2-causal-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: c3r-provider-qualification
    steps:
      - name: Explicit one-time manual re-run gate
        shell: bash
        env:
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [[ "$ATTEMPT" != "2" ]]; then
            echo 'NO PROVIDER SENDS: initial and later runs cannot dispatch. Only manual re-run attempt 2.'
            exit 78
          fi
          echo 'Single approved exploratory GLM-5.3 run, eight physical requests maximum.'
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research branch
        run: python -m pip install -e .
      - name: Eight-call learner/fresh technical pilot
        shell: bash
        env:
          C3R_ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${C3R_ZAI_API_KEY:-}" || { echo 'Provider key unavailable; zero sends'; exit 2; }
          mkdir -p output/c3r_g1
          python scripts/run_c3r_g1_live_smoke.py \
            --live --model glm-5.3 --route coding --max-sends 8 \
            --max-tokens 16384 --timeout-seconds 180 \
            > output/c3r_g1/first-glm53-g1-pilot.json
          python - <<'PY'
          import json
          with open('output/c3r_g1/first-glm53-g1-pilot.json') as f:
              p = json.load(f)
          r = p['report']
          print(json.dumps({
              'logical_expected': 8,
              'physical_reservations': p['send_ledger']['reserved'],
              'development_accepted': r['development']['accepted'],
              'learner_accepted': r['qualification_learned']['accepted'],
              'fresh_accepted': r['qualification_fresh']['accepted'],
              'paired_analyzable': r['paired_analyzable'],
              'learner_successes': r['qualification_learned']['successes'],
              'fresh_successes': r['qualification_fresh']['successes'],
              'scientific_acceptance': False
          }, sort_keys=True))
          PY
      - name: Archive sanitized pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3r-g1-first-real-glm53-once
          path: output/c3r_g1/first-glm53-g1-pilot.json
          retention-days: 14
          if-no-files-found: ignore
