name: G1 Five-Step Inference Effort-Cap Factorial Real

# Unique marker dispatches genuinely new matched-context source diagnosis ONCE.
# Retire after evidence capture. No provider retry or external audit.
on:
  push:
    branches:
      - research/c3r-g2-causal-foundation
    paths:
      - research/c3r_g2/G1_FIVE_STEP_INFERENCE_FACTORIAL_REAL_DISPATCH_20261024.md

permissions:
  contents: read

concurrency:
  group: c3r-g1-five-step-effort-cap-factorial-20261024-one-shot
  cancel-in-progress: false

jobs:
  inference-diagnostic:
    if: github.repository == 'ElephantRock/Resonance-World'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        cohort: ['01', '02', '03']
    env:
      C3R_ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      PYTHONDONTWRITEBYTECODE: '1'
      COHORT: ${{ matrix.cohort }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install internal model transport
        run: |
          python -m pip install -e .
          python -m pip install 'cryptography>=42'
      - name: Verify secret and zero-send offline preflight
        shell: bash
        run: |
          test -n "$C3R_ZAI_API_KEY" || { echo "ZAI key unavailable; zero sends"; exit 2; }
          python scripts/run_c3r_g1_five_step_factorial_diagnostic.py \
            --run-id "g1-factorial-five-20261024-$COHORT" >/dev/null
      - name: Run new within-context factorial with persistent one-use reservations
        shell: bash
        run: |
          umask 077
          mkdir -m 700 -p "$RUNNER_TEMP/g1-factorial-$COHORT" output/c3r_g2
          python scripts/run_c3r_g1_five_step_factorial_diagnostic.py \
            --live --run-id "g1-factorial-five-20261024-$COHORT" \
            --workspace "$RUNNER_TEMP/g1-factorial-$COHORT" \
            --workers 3 --timeout-seconds 120 \
            > "output/c3r_g2/g1-factorial-$COHORT-redacted.json"
      - name: Upload ONLY source diagnostics without private programs or text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g1-factorial-five-${{ matrix.cohort }}-20261024
          path: output/c3r_g2/g1-factorial-${{ matrix.cohort }}-redacted.json
          retention-days: 14
          if-no-files-found: ignore
