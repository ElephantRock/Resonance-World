name: G1 Fourth Crossed Live One-Shot

# Marker-only push dispatch; never rerun ambiguous provider calls.
on:
  push:
    branches:
      - research/c3r-g2-causal-foundation
    paths:
      - research/c3r_g2/G1_FOURTH_REAL_DISPATCH_20261023.md

permissions:
  contents: read

concurrency:
  group: c3r-g1-fourth-crossed-real-once-20261023
  cancel-in-progress: false

jobs:
  fourth-crossed-live:
    if: github.repository == 'ElephantRock/Resonance-World'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      C3R_ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install C3R package
        run: |
          python -m pip install -e .
          python -m pip install 'cryptography>=42'
      - name: Verify credential and frozen 40-slot plan without sending
        shell: bash
        run: |
          test -n "$C3R_ZAI_API_KEY" || { echo "ZAI_API_KEY absent; zero sends"; exit 2; }
          python -m resonance_world.c3r_g1_crossed_plan > /dev/null
          python scripts/run_c3r_g1_fourth_crossed_live.py > /dev/null
      - name: Run real GLM-5.3 balanced crossed trial once
        shell: bash
        run: |
          umask 077
          mkdir -m 700 -p "$RUNNER_TEMP/c3r-g1-fourth-live" output/c3r_g2
          python scripts/run_c3r_g1_fourth_crossed_live.py \
            --live --run-id g1-crossed-real-20261023-01 \
            --workspace "$RUNNER_TEMP/c3r-g1-fourth-live" \
            --workers 4 --max-tokens 16384 \
            > output/c3r_g2/g1-fourth-crossed-real.json
      - name: Retain sanitized results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g1-fourth-real-crossed-20261023
          path: output/c3r_g2/g1-fourth-crossed-real.json
          retention-days: 14
          if-no-files-found: ignore
