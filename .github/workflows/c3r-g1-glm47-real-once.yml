name: G1 GLM-4.7 Nonthinking Real Trial

on:
  push:
    branches:
      - research/c3r-g2-causal-foundation
    paths:
      - research/c3r_g2/G1_GLM47_REAL_DISPATCH_20261023.md

permissions:
  contents: read

concurrency:
  group: c3r-g1-glm47-internal-experiment-20261023
  cancel-in-progress: false

jobs:
  glm47-crossed:
    if: github.repository == 'ElephantRock/Resonance-World'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      C3R_ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install internal research dependencies
        run: |
          python -m pip install -e .
          python -m pip install 'cryptography>=42'
      - name: Offline frozen-plan and credential precheck
        shell: bash
        run: |
          test -n "$C3R_ZAI_API_KEY" || { echo "Missing provider credential; no sends"; exit 2; }
          python -m resonance_world.c3r_g1_crossed_plan > /dev/null
          python scripts/run_c3r_g1_control_readiness_probe.py > /dev/null
          python scripts/run_c3r_g1_fourth_crossed_live.py > /dev/null
      - name: Two real GLM-4.7 control-readiness probes, no retries
        shell: bash
        run: |
          umask 077
          mkdir -m 700 -p output/c3r_g2
          python scripts/run_c3r_g1_control_readiness_probe.py --live \
            > output/c3r_g2/g1-glm47-control-readiness.json
      - name: Actual G1 40-slot GLM-4.7 crossed trial if controls respond
        shell: bash
        run: |
          umask 077
          mkdir -m 700 -p "$RUNNER_TEMP/g1-glm47-crossed" output/c3r_g2
          python scripts/run_c3r_g1_fourth_crossed_live.py \
            --live --run-id g1-crossed-glm47-nonthinking-20261023-05 \
            --workspace "$RUNNER_TEMP/g1-glm47-crossed" \
            --model glm-4.7 --thinking-mode disabled \
            --workers 4 --max-tokens 1024 \
            > output/c3r_g2/g1-glm47-crossed-real.json
      - name: Retain sanitized readiness and actual trial results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g1-glm47-real-and-readiness-20261023
          path: |
            output/c3r_g2/g1-glm47-control-readiness.json
            output/c3r_g2/g1-glm47-crossed-real.json
          retention-days: 14
          if-no-files-found: ignore
