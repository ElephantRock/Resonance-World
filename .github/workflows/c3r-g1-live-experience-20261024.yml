name: C3R G1 Live Experience Acquisition 20261024
on:
  push:
    branches: [research/c3r-g1-live-acquisition-20261024]
    paths:
      - ".github/workflows/c3r-g1-live-experience-20261024.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c3r-g1-acquisition-20261024-v2-once
  cancel-in-progress: true

jobs:
  provider-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      C3R_ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install repository package
        run: python -m pip install -e .
      - name: One real provider request, fail before fanout on HTTP rejection
        shell: bash
        run: |
          umask 077
          mkdir -p output/c3r_g1
          python -u scripts/run_c3r_g1_live_feedback_acquisition.py --preflight --out output/c3r_g1/provider-preflight.jsonl
      - name: Preserve provider HTTP diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3r-g1-live-provider-preflight-v4
          path: output/c3r_g1/provider-preflight.jsonl
          retention-days: 21
          if-no-files-found: warn

  live-acquisition:
    needs: provider-check
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        cohort: ["01", "02", "03", "04", "05", "06"]
        position: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      C3R_ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install repository package
        run: python -m pip install -e .
      - name: Offline syntax and integrity check
        shell: bash
        run: |
          python -m py_compile scripts/run_c3r_g1_live_feedback_acquisition.py
          PYTHONPATH=scripts python - <<'PY'
          import json
          import random
          import tempfile
          from pathlib import Path
          from run_c3r_g1_live_feedback_acquisition import public_view, RedactedJournal, _task
          for family in ("arithmetic", "text"):
              view = public_view(family, _task(random.SystemRandom(), family))
              assert len(view["thresholds"]) == 32
              assert len(set(view["thresholds"])) == 32
          with tempfile.TemporaryDirectory() as d:
              file = Path(d) / "journal.jsonl"
              j = RedactedJournal(file)
              j.reserve("selftest")
              j.complete("selftest", "accepted", 2, 0.1)
              j.close()
              rows = [json.loads(s) for s in file.read_text().splitlines()]
              assert [r["event"] for r in rows] == ["request_reserved", "request_completed"]
              assert "raw_response" not in file.read_text()
          print("Offline checks passed")
          PY
      - name: Verify credential and one-use campaign
        shell: bash
        run: |
          test -n "$C3R_ZAI_API_KEY" || { echo "Missing ZAI API key; zero sends."; exit 1; }
          test "${{ github.run_attempt }}" = "1" || { echo "Workflow re-run blocked to avoid duplicate sends."; exit 2; }
      - name: Actual GLM-5.3 feedback acquisition (one context and three arms)
        shell: bash
        run: |
          umask 077
          mkdir -p output/c3r_g1
          python -u scripts/run_c3r_g1_live_feedback_acquisition.py \
            --cohort "${{ matrix.cohort }}" \
            --position "${{ matrix.position }}" \
            --out "output/c3r_g1/acquisition-${{ matrix.cohort }}-${{ matrix.position }}.jsonl"
      - name: Preserve durable, redacted attempt-level evidence even on timeout
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3r-g1-live-acquisition-v4-${{ matrix.cohort }}-${{ matrix.position }}
          path: output/c3r_g1/acquisition-${{ matrix.cohort }}-${{ matrix.position }}.jsonl
          retention-days: 21
          if-no-files-found: warn
