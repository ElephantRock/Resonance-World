name: C3R G1 Live Experience Acquisition 20261024
on:
  push:
    branches: [research/c3r-g1-live-acquisition-20261024]
    paths:
      - ".github/workflows/c3r-g1-live-experience-20261024.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c3r-g1-acquisition-20261024-once
  cancel-in-progress: false

jobs:
  live-acquisition:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        cohort: ["01", "02", "03", "04", "05", "06"]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      C3R_ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install repository package
        run: python -m pip install -e .
      - name: Verify credential before any send
        shell: bash
        run: |
          test -n "$C3R_ZAI_API_KEY" || { echo "Missing ZAI API key; zero sends."; exit 1; }
      - name: Actual GLM-5.3 feedback acquisition with 3 arms and new holdouts
        shell: bash
        run: |
          umask 077
          mkdir -p output/c3r_g1
          python scripts/run_c3r_g1_live_feedback_acquisition.py \
            --cohort "${{ matrix.cohort }}" \
            --out "output/c3r_g1/acquisition-${{ matrix.cohort }}.json"
      - name: Preserve redacted outcome data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3r-g1-live-acquisition-${{ matrix.cohort }}-20261024
          path: output/c3r_g1/acquisition-${{ matrix.cohort }}.json
          retention-days: 21
          if-no-files-found: warn
