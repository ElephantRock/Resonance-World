name: C3R G1 Manual Provider Qualification

# This workflow has NO push/PR trigger. It is not available for dispatch
# until GitHub recognizes the workflow on the repository default branch.
on:
  workflow_dispatch:
    inputs:
      model_id:
        description: "Explicit standard-API model identifier"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: c3r-g1-technical-provider-qualification
  cancel-in-progress: false

jobs:
  bounded-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: c3r-provider-qualification
    env:
      # Existing repository secret, mapped to the isolated C3R CLI variable.
      C3R_ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      MODEL_ID: ${{ inputs.model_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install World package (without optional provider SDK)
        run: python -m pip install -e .
      - name: Fail closed on missing repository ZAI_API_KEY
        shell: bash
        run: |
          if [[ -z "${C3R_ZAI_API_KEY}" ]]; then
            echo "Missing repository ZAI_API_KEY; no physical sends authorized."
            exit 1
          fi
      - name: Eight-send hard-capped technical qualification only
        shell: bash
        run: |
          mkdir -p output/c3r_g1
          python scripts/run_c3r_g1_live_smoke.py \
            --live --model "$MODEL_ID" --max-sends 8 \
            > output/c3r_g1/technical-qualification.json
      - name: Persist bounded diagnostic (no raw prompt/response)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3r-g1-technical-qualification
          path: output/c3r_g1/technical-qualification.json
          retention-days: 7
          if-no-files-found: ignore
