name: C3R G1 Novel Grammar Generalization 20261026
on:
  push:
    branches:
      - research/c3r-g1-novel-grammar-generalization-20261026
  workflow_dispatch:
    inputs:
      session:
        description: "induce | wave1 | wave2"
        required: true
        default: "induce"
      arm:
        description: "learned | raw | fresh | neutral (waves only)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: c3r-g1-novel-grammar-${{ github.event.inputs.session || 'offline' }}-${{ github.event.inputs.arm || 'all' }}
  cancel-in-progress: false

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline grammar and discipline tests
        run: |
          python -m pip install -e . && python -m pip install pytest ruff
          python -m py_compile scripts/run_c3r_g1_novel_grammar_generalization_live.py
          ruff check scripts/run_c3r_g1_novel_grammar_generalization_live.py tests/test_c3r_g1_novel_grammar_generalization.py
          python -m pytest tests/test_c3r_g1_novel_grammar_generalization.py -q

  live-induce:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.session == 'induce'
    needs: offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      C3R_ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Induction session (8 sends, High/4096)
        run: |
          python -m pip install -e .
          python scripts/run_c3r_g1_novel_grammar_generalization_live.py \
            --workspace "$RUNNER_TEMP/novel-workspace" \
            --run-id "novel-${{ github.run_id }}" \
            --session induce \
            --workers 2
      - uses: actions/upload-artifact@v4
        with:
          name: novel-induction-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/novel-workspace/**/manifest.json
            ${{ runner.temp }}/novel-workspace/**/capsules.json
            ${{ runner.temp }}/novel-workspace/**/induction-summary.json
          if-no-files-found: error

  live-wave:
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.session == 'wave1' || github.event.inputs.session == 'wave2')
    needs: offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        arm: ["learned", "raw", "fresh", "neutral"]
    env:
      C3R_ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wave session (8 sends per arm, High/4096)
        run: |
          python -m pip install -e .
          python scripts/run_c3r_g1_novel_grammar_generalization_live.py \
            --workspace "$RUNNER_TEMP/novel-workspace" \
            --run-id "novel-${{ github.run_id }}" \
            --session "${{ github.event.inputs.session }}" \
            --arm "${{ matrix.arm }}" \
            --workers 2
      - uses: actions/upload-artifact@v4
        with:
          name: novel-${{ github.event.inputs.session }}-${{ matrix.arm }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/novel-workspace/**/*summary.json
          if-no-files-found: error
