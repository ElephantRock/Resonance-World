name: C3R G1 Approved Output-Budget Requalification

# Disposable, exact-message-gated one-shot push workflow. Not on main.
on:
  push:
    branches:
      - experiment/c3r-g1-budget-smoke-20261022

permissions:
  contents: read
  issues: write

concurrency:
  group: c3r-g1-budget-smoke-20261022
  cancel-in-progress: false

jobs:
  bounded-technical-requalification:
    if: github.event.head_commit.message == 'C3R_G1_APPROVED_512_TOKEN_ONESHOT_20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: c3r-provider-qualification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify engineering guards before any provider call
        run: |
          ruff check .
          pytest -q tests/test_c3r_g1_model_boundary.py tests/test_c3r_g1_zai_transport.py tests/test_c3r_g1_run_audit.py tests/test_c3r_g1_smoke_audit_cli.py
      - name: Authorized coding task technical probe, at most eight sends
        env:
          C3R_ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${C3R_ZAI_API_KEY}" ]]; then
            echo "No repository ZAI_API_KEY; no provider sends attempted."
            exit 1
          fi
          mkdir -p output/c3r_g1
          python scripts/run_c3r_g1_live_smoke.py \
            --live --model glm-5.3 --route coding --max-sends 8 \
            > output/c3r_g1/technical-qualification.json
      - name: Independent structural audit (not scientific evidence)
        run: |
          python scripts/audit_c3r_g1_smoke.py \
            output/c3r_g1/technical-qualification.json \
            --model glm-5.3 --route coding \
            > output/c3r_g1/structural-audit.json
      - name: Comment bounded non-sensitive status on Draft PR 310
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p output/c3r_g1
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          file = Path('output/c3r_g1/technical-qualification.json')
          base = (
              'C3R G1 — 512-token bounded technical requalification (NOT scientific G1/G2 evidence)\n'
              f"GitHub Actions run: https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}\n"
              f"Commit: {os.environ['GITHUB_SHA']}\n"
              'Configuration: glm-5.3 / Coding Plan / max 8 sends / 512 generated tokens each.\n'
          )
          try:
              data = json.loads(file.read_text(encoding='utf-8'))
              report = data['report']
              ledger = data['send_ledger']
              entries = ledger['entries']
              counted = [x for x in entries if isinstance(x, dict) and x.get('http_status') == 200]
              lines = [
                  base,
                  f"Reserved physical sends (self-reported): {int(ledger['reserved'])}",
                  f'HTTP 200 responses in ledger: {len(counted)}',
              ]
              for stage in ('development', 'qualification_learned', 'qualification_fresh'):
                  block = report[stage]
                  lines.append(
                      f"{stage}: attempted {int(block['attempts'])}, "
                      f"accepted {int(block['accepted'])}, "
                      f"successes {int(block['successes'])}, "
                      f"empty outputs {int(block.get('empty_output_count', 0))}"
                  )
              lines.extend([
                  f"Paired analyzable: {int(report['paired_analyzable'])}",
                  f"Source evidence count: {int(report['source_evidence_count'])}",
                  'Bounded diagnostic artifact also uploaded; do not promote to science.',
              ])
              message = '\n'.join(lines)
          except (OSError, ValueError, TypeError, KeyError, IndexError, json.JSONDecodeError):
              message = base + 'Result artifact absent or unreadable; do not infer provider sends.'
          Path('output/c3r_g1/summary-comment.md').write_text(message, encoding='utf-8')
          PY
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/310/comments" \
            -f body="$(cat output/c3r_g1/summary-comment.md)" --silent
      - name: Persist bounded report and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3r-g1-512-token-one-shot-20261022
          path: output/c3r_g1
          retention-days: 7
          if-no-files-found: ignore
