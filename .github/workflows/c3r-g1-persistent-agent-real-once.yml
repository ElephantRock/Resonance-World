name: G1 Persistent Agent Memory Real Cross-Session Cohorts

# One committed marker is the unique real-provider dispatch trigger.
on:
  push:
    branches:
      - research/c3r-g2-causal-foundation
    paths:
      - research/c3r_g2/G1_PERSISTENT_AGENT_REAL_DISPATCH_20261023.md

permissions:
  contents: read

concurrency:
  group: c3r-g1-persistent-agent-novel-20261023-one-shot
  cancel-in-progress: false

jobs:
  persistent-memory-trial:
    if: github.repository == 'ElephantRock/Resonance-World'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        cohort: [01, 02, 03]
    env:
      C3R_ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      PYTHONDONTWRITEBYTECODE: "1"
      COHORT: ${{ matrix.cohort }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install internal research dependencies
        run: |
          python -m pip install -e .
          python -m pip install 'cryptography>=42'
      - name: Credential and offline plan checks
        shell: bash
        run: |
          test -n "$C3R_ZAI_API_KEY" || { echo "Provider secret missing; zero sends"; exit 2; }
          python scripts/run_c3r_g1_persistent_experience_live.py \
            --phase source --run-id "g1-agent-memory-20261023-$COHORT" >/dev/null
          python scripts/run_c3r_g1_persistent_experience_live.py \
            --phase holdout --run-id "g1-agent-memory-20261023-$COHORT" >/dev/null
      - name: Stage 1 — genuine model source and private persisted experience
        shell: bash
        run: |
          umask 077
          mkdir -m 700 -p "$RUNNER_TEMP/g1-agent-memory-$COHORT" output/c3r_g2
          python scripts/run_c3r_g1_persistent_experience_live.py \
            --live --phase source \
            --run-id "g1-agent-memory-20261023-$COHORT" \
            --workspace "$RUNNER_TEMP/g1-agent-memory-$COHORT" \
            --workers 3 --timeout-seconds 120 --max-tokens 8192 \
            > "output/c3r_g2/g1-agent-memory-$COHORT-source.json"
      - name: Stage 2 — new Python interpreter, only rehydrated policy, fresh items
        shell: bash
        run: |
          umask 077
          python scripts/run_c3r_g1_persistent_experience_live.py \
            --live --phase holdout \
            --run-id "g1-agent-memory-20261023-$COHORT" \
            --workspace "$RUNNER_TEMP/g1-agent-memory-$COHORT" \
            --workers 3 --timeout-seconds 120 --max-tokens 8192 \
            > "output/c3r_g2/g1-agent-memory-$COHORT-holdout.json"
      - name: Upload public redacted source and qualification reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g1-agent-memory-${{ matrix.cohort }}-20261023
          path: |
            output/c3r_g2/g1-agent-memory-${{ matrix.cohort }}-source.json
            output/c3r_g2/g1-agent-memory-${{ matrix.cohort }}-holdout.json
          if-no-files-found: ignore
          retention-days: 14
