name: C3R G1 Procedure Representation Comparison 20261027
on:
  push:
    branches:
      - research/c3r-g1-procedure-representation-20261027
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: c3r-g1-procedure-representation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline representation and ledger tests
        env:
          PYTHONPATH: "src:scripts"
        run: |
          python -m pip install -e . && python -m pip install pytest
          python -m py_compile scripts/run_c3r_g1_procedure_representation_live.py
          python -m pytest tests/test_c3r_g1_procedure_representation.py -q

  manifest:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Freeze manifest (deterministic programs and holdouts)
        env:
          PYTHONPATH: "src:scripts"
        run: |
          python scripts/run_c3r_g1_procedure_representation_live.py \
            --workspace "$RUNNER_TEMP/repr-workspace" \
            --run-id "repr-${{ github.run_id }}" \
            --session manifest
      - uses: actions/upload-artifact@v4
        with:
          name: representation-manifest
          path: ${{ runner.temp }}/repr-workspace/representation-manifest.json
          if-no-files-found: error
          retention-days: 90

  send:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: [offline-tests, manifest]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        representation: ["code", "natural"]
        wave: ["wave1", "wave2"]
        half: ["a", "b"]
    env:
      C3R_ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Workspace and shared campaign ledger (0700)
        run: |
          mkdir -p -m 700 "$RUNNER_TEMP/repr-workspace/campaign-ledger"
          chmod 700 "$RUNNER_TEMP/repr-workspace/campaign-ledger"
      - name: Download frozen manifest
        uses: actions/download-artifact@v4
        with:
          name: representation-manifest
          path: ${{ runner.temp }}/repr-workspace/
      - name: Send batch (8 sends, High/4096)
        env:
          PYTHONPATH: "src:scripts"
        run: |
          python -m pip install -e .
          python scripts/run_c3r_g1_procedure_representation_live.py \
            --workspace "$RUNNER_TEMP/repr-workspace" \
            --run-id "repr-${{ github.run_id }}" \
            --session send \
            --representation ${{ matrix.representation }} \
            --wave ${{ matrix.wave }} \
            --half ${{ matrix.half }}
      - name: Upload batch summary
        uses: actions/upload-artifact@v4
        with:
          name: repr-summary-${{ matrix.representation }}-${{ matrix.wave }}-${{ matrix.half }}
          path: ${{ runner.temp }}/repr-workspace/summary-*.json
          if-no-files-found: error
          retention-days: 90
