name: C3R G1 Second Real GLM A-Sham Experiment

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: c3r-g1-second-A-sham-once-310
  cancel-in-progress: false

jobs:
  g1-A-sham-once:
    if: >-
      github.event.pull_request.number == 310 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'research/c3r-g2-causal-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: c3r-provider-qualification
    steps:
      - name: One deliberate manual re-run attempt only
        shell: bash
        env:
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [[ "$ATTEMPT" != '2' ]]; then
            echo 'NO LIVE SENDS: manually re-run this job once to authorize attempt 2'
            exit 78
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - name: Eight model calls - 2 development and 2 three-arm qualifications
        shell: bash
        env:
          C3R_ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${C3R_ZAI_API_KEY:-}" || { echo 'No key, no provider sends'; exit 2; }
          mkdir -p output/g1_second
          python scripts/run_c3r_g1_a_counterlaw_live.py --live \
            --model glm-5.3 --route coding --max-tokens 16384 \
            > output/g1_second/real-A-sham.json
          python - <<'PY'
          import json
          with open('output/g1_second/real-A-sham.json') as f:
              d=json.load(f)
          print(json.dumps({
              'reserved':d['send_ledger']['reserved'],
              'development_accepted':d['development_accepted'],
              'development_correct':d['development_correct'],
              'complete_triplets':d['fully_analyzable_triplets'],
              'qualification':d['qualification'],
              'scientific_acceptance':False
          }, sort_keys=True))
          PY
      - name: Upload bounded sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3r-g1-second-real-A-sham-20261022
          path: output/g1_second/real-A-sham.json
          if-no-files-found: ignore
          retention-days: 14
