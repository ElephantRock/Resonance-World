name: C3R G1 Semantic Clarity of Instructions 20261028

on:
  push:
    branches:
      - research/c3r-g1-semantic-clarity-20261028
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: c3r-g1-semantic-clarity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline semantic-clarity apparatus tests (no network)
        env:
          PYTHONPATH: "src:scripts"
        run: |
          python -m pip install -e . && python -m pip install pytest
          python -m py_compile scripts/run_c3r_g1_semantic_clarity_live.py
          python -m pytest tests/test_c3r_g1_semantic_clarity_live.py -q

  manifest:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Freeze manifest (programs, both arms' step texts, inputs, truths, 32 slots)
        env:
          PYTHONPATH: "src:scripts"
        run: |
          python -m pip install -e .
          python scripts/run_c3r_g1_semantic_clarity_live.py \
            --workspace "$RUNNER_TEMP/clarity-workspace" \
            --run-id "clarity-${{ github.run_id }}" \
            --session manifest
      - uses: actions/upload-artifact@v4
        with:
          name: clarity-manifest
          path: ${{ runner.temp }}/clarity-workspace/clarity-manifest.json
          if-no-files-found: error
          retention-days: 90

  send:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: [offline-tests, manifest]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        arm: ["a", "b"]
        wave: ["wave1", "wave2"]
    env:
      C3R_ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Workspace and session ledger (0700)
        run: |
          mkdir -p -m 700 "$RUNNER_TEMP/clarity-workspace/clarity-ledger"
          chmod 700 "$RUNNER_TEMP/clarity-workspace/clarity-ledger"
      - name: Download frozen manifest
        uses: actions/download-artifact@v4
        with:
          name: clarity-manifest
          path: ${{ runner.temp }}/clarity-workspace/
      - name: Send session (8 sends, High/4096)
        env:
          PYTHONPATH: "src:scripts"
        run: |
          python -m pip install -e .
          python scripts/run_c3r_g1_semantic_clarity_live.py \
            --workspace "$RUNNER_TEMP/clarity-workspace" \
            --run-id "clarity-${{ github.run_id }}" \
            --session send \
            --arm ${{ matrix.arm }} \
            --wave ${{ matrix.wave }}
      - uses: actions/upload-artifact@v4
        with:
          name: clarity-summary-${{ matrix.arm }}-${{ matrix.wave }}
          path: ${{ runner.temp }}/clarity-workspace/summary-*.json
          if-no-files-found: error
          retention-days: 90
