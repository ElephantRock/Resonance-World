name: G1 Text Reliability Real One-Shot

# One internal, real-provider technical experiment triggered by a unique marker.
on:
  push:
    branches:
      - research/c3r-g2-causal-foundation
    paths:
      - research/c3r_g2/G1_TEXT_FOCUSED_REAL_DISPATCH_20261023.md

permissions:
  contents: read

concurrency:
  group: c3r-g1-text-reliability-real-20261023
  cancel-in-progress: false

jobs:
  text-real-diagnostic:
    if: github.repository == 'ElephantRock/Resonance-World'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      C3R_ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with signer
        run: |
          python -m pip install -e .
          python -m pip install 'cryptography>=42'
      - name: Verify frozen plan and credential before dispatch
        shell: bash
        run: |
          test -n "$C3R_ZAI_API_KEY" || { echo "Missing ZAI_API_KEY; zero sends"; exit 2; }
          python -m resonance_world.c3r_g1_crossed_plan > /dev/null
          python scripts/run_c3r_g1_fourth_crossed_live.py > /dev/null
      - name: Execute genuine GLM-5.3 focused text trial, max 20 sends
        shell: bash
        run: |
          umask 077
          mkdir -m 700 -p "$RUNNER_TEMP/g1-text-reliability" output/c3r_g2
          python scripts/run_c3r_g1_fourth_crossed_live.py \
            --live --run-id g1-text-reliability-20261023-03 \
            --workspace "$RUNNER_TEMP/g1-text-reliability" \
            --family text --workers 2 --max-tokens 16384 \
            > output/c3r_g2/g1-text-reliability-real.json
      - name: Retain redacted result only, never private prompts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g1-text-reliability-real-20261023
          path: output/c3r_g2/g1-text-reliability-real.json
          retention-days: 14
          if-no-files-found: ignore
