name: C3R G1 Third Real Multischema - Explicit Push Marker

on:
  push:
    branches:
      - research/c3r-g2-causal-foundation

permissions:
  contents: read

jobs:
  third-once-marked-commit:
    if: >-
      github.ref == 'refs/heads/research/c3r-g2-causal-foundation' &&
      github.event.head_commit.message == 'G1_THIRD_GLM53_EIGHT_CALLS_ONE_SHOT_20261022_V1' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: c3r-provider-qualification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e .
      - name: Single live eight-request third G1 pilot
        shell: bash
        env:
          C3R_ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${C3R_ZAI_API_KEY:-}" || { echo 'Credential unavailable, zero sends'; exit 2; }
          mkdir -p output/c3r_g1_third
          python scripts/run_c3r_g1_third_two_schema_live.py --live \
            --max-tokens 16384 \
            > output/c3r_g1_third/real-two-schema-neutral.json
          python - <<'PY'
          import json
          with open('output/c3r_g1_third/real-two-schema-neutral.json') as f:
              d=json.load(f)
          print(json.dumps({
              'reserved':d['physical_ledger']['reserved'],
              'development_accepted':d['development_accepted'],
              'complete_triplets':d['complete_triplets'],
              'qualifications':d['qualifications'],
              'scientific_acceptance':False
          }, sort_keys=True))
          PY
      - name: Preserve sanitized third-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3r-g1-third-real-multischema-neutral-20261022
          path: output/c3r_g1_third/real-two-schema-neutral.json
          if-no-files-found: ignore
          retention-days: 14
