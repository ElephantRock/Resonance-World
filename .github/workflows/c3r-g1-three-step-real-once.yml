name: G1 Real Three-Step Agent Procedural Memory

# One unique marker starts three genuinely NEW separate-session real studies.
# No automatic rerun of ambiguous physical model requests.
on:
  push:
    branches:
      - research/c3r-g2-causal-foundation
    paths:
      - research/c3r_g2/G1_THREE_STEP_PROCEDURE_REAL_DISPATCH_20261023.md

permissions:
  contents: read

concurrency:
  group: c3r-g1-three-step-procedure-20261023-single-dispatch
  cancel-in-progress: false

jobs:
  three-step:
    if: github.repository == 'ElephantRock/Resonance-World'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        cohort: ['01', '02', '03']
    env:
      C3R_ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      PYTHONDONTWRITEBYTECODE: '1'
      COHORT: ${{ matrix.cohort }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing model adapter
        run: |
          python -m pip install -e .
          python -m pip install 'cryptography>=42'
      - name: Credential and offline-only preflight
        shell: bash
        run: |
          test -n "$C3R_ZAI_API_KEY" || { echo "ZAI_API_KEY absent; zero sends"; exit 2; }
          python scripts/run_c3r_g1_three_step_procedure_live.py \
            --phase source --run-id "g1-three-step-20261023-$COHORT" >/dev/null
          python scripts/run_c3r_g1_three_step_procedure_live.py \
            --phase holdout --run-id "g1-three-step-20261023-$COHORT" >/dev/null
      - name: Phase 1 — novel source queries and committed private 3-bit agent policy
        shell: bash
        run: |
          umask 077
          mkdir -m 700 -p "$RUNNER_TEMP/g1-three-step-$COHORT" output/c3r_g2
          python scripts/run_c3r_g1_three_step_procedure_live.py \
            --live --phase source \
            --run-id "g1-three-step-20261023-$COHORT" \
            --workspace "$RUNNER_TEMP/g1-three-step-$COHORT" \
            --workers 3 --timeout-seconds 120 --max-tokens 4096 \
            > "output/c3r_g2/g1-three-step-$COHORT-source.json"
      - name: Phase 2 — new Python process, equal-capacity placebo memories, new task
        shell: bash
        run: |
          umask 077
          python scripts/run_c3r_g1_three_step_procedure_live.py \
            --live --phase holdout \
            --run-id "g1-three-step-20261023-$COHORT" \
            --workspace "$RUNNER_TEMP/g1-three-step-$COHORT" \
            --workers 3 --timeout-seconds 120 --max-tokens 4096 \
            > "output/c3r_g2/g1-three-step-$COHORT-holdout.json"
      - name: Retain only redacted reports, never targets or capsule content
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g1-three-step-${{ matrix.cohort }}-20261023
          path: |
            output/c3r_g2/g1-three-step-${{ matrix.cohort }}-source.json
            output/c3r_g2/g1-three-step-${{ matrix.cohort }}-holdout.json
          if-no-files-found: ignore
          retention-days: 14
