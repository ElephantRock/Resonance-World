name: CI

on:
  push:
    branches: [main, "w0/**"]
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Test
        run: pytest -q

  w5b-campaign:
    if: ${{ github.head_ref == 'w5b/modular-social-capital' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: resonance
          POSTGRES_USER: resonance
          POSTGRES_PASSWORD: resonance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resonance -d resonance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FIELD_SHA: 0914a21249261fe61e02c5191f4a36df416c672f
      DSN: postgresql://resonance:resonance@localhost:5432/resonance
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: resonance
      PGPASSWORD: resonance
    steps:
      - uses: actions/checkout@v4
      - name: Announce authoritative W5B CI run
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh issue comment 37 --repo ElephantRock/Resonance-World
          --body "W5B authoritative main campaign started on head **$GITHUB_SHA**. Actions run: https://github.com/ElephantRock/Resonance-World/actions/runs/$GITHUB_RUN_ID"
      - name: Checkout pinned Resonance Field
        run: |
          git clone https://github.com/ElephantRock/Resonance-Field.git ../field
          git -C ../field checkout "$FIELD_SHA"
          test "$(git -C ../field rev-parse HEAD)" = "$FIELD_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install World and Field
        run: python -m pip install -e '../field[dev]' -e .
      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Execute complete W5B campaign
        env:
          FIELD_DIR: ${{ github.workspace }}/../field
        run: bash scripts/run_w5b_campaign.sh
      - uses: actions/upload-artifact@v4
        with:
          name: w5b-authoritative-evidence
          path: output/w5b
          if-no-files-found: error
          retention-days: 90
      - name: Publish authoritative W5B result
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATUS=$(jq -r '.status' output/w5b/w5b-synthesis.json)
          D1=$(jq -r '.discovery.w5b_01.effect' output/w5b/w5b-synthesis.json)
          D2=$(jq -r '.discovery.w5b_02.effect' output/w5b/w5b-synthesis.json)
          D3=$(jq -r '.discovery.w5b_03.effect' output/w5b/w5b-synthesis.json)
          D4=$(jq -r '.discovery.w5b_04.effect' output/w5b/w5b-synthesis.json)
          R1=$(jq -r '.replication.w5b_01.effect' output/w5b/w5b-synthesis.json)
          R2=$(jq -r '.replication.w5b_02.effect' output/w5b/w5b-synthesis.json)
          R3=$(jq -r '.replication.w5b_03.effect' output/w5b/w5b-synthesis.json)
          R4=$(jq -r '.replication.w5b_04.effect' output/w5b/w5b-synthesis.json)
          GATE=$(jq -r '.replication_gate' output/w5b/w5b-synthesis.json)
          gh issue comment 37 --repo ElephantRock/Resonance-World --body "## W5B Modular Social Capital — AUTHORITATIVE MAIN

- Status: **$STATUS**
- W5B-01 discovery/replication: **$D1 / $R1**
- W5B-02 discovery/replication: **$D2 / $R2**
- W5B-03 discovery/replication: **$D3 / $R3**
- W5B-04 discovery/replication: **$D4 / $R4**
- Replication gate: **$GATE**
- Head SHA: **$GITHUB_SHA**
- Actions run: https://github.com/ElephantRock/Resonance-World/actions/runs/$GITHUB_RUN_ID

PairModule transports existing W4 state only. The outcome law does not read module identity/history, and no generic procedure interpreter is present."
          gh issue close 37 --repo ElephantRock/Resonance-World --reason completed
