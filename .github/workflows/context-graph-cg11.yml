name: Context Graph CG-11 Balanced Stopping

on:
  push:
    branches: ["experiment/context-graph"]
    paths:
      - ".github/workflows/context-graph-cg11.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: context-graph-cg11-${{ github.ref }}
  cancel-in-progress: false

env:
  FIELD_REPOSITORY: https://github.com/ElephantRock/Resonance-Field.git
  FIELD_SHA: 5cee5ff1c75d027f5c78c681c5f306cab2c85bf3
  PROTOCOL_FREEZE_SHA: 4b336f824f3bbcbfde425de1920dfabd6d23b738
  EVALUATOR_FREEZE_SHA: fdc7368d90e5deeb5c770ad2101eca8e3f37e721
  PREFLIGHT_RUN_ID: "31632376342"
  PGHOST: localhost
  PGPORT: "5432"
  PGUSER: resonance
  PGPASSWORD: resonance

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove CG-11 protocol and source seeds stayed frozen
        run: >-
          git diff --exit-code
          "$PROTOCOL_FREEZE_SHA" HEAD --
          configs/context_graph/cg11-fresh-source.json
          experiments/context_graph/cg11-w3-balanced-stopping.json
      - name: Prove evaluator stayed frozen after successful preflight
        run: >-
          git diff --exit-code
          "$EVALUATOR_FREEZE_SHA" HEAD --
          experiments/context_graph/run_cg11_w3_balanced_stopping.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Lint and compile frozen evaluator
        run: |
          ruff check experiments/context_graph/run_cg11_w3_balanced_stopping.py
          python -m py_compile experiments/context_graph/run_cg11_w3_balanced_stopping.py
      - name: Verify scientific isolation
        run: |
          PYTHONPATH=. python - <<'PY'
          import inspect
          import json
          from pathlib import Path

          from experiments.context_graph.run_cg10_balanced_stopping import choose_stop, stopping_observables
          from experiments.context_graph.run_cg6_adaptive_acquisition import choose_cell
          from resonance_world.w4a_joint_learning import JointEnvironment

          config = json.loads(
              Path("experiments/context_graph/cg11-w3-balanced-stopping.json").read_text()
          )
          assert config["acquisition"]["policy"] == "uniform_round_robin"
          assert config["acquisition"]["minimum_stop_budget"] == 60
          assert config["acquisition"]["hard_stop_budget"] == 168
          assert config["fresh_source"]["experiment_number"] == 63
          assert config["evaluation"]["bootstrap"]["noninferiority_margin"] == -0.015
          source = inspect.getsource(choose_cell)
          uniform_block = source.split('if policy == "uniform_round_robin":', 1)[1].split(
              'if policy == "uncertainty_only":', 1
          )[0]
          stop_source = inspect.getsource(stopping_observables) + inspect.getsource(choose_stop)
          assert ".states" not in uniform_block
          assert ".states" not in stop_source
          forbidden = {
              "graph", "context_graph", "evidence", "claims",
              "relationship_state", "organization_memory", "acquisition_state",
              "stopping_state",
          }
          params = set(inspect.signature(JointEnvironment.evaluate).parameters)
          assert not forbidden.intersection(params), params
          PY

  fresh-source:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 100
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: resonance
          POSTGRES_USER: resonance
          POSTGRES_PASSWORD: resonance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resonance -d resonance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout frozen Resonance World head
        uses: actions/checkout@v4
        with:
          path: world
          fetch-depth: 0
      - name: Prove protocol and source seeds stayed frozen
        run: >-
          git -C world diff --exit-code
          "$PROTOCOL_FREEZE_SHA" HEAD --
          configs/context_graph/cg11-fresh-source.json
          experiments/context_graph/cg11-w3-balanced-stopping.json
      - name: Prove evaluator stayed frozen
        run: >-
          git -C world diff --exit-code
          "$EVALUATOR_FREEZE_SHA" HEAD --
          experiments/context_graph/run_cg11_w3_balanced_stopping.py
      - name: Checkout pinned Resonance Field
        run: |
          git clone "$FIELD_REPOSITORY" field
          git -C field checkout "$FIELD_SHA"
          test "$(git -C field rev-parse HEAD)" = "$FIELD_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            world/pyproject.toml
            field/pyproject.toml
      - run: python -m pip install -e 'field[dev]' -e world
      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Generate thirty untouched CG-11 source Fields
        env:
          DSN: postgresql://resonance:resonance@localhost:5432/resonance
        run: |
          mkdir -p "$GITHUB_WORKSPACE/source-step" "$GITHUB_WORKSPACE/raw"
          (
            cd field
            python -m resonance.experiments.lifecycle_step_cli \
              --config "$GITHUB_WORKSPACE/world/configs/context_graph/cg11-fresh-source.json" \
              --experiment 63 \
              --code-sha "$FIELD_SHA" \
              --dsn "$DSN" \
              --output-dir "$GITHUB_WORKSPACE/source-step"
          )
      - name: Export immutable fresh Field evidence
        env:
          DSN: postgresql://resonance:resonance@localhost:5432/resonance
          CAMPAIGN: cg11-context-graph-balanced-stopping-v0.1
        run: |
          psql "$DSN" --csv -c "
            SELECT run_id::text, seed, arm_label, environment::text, metrics::text, completed_at
            FROM integration_campaign_runs
            WHERE campaign_name = '$CAMPAIGN'
              AND experiment_number = 63
              AND arm_label = 'immortal_control'
            ORDER BY seed
          " > raw/runs.csv
          psql "$DSN" --csv -c "
            SELECT o.run_id::text, o.cycle, o.task_id::text, o.task_domain,
                   o.required_skill, o.winner_agent_id::text, o.winner_slot,
                   o.success, o.winning_price, o.task_budget, o.created_at
            FROM integration_campaign_outcomes o
            JOIN integration_campaign_runs r ON r.run_id = o.run_id
            WHERE r.campaign_name = '$CAMPAIGN'
              AND r.experiment_number = 63
              AND r.arm_label = 'immortal_control'
            ORDER BY r.seed, o.cycle
          " > raw/outcomes.csv
          psql "$DSN" --csv -c "
            SELECT o.run_id::text, t.task_id::text, t.requester_agent_id::text
            FROM integration_campaign_outcomes o
            JOIN integration_campaign_runs r ON r.run_id = o.run_id
            JOIN market_tasks t ON t.task_id = o.task_id
            WHERE r.campaign_name = '$CAMPAIGN'
              AND r.experiment_number = 63
              AND r.arm_label = 'immortal_control'
            ORDER BY r.seed, t.task_id
          " > raw/tasks.csv
          psql "$DSN" --csv -c "
            SELECT o.run_id::text, b.task_id::text, b.bidder_agent_id::text,
                   b.price, b.confidence, b.status
            FROM integration_campaign_outcomes o
            JOIN integration_campaign_runs r ON r.run_id = o.run_id
            JOIN market_bids b ON b.task_id = o.task_id
            WHERE r.campaign_name = '$CAMPAIGN'
              AND r.experiment_number = 63
              AND r.arm_label = 'immortal_control'
            ORDER BY r.seed, b.task_id, b.bidder_agent_id
          " > raw/bids.csv
      - name: Materialize fresh private capsules
        run: >-
          python -m resonance_world.w3_source_export
          ../raw/runs.csv ../raw/outcomes.csv ../raw/tasks.csv ../raw/bids.csv
          output/cg11-source
        working-directory: world
      - name: Enforce untouched cohort identity and state boundary
        working-directory: world
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          expected = [
              8833, 8954, 9075, 9196, 9317, 9438, 9559, 9680, 9801, 9922,
              10043, 10164, 10285, 10406, 10527, 10648, 10769, 10890, 11011,
              11132, 11253, 11374, 11495, 11616, 11737, 11858, 11979, 12100,
              12221, 12342,
          ]
          prohibited = {
              121, 242, 363, 484, 605, 726, 847, 968, 1089, 1210, 1331,
              1452, 1573, 1694, 1815, 1936, 2057, 2178, 2299, 2420, 2541,
              2662, 2783, 2904, 3025, 3146, 3267, 3388, 3509, 3630, 3751,
              3872, 3993, 4114, 4235, 4356, 4477, 4598, 4719, 4840, 4961,
              5082, 5203, 5324, 5445, 5566, 5687, 5808, 5929, 6050, 6171,
              6292, 6413, 6534, 6655, 6776, 6897, 7018, 7139, 7260, 7381,
              7502, 7623, 7744, 7865, 7986, 8107, 8228, 8349, 8470, 8591,
          }
          summary = json.loads(Path("output/cg11-source/w3-01-source-summary.json").read_text())
          assert summary["field_count"] == 30, summary
          assert summary["agent_count"] == 360, summary
          assert summary["pair_edge_count"] == 1980, summary
          assert summary["seeds"] == expected, summary
          assert not set(expected).intersection(prohibited)
          public = Path("output/cg11-source/candidates.jsonl").read_text()
          assert "practice_by_skill" not in public
          PY
          sha256sum output/cg11-source/capsules.private.jsonl ../raw/*.csv > output/cg11-source/source-integrity.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: context-graph-cg11-fresh-source
          path: |
            world/output/cg11-source
            raw
            source-step
          if-no-files-found: error
          retention-days: 90

  evaluate:
    needs: fresh-source
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove protocol stayed frozen through source generation
        run: >-
          git diff --exit-code
          "$PROTOCOL_FREEZE_SHA" HEAD --
          configs/context_graph/cg11-fresh-source.json
          experiments/context_graph/cg11-w3-balanced-stopping.json
      - name: Prove evaluator stayed frozen through source generation
        run: >-
          git diff --exit-code
          "$EVALUATOR_FREEZE_SHA" HEAD --
          experiments/context_graph/run_cg11_w3_balanced_stopping.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@v4
        with:
          name: context-graph-cg11-fresh-source
          path: source
      - name: Validate evaluator before opening private capsule payload
        run: ruff check experiments/context_graph/run_cg11_w3_balanced_stopping.py
      - name: Execute frozen CG-11
        run: |
          CAPSULES=source/world/output/cg11-source/capsules.private.jsonl
          SUMMARY=source/world/output/cg11-source/w3-01-source-summary.json
          SOURCE_SHA=$(sha256sum "$CAPSULES" | awk '{print $1}')
          PYTHONPATH=. python experiments/context_graph/run_cg11_w3_balanced_stopping.py \
            --config experiments/context_graph/cg11-w3-balanced-stopping.json \
            --capsules "$CAPSULES" \
            --source-summary "$SUMMARY" \
            --protocol-freeze-sha "$PROTOCOL_FREEZE_SHA" \
            --source-artifact-sha256 "$SOURCE_SHA" \
            --output output/context_graph/cg11-w3-balanced-stopping-result.json
      - name: Verify machine result integrity
        if: always()
        run: |
          if [ -f output/context_graph/cg11-w3-balanced-stopping-result.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path

          path = Path("output/context_graph/cg11-w3-balanced-stopping-result.json")
          result = json.loads(path.read_text())
          assert result["protocol_freeze_sha"] == "4b336f824f3bbcbfde425de1920dfabd6d23b738"
          assert result["confirmatory_claim"] is True
          assert len(result["field_ids"]) == 30
          assert result["metrics"]["stopped_graph"]["decisions"] == 180
          assert result["diagnostics"]["maximum_stopping_probe_events"] <= 168
          assert "practice_by_skill" not in path.read_text()
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: context-graph-cg11-result
          path: output/context_graph/cg11-w3-balanced-stopping-result.json
          if-no-files-found: warn
          retention-days: 90
      - name: Enforce all preregistered CG-11 primary gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path("output/context_graph/cg11-w3-balanced-stopping-result.json").read_text()
          )
          failed = [name for name, passed in result["gate_results"].items() if not passed]
          print(json.dumps(result["diagnostics"], indent=2, sort_keys=True))
          print(json.dumps(result["gate_results"], indent=2, sort_keys=True))
          assert not failed, f"CG-11 failed preregistered gates: {failed}"
          assert result["passed"] is True
          PY
