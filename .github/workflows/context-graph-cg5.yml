name: Context Graph CG-5 Fresh Cohort

on:
  push:
    branches: ["experiment/context-graph"]
    paths:
      - ".github/workflows/context-graph-cg5.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: context-graph-cg5-${{ github.ref }}
  cancel-in-progress: false

env:
  FIELD_REPOSITORY: https://github.com/ElephantRock/Resonance-Field.git
  FIELD_SHA: 5cee5ff1c75d027f5c78c681c5f306cab2c85bf3
  PROTOCOL_FREEZE_SHA: 2e55d858192e59e5bfbd18b937c73a937f41a054
  PGHOST: localhost
  PGPORT: "5432"
  PGUSER: resonance
  PGPASSWORD: resonance

jobs:
  fresh-source:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: resonance
          POSTGRES_USER: resonance
          POSTGRES_PASSWORD: resonance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resonance -d resonance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout frozen Resonance World head
        uses: actions/checkout@v4
        with:
          path: world
          fetch-depth: 0
      - name: Prove protocol and source seeds stayed frozen
        run: >-
          git -C world diff --exit-code
          "$PROTOCOL_FREEZE_SHA" HEAD --
          configs/context_graph/cg5-fresh-source.json
          experiments/context_graph/cg5-w3-active-measurement.json
      - name: Checkout pinned Resonance Field
        run: |
          git clone "$FIELD_REPOSITORY" field
          git -C field checkout "$FIELD_SHA"
          test "$(git -C field rev-parse HEAD)" = "$FIELD_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            world/pyproject.toml
            field/pyproject.toml
      - run: python -m pip install -e 'field[dev]' -e world
      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Generate fifteen untouched source Fields
        env:
          DSN: postgresql://resonance:resonance@localhost:5432/resonance
        run: |
          mkdir -p "$GITHUB_WORKSPACE/source-step" "$GITHUB_WORKSPACE/raw"
          (
            cd field
            python -m resonance.experiments.lifecycle_step_cli \
              --config "$GITHUB_WORKSPACE/world/configs/context_graph/cg5-fresh-source.json" \
              --experiment 63 \
              --code-sha "$FIELD_SHA" \
              --dsn "$DSN" \
              --output-dir "$GITHUB_WORKSPACE/source-step"
          )
      - name: Export immutable fresh Field evidence
        env:
          DSN: postgresql://resonance:resonance@localhost:5432/resonance
          CAMPAIGN: cg5-context-graph-fresh-source-v0.1
        run: |
          psql "$DSN" --csv -c "
            SELECT run_id::text, seed, arm_label, environment::text, metrics::text, completed_at
            FROM integration_campaign_runs
            WHERE campaign_name = '$CAMPAIGN'
              AND experiment_number = 63
              AND arm_label = 'immortal_control'
            ORDER BY seed
          " > raw/runs.csv
          psql "$DSN" --csv -c "
            SELECT o.run_id::text, o.cycle, o.task_id::text, o.task_domain,
                   o.required_skill, o.winner_agent_id::text, o.winner_slot,
                   o.success, o.winning_price, o.task_budget, o.created_at
            FROM integration_campaign_outcomes o
            JOIN integration_campaign_runs r ON r.run_id = o.run_id
            WHERE r.campaign_name = '$CAMPAIGN'
              AND r.experiment_number = 63
              AND r.arm_label = 'immortal_control'
            ORDER BY r.seed, o.cycle
          " > raw/outcomes.csv
          psql "$DSN" --csv -c "
            SELECT o.run_id::text, t.task_id::text, t.requester_agent_id::text
            FROM integration_campaign_outcomes o
            JOIN integration_campaign_runs r ON r.run_id = o.run_id
            JOIN market_tasks t ON t.task_id = o.task_id
            WHERE r.campaign_name = '$CAMPAIGN'
              AND r.experiment_number = 63
              AND r.arm_label = 'immortal_control'
            ORDER BY r.seed, t.task_id
          " > raw/tasks.csv
          psql "$DSN" --csv -c "
            SELECT o.run_id::text, b.task_id::text, b.bidder_agent_id::text,
                   b.price, b.confidence, b.status
            FROM integration_campaign_outcomes o
            JOIN integration_campaign_runs r ON r.run_id = o.run_id
            JOIN market_bids b ON b.task_id = o.task_id
            WHERE r.campaign_name = '$CAMPAIGN'
              AND r.experiment_number = 63
              AND r.arm_label = 'immortal_control'
            ORDER BY r.seed, b.task_id, b.bidder_agent_id
          " > raw/bids.csv
      - name: Materialize fresh private capsules
        run: >-
          python -m resonance_world.w3_source_export
          raw/runs.csv raw/outcomes.csv raw/tasks.csv raw/bids.csv
          output/cg5-source
        working-directory: world
      - name: Enforce fresh cohort identity and state boundary
        working-directory: world
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          expected = [1452, 1573, 1694, 1815, 1936, 2057, 2178, 2299, 2420, 2541, 2662, 2783, 2904, 3025, 3146]
          summary = json.loads(Path("output/cg5-source/w3-01-source-summary.json").read_text())
          assert summary["field_count"] == 15, summary
          assert summary["agent_count"] == 180, summary
          assert summary["pair_edge_count"] == 990, summary
          assert summary["seeds"] == expected, summary
          assert not set(expected).intersection({121, 242, 363, 484, 605, 726, 847, 968, 1089, 1210, 1331})
          public = Path("output/cg5-source/candidates.jsonl").read_text()
          assert "practice_by_skill" not in public
          PY
          sha256sum output/cg5-source/capsules.private.jsonl raw/*.csv > output/cg5-source/source-integrity.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: context-graph-cg5-fresh-source
          path: |
            world/output/cg5-source
            raw
            source-step
          if-no-files-found: error
          retention-days: 90

  evaluate:
    needs: fresh-source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove CG-5 protocol stayed frozen through source generation
        run: >-
          git diff --exit-code
          "$PROTOCOL_FREEZE_SHA" HEAD --
          configs/context_graph/cg5-fresh-source.json
          experiments/context_graph/cg5-w3-active-measurement.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@v4
        with:
          name: context-graph-cg5-fresh-source
          path: source
      - name: Validate evaluator before opening private capsule payload
        run: ruff check experiments/context_graph/run_cg5_w3_active_measurement.py
      - name: Execute frozen CG-5
        run: |
          CAPSULES=source/world/output/cg5-source/capsules.private.jsonl
          SUMMARY=source/world/output/cg5-source/w3-01-source-summary.json
          SOURCE_SHA=$(sha256sum "$CAPSULES" | awk '{print $1}')
          python experiments/context_graph/run_cg5_w3_active_measurement.py \
            --config experiments/context_graph/cg5-w3-active-measurement.json \
            --capsules "$CAPSULES" \
            --source-summary "$SUMMARY" \
            --protocol-freeze-sha "$PROTOCOL_FREEZE_SHA" \
            --source-artifact-sha256 "$SOURCE_SHA" \
            --output output/context_graph/cg5-w3-active-measurement-result.json
      - name: Verify result integrity
        if: always()
        run: |
          if [ -f output/context_graph/cg5-w3-active-measurement-result.json ]; then
            python - <<'PY'
            import json
            from pathlib import Path
            result = json.loads(Path("output/context_graph/cg5-w3-active-measurement-result.json").read_text())
            assert result["protocol_freeze_sha"] == "2e55d858192e59e5bfbd18b937c73a937f41a054"
            assert result["confirmatory_claim"] is True
            assert len(result["field_ids"]) == 15
            assert result["metrics"]["revised_coverage_graph"]["decisions"] == 90
            text = Path("output/context_graph/cg5-w3-active-measurement-result.json").read_text()
            assert "practice_by_skill" not in text
            PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: context-graph-cg5-result
          path: output/context_graph/cg5-w3-active-measurement-result.json
          if-no-files-found: warn
          retention-days: 90
      - name: Enforce all preregistered CG-5 gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("output/context_graph/cg5-w3-active-measurement-result.json").read_text())
          failed = [name for name, passed in result["gate_results"].items() if not passed]
          print(json.dumps(result["diagnostics"], indent=2, sort_keys=True))
          print(json.dumps(result["gate_results"], indent=2, sort_keys=True))
          assert not failed, f"CG-5 failed preregistered gates: {failed}"
          assert result["passed"] is True
          PY
