name: Context Graph CG-6 Adaptive Acquisition

on:
  push:
    branches: ["experiment/context-graph"]
    paths:
      - ".github/workflows/context-graph-cg6.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: context-graph-cg6-${{ github.ref }}
  cancel-in-progress: false

jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove CG-5 predecessor records remain frozen
        run: |
          git diff --exit-code 1c56bf2533aa164e40a0073c5bc4bdeb32083510 HEAD -- \
            experiments/context_graph/cg5-w3-active-measurement.json \
            experiments/context_graph/cg5-w3-active-measurement-result.json \
            experiments/context_graph/run_cg5_w3_active_measurement.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Download already-unblinded CG-5 source cohort
        uses: actions/download-artifact@v4
        with:
          name: context-graph-cg5-fresh-source
          path: source
          github-token: ${{ github.token }}
          repository: ElephantRock/Resonance-World
          run-id: 31622647635
      - name: Lint CG-6 calibration runner
        run: ruff check experiments/context_graph/run_cg6_adaptive_acquisition.py
      - name: Run exploratory adaptive-acquisition calibration
        run: |
          CAPSULES=source/world/output/cg5-source/capsules.private.jsonl
          SUMMARY=source/world/output/cg5-source/w3-01-source-summary.json
          PYTHONPATH=. python experiments/context_graph/run_cg6_adaptive_acquisition.py \
            --config experiments/context_graph/cg6-adaptive-acquisition-calibration.json \
            --capsules "$CAPSULES" \
            --source-summary "$SUMMARY" \
            --cg5-result experiments/context_graph/cg5-w3-active-measurement-result.json \
            --output output/context_graph/cg6-adaptive-acquisition-calibration-result.json
      - name: Enforce CG-5 exact replay boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path("output/context_graph/cg6-adaptive-acquisition-calibration-result.json").read_text()
          )
          replay = result["integrity"]["cg5_fixed_six_replay"]
          assert replay["exact_event_count_replay"], replay
          assert replay["expected_success_replay_within_1e_12"], replay
          assert replay["flat_replay_within_1e_12"], replay
          assert result["confirmatory_claim"] is False
          print(json.dumps(result["selection"], indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: context-graph-cg6-calibration
          path: output/context_graph/cg6-adaptive-acquisition-calibration-result.json
          if-no-files-found: warn
          retention-days: 90
