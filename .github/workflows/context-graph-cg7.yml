name: Context Graph CG-7 Measurement Economy

on:
  push:
    branches: ["experiment/context-graph"]
    paths:
      - ".github/workflows/context-graph-cg7.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: context-graph-cg7-${{ github.ref }}
  cancel-in-progress: false

env:
  FIELD_REPOSITORY: https://github.com/ElephantRock/Resonance-Field.git
  FIELD_SHA: 5cee5ff1c75d027f5c78c681c5f306cab2c85bf3
  PROTOCOL_FREEZE_SHA: d4a75110871046ef1f18f10f9c9ef6fba0bc3c1c
  EVALUATOR_PREFLIGHT_SHA: 1c5e900c4e7bdb405ea612c3490386d3448d803e
  PGHOST: localhost
  PGPORT: "5432"
  PGUSER: resonance
  PGPASSWORD: resonance

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove CG-7 protocol and fresh seeds stayed frozen
        run: >-
          git diff --exit-code
          "$PROTOCOL_FREEZE_SHA" HEAD --
          configs/context_graph/cg7-fresh-source.json
          experiments/context_graph/cg7-w3-measurement-economy.json
      - name: Prove evaluator stayed frozen after successful preflight
        run: >-
          git diff --exit-code
          "$EVALUATOR_PREFLIGHT_SHA" HEAD --
          experiments/context_graph/run_cg6_adaptive_acquisition.py
          experiments/context_graph/run_cg7_w3_measurement_economy.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Lint and compile frozen evaluator
        run: |
          ruff check \
            experiments/context_graph/run_cg6_adaptive_acquisition.py \
            experiments/context_graph/run_cg7_w3_measurement_economy.py
          python -m py_compile \
            experiments/context_graph/run_cg6_adaptive_acquisition.py \
            experiments/context_graph/run_cg7_w3_measurement_economy.py
      - name: Verify uniform acquisition does not require evaluator state
        run: |
          PYTHONPATH=. python - <<'PY'
          from experiments.context_graph.run_cg4m_measurement_sufficiency import EstimatorSpec
          from experiments.context_graph.run_cg6_adaptive_acquisition import ProbeEvent, choose_cell
          from resonance_world.context_graph_w3_endogenous import CG4Mission, EndogenousField

          field = EndogenousField(
              field_id="preflight",
              states={},
              claims=(),
              belief_snapshot={},
              current_members=frozenset({"agent-a"}),
              departed_members=frozenset(),
              coordinator_id="agent-a",
              as_of=0,
              emitted_claims=0,
              duplicate_observation_groups=0,
              conflicting_observation_groups=0,
              low_confidence_claims=0,
          )
          cell = ("agent-a", "urban_heat")
          event = ProbeEvent(cell, 0, "event", 1, ())
          chosen = choose_cell(
              policy="uniform_round_robin",
              field=field,
              claims=[],
              available={cell: event},
              mission_rows=[CG4Mission("m", "urban_heat", "water_systems")],
              spec=EstimatorSpec("w", "wilson_lower", 3, 0.35),
              min_confidence=0.7,
              weights={
                  "selected_role_bonus": 0.0,
                  "plausible_challenger_bonus": 0.0,
                  "support_deficit_bonus": 0.0,
                  "ambiguity_margin": 0.0,
              },
          )
          assert chosen == cell
          PY
      - name: Verify outcome-law isolation
        run: |
          PYTHONPATH=. python - <<'PY'
          import inspect
          from resonance_world.w4a_joint_learning import JointEnvironment

          forbidden = {
              "graph", "context_graph", "evidence", "claims",
              "relationship_state", "organization_memory", "acquisition_state",
          }
          params = set(inspect.signature(JointEnvironment.evaluate).parameters)
          assert not forbidden.intersection(params), params
          PY

  fresh-source:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: resonance
          POSTGRES_USER: resonance
          POSTGRES_PASSWORD: resonance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resonance -d resonance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout frozen Resonance World head
        uses: actions/checkout@v4
        with:
          path: world
          fetch-depth: 0
      - name: Prove protocol and source seeds stayed frozen
        run: >-
          git -C world diff --exit-code
          "$PROTOCOL_FREEZE_SHA" HEAD --
          configs/context_graph/cg7-fresh-source.json
          experiments/context_graph/cg7-w3-measurement-economy.json
      - name: Prove evaluator stayed frozen after successful preflight
        run: >-
          git -C world diff --exit-code
          "$EVALUATOR_PREFLIGHT_SHA" HEAD --
          experiments/context_graph/run_cg6_adaptive_acquisition.py
          experiments/context_graph/run_cg7_w3_measurement_economy.py
      - name: Checkout pinned Resonance Field
        run: |
          git clone "$FIELD_REPOSITORY" field
          git -C field checkout "$FIELD_SHA"
          test "$(git -C field rev-parse HEAD)" = "$FIELD_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            world/pyproject.toml
            field/pyproject.toml
      - run: python -m pip install -e 'field[dev]' -e world
      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Generate fifteen untouched CG-7 source Fields
        env:
          DSN: postgresql://resonance:resonance@localhost:5432/resonance
        run: |
          mkdir -p "$GITHUB_WORKSPACE/source-step" "$GITHUB_WORKSPACE/raw"
          (
            cd field
            python -m resonance.experiments.lifecycle_step_cli \
              --config "$GITHUB_WORKSPACE/world/configs/context_graph/cg7-fresh-source.json" \
              --experiment 63 \
              --code-sha "$FIELD_SHA" \
              --dsn "$DSN" \
              --output-dir "$GITHUB_WORKSPACE/source-step"
          )
      - name: Export immutable fresh Field evidence
        env:
          DSN: postgresql://resonance:resonance@localhost:5432/resonance
          CAMPAIGN: cg7-context-graph-measurement-economy-v0.1
        run: |
          psql "$DSN" --csv -c "
            SELECT run_id::text, seed, arm_label, environment::text, metrics::text, completed_at
            FROM integration_campaign_runs
            WHERE campaign_name = '$CAMPAIGN'
              AND experiment_number = 63
              AND arm_label = 'immortal_control'
            ORDER BY seed
          " > raw/runs.csv
          psql "$DSN" --csv -c "
            SELECT o.run_id::text, o.cycle, o.task_id::text, o.task_domain,
                   o.required_skill, o.winner_agent_id::text, o.winner_slot,
                   o.success, o.winning_price, o.task_budget, o.created_at
            FROM integration_campaign_outcomes o
            JOIN integration_campaign_runs r ON r.run_id = o.run_id
            WHERE r.campaign_name = '$CAMPAIGN'
              AND r.experiment_number = 63
              AND r.arm_label = 'immortal_control'
            ORDER BY r.seed, o.cycle
          " > raw/outcomes.csv
          psql "$DSN" --csv -c "
            SELECT o.run_id::text, t.task_id::text, t.requester_agent_id::text
            FROM integration_campaign_outcomes o
            JOIN integration_campaign_runs r ON r.run_id = o.run_id
            JOIN market_tasks t ON t.task_id = o.task_id
            WHERE r.campaign_name = '$CAMPAIGN'
              AND r.experiment_number = 63
              AND r.arm_label = 'immortal_control'
            ORDER BY r.seed, t.task_id
          " > raw/tasks.csv
          psql "$DSN" --csv -c "
            SELECT o.run_id::text, b.task_id::text, b.bidder_agent_id::text,
                   b.price, b.confidence, b.status
            FROM integration_campaign_outcomes o
            JOIN integration_campaign_runs r ON r.run_id = o.run_id
            JOIN market_bids b ON b.task_id = o.task_id
            WHERE r.campaign_name = '$CAMPAIGN'
              AND r.experiment_number = 63
              AND r.arm_label = 'immortal_control'
            ORDER BY r.seed, b.task_id, b.bidder_agent_id
          " > raw/bids.csv
      - name: Materialize fresh private capsules
        run: >-
          python -m resonance_world.w3_source_export
          ../raw/runs.csv ../raw/outcomes.csv ../raw/tasks.csv ../raw/bids.csv
          output/cg7-source
        working-directory: world
      - name: Enforce untouched cohort identity and state boundary
        working-directory: world
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          expected = [3630, 3751, 3872, 3993, 4114, 4235, 4356, 4477, 4598, 4719, 4840, 4961, 5082, 5203, 5324]
          prohibited = {
              121, 242, 363, 484, 605, 726, 847, 968, 1089, 1210, 1331,
              1452, 1573, 1694, 1815, 1936, 2057, 2178, 2299, 2420, 2541,
              2662, 2783, 2904, 3025, 3146, 3267, 3388, 3509,
          }
          summary = json.loads(Path("output/cg7-source/w3-01-source-summary.json").read_text())
          assert summary["field_count"] == 15, summary
          assert summary["agent_count"] == 180, summary
          assert summary["pair_edge_count"] == 990, summary
          assert summary["seeds"] == expected, summary
          assert not set(expected).intersection(prohibited)
          public = Path("output/cg7-source/candidates.jsonl").read_text()
          assert "practice_by_skill" not in public
          PY
          sha256sum output/cg7-source/capsules.private.jsonl ../raw/*.csv > output/cg7-source/source-integrity.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: context-graph-cg7-fresh-source
          path: |
            world/output/cg7-source
            raw
            source-step
          if-no-files-found: error
          retention-days: 90

  evaluate:
    needs: fresh-source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove protocol stayed frozen through source generation
        run: >-
          git diff --exit-code
          "$PROTOCOL_FREEZE_SHA" HEAD --
          configs/context_graph/cg7-fresh-source.json
          experiments/context_graph/cg7-w3-measurement-economy.json
      - name: Prove evaluator stayed frozen after successful preflight
        run: >-
          git diff --exit-code
          "$EVALUATOR_PREFLIGHT_SHA" HEAD --
          experiments/context_graph/run_cg6_adaptive_acquisition.py
          experiments/context_graph/run_cg7_w3_measurement_economy.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@v4
        with:
          name: context-graph-cg7-fresh-source
          path: source
      - name: Validate evaluator before opening private capsule payload
        run: |
          ruff check \
            experiments/context_graph/run_cg6_adaptive_acquisition.py \
            experiments/context_graph/run_cg7_w3_measurement_economy.py
      - name: Execute frozen CG-7
        run: |
          CAPSULES=source/world/output/cg7-source/capsules.private.jsonl
          SUMMARY=source/world/output/cg7-source/w3-01-source-summary.json
          SOURCE_SHA=$(sha256sum "$CAPSULES" | awk '{print $1}')
          PYTHONPATH=. python experiments/context_graph/run_cg7_w3_measurement_economy.py \
            --config experiments/context_graph/cg7-w3-measurement-economy.json \
            --capsules "$CAPSULES" \
            --source-summary "$SUMMARY" \
            --protocol-freeze-sha "$PROTOCOL_FREEZE_SHA" \
            --source-artifact-sha256 "$SOURCE_SHA" \
            --output output/context_graph/cg7-w3-measurement-economy-result.json
      - name: Verify machine result integrity
        if: always()
        run: |
          if [ -f output/context_graph/cg7-w3-measurement-economy-result.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path

          path = Path("output/context_graph/cg7-w3-measurement-economy-result.json")
          result = json.loads(path.read_text())
          assert result["protocol_freeze_sha"] == "d4a75110871046ef1f18f10f9c9ef6fba0bc3c1c"
          assert result["confirmatory_claim"] is True
          assert len(result["field_ids"]) == 15
          assert result["metrics"]["uniform72_graph"]["decisions"] == 90
          assert "practice_by_skill" not in path.read_text()
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: context-graph-cg7-result
          path: output/context_graph/cg7-w3-measurement-economy-result.json
          if-no-files-found: warn
          retention-days: 90
      - name: Enforce all preregistered CG-7 gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path("output/context_graph/cg7-w3-measurement-economy-result.json").read_text()
          )
          failed = [name for name, passed in result["gate_results"].items() if not passed]
          print(json.dumps(result["diagnostics"], indent=2, sort_keys=True))
          print(json.dumps(result["gate_results"], indent=2, sort_keys=True))
          assert not failed, f"CG-7 failed preregistered gates: {failed}"
          assert result["passed"] is True
          PY
