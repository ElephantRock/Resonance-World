name: Context Graph Experiment

on:
  push:
    branches: ["experiment/context-graph"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff scaffold files
        run: >-
          ruff check
          src/resonance_world/context_graph_experiment.py
          tests/test_context_graph_experiment.py
          experiments/context_graph/run_fixture.py
      - name: Semantic scaffold tests
        run: pytest -q tests/test_context_graph_experiment.py
      - name: Run preregistered synthetic fixture
        run: >-
          python experiments/context_graph/run_fixture.py
          --config experiments/context_graph/experiment.json
          --output output/context_graph/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: context-graph-fixture-result
          path: output/context_graph/result.json
          if-no-files-found: error
          retention-days: 90

  cg1-w3:
    needs: scaffold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Download pinned W3 discovery evidence
        uses: actions/download-artifact@v4
        with:
          name: w3-discovery-source
          path: source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ElephantRock/Resonance-World
          run-id: 31463354353
      - name: Verify CG-1 implementation
        run: >-
          ruff check
          src/resonance_world/context_graph_w3.py
          tests/test_context_graph_w3.py
          experiments/context_graph/run_cg1_w3.py
      - name: Run CG-1 semantic tests
        run: pytest -q tests/test_context_graph_w3.py
      - name: Enforce raw-event treatment boundary
        run: |
          test -f source/raw/runs.csv
          test -f source/raw/outcomes.csv
          test -f source/raw/tasks.csv
          test -f source/raw/bids.csv
          ! grep -q "pair-edges.jsonl" src/resonance_world/context_graph_w3.py
          ! grep -q "pair-state.private.jsonl" src/resonance_world/context_graph_w3.py
      - name: Execute preregistered held-out CG-1
        id: execute
        continue-on-error: true
        run: >-
          python experiments/context_graph/run_cg1_w3.py
          --config experiments/context_graph/cg1-w3.json
          --source-dir source/raw
          --output output/context_graph/cg1-w3-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: context-graph-cg1-w3-result
          path: output/context_graph/cg1-w3-result.json
          if-no-files-found: error
          retention-days: 90
      - name: Enforce preregistered CG-1 gates
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          value = json.loads(Path("output/context_graph/cg1-w3-result.json").read_text())
          print(json.dumps(value["gate_results"], indent=2, sort_keys=True))
          if not value["passed"]:
              raise SystemExit("CG-1 failed preregistered held-out gates")
          PY

  cg2-calibration:
    needs: scaffold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Download pinned W5 discovery source only
        uses: actions/download-artifact@v4
        with:
          name: w5-discovery-source
          path: w5-calibration
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ElephantRock/Resonance-World
          run-id: 31479913325
      - name: Verify CG-2 implementation
        run: >-
          ruff check
          src/resonance_world/context_graph_w5.py
          tests/test_context_graph_w5.py
          experiments/context_graph/run_cg2_w5.py
      - name: Run CG-2 semantic tests
        run: pytest -q tests/test_context_graph_w5.py
      - name: Enforce W5 treatment boundary
        run: |
          test -f w5-calibration/raw/runs.csv
          test -f w5-calibration/raw/outcomes.csv
          test -f w5-calibration/output/discovery-source/capsules.private.jsonl
          ! grep -q "w5-discovery.json" src/resonance_world/context_graph_w5.py
          ! grep -q "w5-07-replication.json" src/resonance_world/context_graph_w5.py
          ! grep -q "institutional_memory_effect" src/resonance_world/context_graph_w5.py
      - name: Execute CG-2 calibration only
        run: >-
          python experiments/context_graph/run_cg2_w5.py
          --config experiments/context_graph/cg2-w5.json
          --missions configs/w5/institution-missions.json
          --calibration-source-dir w5-calibration
          --output output/context_graph/cg2-w5-calibration.json
      - name: Enforce calibration source pin and no private-state output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("output/context_graph/cg2-w5-calibration.json").read_text())
          config = json.loads(Path("experiments/context_graph/cg2-w5.json").read_text())
          source = result["sources"]["calibration"]
          pin = config["sources"]["calibration"]
          assert source["raw_sha256"] == pin["raw_sha256"], (source, pin)
          assert source["capsules_sha256"] == pin["capsules_sha256"], (source, pin)
          text = Path("output/context_graph/cg2-w5-calibration.json").read_text()
          assert "practice_by_skill" not in text
          assert result["evaluation"] is None
          assert result["passed"] is None
          print(json.dumps(result["calibration"]["metrics"], indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: context-graph-cg2-calibration
          path: output/context_graph/cg2-w5-calibration.json
          if-no-files-found: error
          retention-days: 90
