name: D2 Campaign Pacing Qualification Execution

on:
  push:
    branches: ["engineering/d2-campaign-pacing-qualification"]
    paths:
      - "research/d2_campaign_pacing/RUN_D2_CAMPAIGN_PACING_QUALIFICATION"

permissions:
  contents: read

jobs:
  authorization-integrity:
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      candidate_sha: ${{ steps.auth.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: auth
        shell: bash
        run: |
          set -euo pipefail
          marker='research/d2_campaign_pacing/RUN_D2_CAMPAIGN_PACING_QUALIFICATION'
          test -f "$marker"
          candidate="$(sed -n 's/^candidate_sha=//p' "$marker")"
          test "$(sed -n 's/^issue=//p' "$marker")" = '210'
          test "$(sed -n 's/^authorization=//p' "$marker")" = 'D2_campaign_pacing_execution_explicitly_authorized'
          test "$(git rev-parse HEAD^)" = "$candidate"
          test "$(git diff --name-only "$candidate" HEAD)" = "$marker"
          test "$(git diff --name-only "$candidate" HEAD | wc -l)" = '1'
          if git cat-file -e "${candidate}:${marker}" 2>/dev/null; then exit 1; fi
          echo "candidate_sha=$candidate" >> "$GITHUB_OUTPUT"

  execute:
    needs: authorization-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      D2_CAMPAIGN_PACING_AUTHORIZED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: test -n "${ZAI_API_KEY:-}"
      - run: python scripts/qualify_d2_campaign_pacing.py --execute --output output/d2-campaign-pacing-qualification.json
      - uses: actions/upload-artifact@v4
        with:
          name: d2-campaign-pacing-qualification-result
          path: output/d2-campaign-pacing-qualification.json
          if-no-files-found: error
          retention-days: 90

  rerun-prohibited:
    if: ${{ github.run_attempt != 1 }}
    runs-on: ubuntu-24.04
    steps:
      - run: exit 1
