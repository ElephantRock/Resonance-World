name: D2 Closeout Bot PR

on:
  push:
    branches: ["ops/d2-closeout-bot-pr"]
    paths:
      - ".github/workflows/d2-closeout-bot-pr.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Create bot-authored integration PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          payload = {
              "title": "D2-C2: integrate completed D2-S3 evidence for Acceptance review",
              "head": "research/d2-c2-closeout-integration",
              "base": "main",
              "body": """## Purpose\n\nBot-authored integration of the exact audited D2-C2 preservation head `45fead6220e0062a51623b652ff790c00fdd43fe`, so an authenticated maintainer distinct from the PR author can provide the ordinary code-review approval required by branch protection.\n\nThis is the unchanged head previously reviewed in PR #181 and administratively attempted in #182. It adds no scientific change.\n\n## Scientific identity\n\n- candidate `e8f719c3698b1f0180db07409c5eefd93facefbf`\n- authorization `88ab2e26efaff6434606b16e9a4dd162784e6279`\n- campaign `33312336871` — SUCCESS\n- result **D2-S3**; 360 attempted / 359 analyzable / 1 failed\n- closeout `b90eba8902d3952d3742338607ac49a9b03a7694`\n- exact integration head `45fead6220e0062a51623b652ff790c00fdd43fe`\n\nEvidence preservation only. No Mechanism Registry promotion, no `internally_replicated` claim, and Production/default Historical Substrate remains OFF. Independent scientific Acceptance is separately governed by issue #183."""
          }
          req = Request(
              "https://api.github.com/repos/ElephantRock/Resonance-World/pulls",
              data=json.dumps(payload).encode(), method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
                  "User-Agent": "resonance-world-closeout-integrator/0.1",
              },
          )
          with urlopen(req, timeout=60) as r:
              out = json.loads(r.read().decode())
          print(out["html_url"])
          print(out["number"])
          PY
