name: D2 Format Regeneration Preexecution
on:
  pull_request:
    paths:
      - "research/d2_format_regeneration/**"
      - "scripts/d2_format_regeneration_*.py"
      - "scripts/qualify_d2_format_regeneration.py"
      - "src/resonance_world/d2_terminal_adapter.py"
      - "src/resonance_world/provider_send_guard.py"
      - "src/resonance_world/github_authorization_queries.py"
      - "tests/test_d2_format_regeneration.py"
      - ".github/workflows/d2-format-regeneration-*.yml"
permissions:
  contents: read
jobs:
  zero-provider-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - run: python -m pip install pytest==9.1.1 ruff==0.16.7 httpx==0.28.1
      - name: Verify marker absent
        run: test ! -e research/d2_format_regeneration/RUN_D2_FORMAT_REGENERATION
      - name: Deterministic credential-free preflight twice
        env: {PYTHONPATH: "${{ github.workspace }}/src:${{ github.workspace }}/scripts"}
        run: |
          test -z "${ZAI_API_KEY:-}" && test -z "${D2_FORMAT_REGENERATION_AUTHORIZED:-}"
          python scripts/qualify_d2_format_regeneration.py --preflight --output /tmp/a.json
          python scripts/qualify_d2_format_regeneration.py --preflight --output /tmp/b.json
          cmp /tmp/a.json /tmp/b.json
      - name: Targeted tests
        env: {PYTHONPATH: "${{ github.workspace }}/src:${{ github.workspace }}/scripts"}
        run: pytest -q tests/test_provider_send_guard.py tests/test_d2_format_regeneration.py
      - name: Ruff
        run: ruff check scripts/d2_format_regeneration_*.py scripts/qualify_d2_format_regeneration.py tests/test_d2_format_regeneration.py src/resonance_world/d2_terminal_adapter.py
  pinned-hermes-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {repository: hermes-agent-org/hermes, ref: 036cbdfa0a3158454a0a2a7a7388cf70353326b4, fetch-depth: 1}
      - name: Verify frozen Hermes source
        run: |
          test "$(git rev-parse HEAD)" = 036cbdfa0a3158454a0a2a7a7388cf70353326b4
          test "$(git rev-parse HEAD:run_agent.py)" = 4c0d3be4b0c2d364c550fa663d34f6545c9e6d20
          test "$(git rev-parse HEAD:uv.lock)" = 45efc2d93ff627fee4f94ce2b068440873a22188
          test "$(git rev-parse HEAD:pyproject.toml)" = 95a1dfddd74bc399dd7f23f8d0143852b5689463
          grep -Fq 'version = "0.8.0"' pyproject.toml
          grep -Fq 'completed = final_response is not None and api_call_count < self.max_iterations' run_agent.py
          grep -Fq 'api_kwargs.update(self.request_overrides)' run_agent.py
