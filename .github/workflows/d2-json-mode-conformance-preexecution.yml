name: D2 JSON Mode Conformance Preexecution

on:
  pull_request:
    paths:
      - "research/d2_json_mode_conformance/**"
      - "scripts/d2_json_mode_contract.py"
      - "scripts/d2_json_mode_transport.py"
      - "scripts/d2_json_mode_agent.py"
      - "scripts/d2_json_mode_probe.py"
      - "scripts/d2_json_mode_runtime.py"
      - "scripts/qualify_d2_json_mode_conformance.py"
      - "src/resonance_world/d2_terminal_adapter.py"
      - "src/resonance_world/provider_send_guard.py"
      - "src/resonance_world/github_authorization_queries.py"
      - "tests/test_d2_json_mode_conformance.py"
      - ".github/workflows/d2-json-mode-conformance-preexecution.yml"
      - ".github/workflows/d2-json-mode-conformance-qualification.yml"

permissions:
  contents: read

jobs:
  zero-provider-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install test-only tools
        run: python -m pip install pytest==9.1.1 ruff==0.16.7 httpx==0.28.1
      - name: Verify execution marker absent
        run: test ! -e research/d2_json_mode_conformance/RUN_D2_JSON_MODE_CONFORMANCE
      - name: Verify frozen apparatus blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/resonance_world/provider_send_guard.py)" = '4b8896235d8048523d007400d0acfe85470f628c'
          test "$(git hash-object src/resonance_world/d2_terminal_adapter.py)" = 'ba16d2eb4b7255437c8ab224e91d5ed093897990'
          test "$(git hash-object scripts/d2_json_mode_contract.py)" = '4151cb7b2e84bbc77593420208d93e876d1471eb'
          test "$(git hash-object scripts/d2_json_mode_transport.py)" = '02ca0846b2e078f172ef231eda47ad3a8497a4b4'
          test "$(git hash-object scripts/d2_json_mode_agent.py)" = 'bc1be7e8776ceb4567bdd7c98aa524635338383c'
          test "$(git hash-object scripts/d2_json_mode_probe.py)" = 'b95d60230152d91770817c04d8134ab52afed813'
          test "$(git hash-object scripts/d2_json_mode_runtime.py)" = '6f9b6e332dfae82558527d0b264889e9291670dd'
          test "$(git hash-object scripts/qualify_d2_json_mode_conformance.py)" = '83cd650514f1e35a877414139038cbaa860105e7'
          test "$(git hash-object tests/test_d2_json_mode_conformance.py)" = 'bac5c4c6108fb7c8c8a299296e44d2b5ebcfd6b5'
          test "$(git hash-object research/d2_json_mode_conformance/REQUEST_PLAN.json)" = '5055611c44b722a907549364ae661f12d53f1f13'
          test "$(git hash-object research/d2_json_mode_conformance/PROBES.json)" = '2833691dd11cbcb46ce97ec682c6ce69a167fce7'
      - name: Verify one-shot workflow contract
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/d2-json-mode-conformance-qualification.yml'
          test -f "$workflow"
          grep -Fq 'python -m resonance_world.github_authorization_queries' "$workflow"
          if grep -Eq -- '--jq|--template' "$workflow"; then
            echo 'Qualification workflow reintroduced forbidden gh formatting flags.' >&2
            exit 1
          fi
          grep -Fq 'D2_JSON_MODE_CONFORMANCE_AUTHORIZED' "$workflow"
          grep -Fq 'RUN_D2_JSON_MODE_CONFORMANCE' "$workflow"
          grep -Fq -- '--pull-request 261' "$workflow"
          grep -Fq 'run_attempt == 1' "$workflow"
          grep -Fq 'Same-stream workflow rerun is prohibited' "$workflow"
      - name: Deterministic credential-free preflight twice
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/scripts
        shell: bash
        run: |
          set -euo pipefail
          test -z "${ZAI_API_KEY:-}"
          test -z "${D2_JSON_MODE_CONFORMANCE_AUTHORIZED:-}"
          python scripts/qualify_d2_json_mode_conformance.py --preflight --output /tmp/preflight-a.json
          python scripts/qualify_d2_json_mode_conformance.py --preflight --output /tmp/preflight-b.json
          cmp /tmp/preflight-a.json /tmp/preflight-b.json
      - name: Targeted tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/scripts
        run: pytest -q tests/test_provider_send_guard.py tests/test_d2_json_mode_conformance.py
      - name: Ruff
        run: >-
          ruff check
          scripts/d2_json_mode_contract.py
          scripts/d2_json_mode_transport.py
          scripts/d2_json_mode_agent.py
          scripts/d2_json_mode_probe.py
          scripts/d2_json_mode_runtime.py
          scripts/qualify_d2_json_mode_conformance.py
          tests/test_d2_json_mode_conformance.py
          src/resonance_world/d2_terminal_adapter.py

  pinned-hermes-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pinned Hermes Agent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hermes-agent-org/hermes
          ref: 036cbdfa0a3158454a0a2a7a7388cf70353326b4
          fetch-depth: 1
      - name: Verify frozen source semantics
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '036cbdfa0a3158454a0a2a7a7388cf70353326b4'
          test "$(git rev-parse HEAD:run_agent.py)" = '4c0d3be4b0c2d364c550fa663d34f6545c9e6d20'
          test "$(git rev-parse HEAD:uv.lock)" = '45efc2d93ff627fee4f94ce2b068440873a22188'
          grep -Fq 'version = "0.8.0"' pyproject.toml
          grep -Fq 't = threading.Thread(target=_call, daemon=True)' run_agent.py
          grep -Fq 'while t.is_alive():' run_agent.py
          grep -Fq 't.join(timeout=0.3)' run_agent.py
          grep -Fq 'completed = final_response is not None and api_call_count < self.max_iterations' run_agent.py
          grep -Fq '"api_calls": api_call_count' run_agent.py
          grep -Fq 'api_kwargs.update(self.request_overrides)' run_agent.py
