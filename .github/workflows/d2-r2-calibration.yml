name: D2-0 R2 Learnability Calibration

on:
  push:
    branches: ["experiment/d2-0-learnability-r2"]
    paths:
      - "research/d2/RUN_D2_0_R2"

permissions:
  contents: read

jobs:
  development-only-r2-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install research environment
        run: python -m pip install -e '.[dev]'
      - name: Verify frozen R2 apparatus
        run: |
          test -n "$ZAI_API_KEY"
          python -m py_compile scripts/d2_calibration_r2_core.py scripts/run_d2_calibration_r2.py
          ruff check scripts/d2_calibration_r2_core.py scripts/run_d2_calibration_r2.py tests/test_d2_calibration_r2_core.py
          pytest -q tests/test_d2_artifact_core.py tests/test_d2_calibration_r2_core.py
          python - <<'PY'
          from pathlib import Path
          revision = Path("research/d2/D2_0_LEARNABILITY_REVISION_2.md").read_text()
          marker = Path("research/d2/RUN_D2_0_R2").read_text()
          assert "266 logical calls" in revision
          assert "conventional development-readiness" in revision
          assert "D2 confirmatory" in marker
          assert "Production/default Historical Substrate remains OFF" in marker
          PY
      - name: Execute D2-0 R2 development calibration
        run: |
          rm -rf output/d2-calibration-r2
          python scripts/run_d2_calibration_r2.py --output-dir output/d2-calibration-r2
      - name: Verify R2 structural integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("output/d2-calibration-r2/d2-0-r2-report.json").read_text())
          assert report["status"] == "completed_development_only_not_confirmatory"
          assert report["pair_count"] == 8
          assert report["integrity"]["source_destination_development_overlap_total"] == 0
          assert report["integrity"]["development_evaluation_overlap_total"] == 0
          assert report["integrity"]["all_artifact_audits_pass"] is True
          assert report["integrity"]["description_reproduced_logical_calls_equal"] is True
          assert report["integrity"]["all_developed_arm_logical_calls_expected"] is True
          assert report["integrity"]["all_fresh_logical_calls_expected"] is True
          assert report["integrity"]["evaluation_feedback_returned"] is False
          assert report["integrity"]["confirmatory_holdout_created_or_used"] is False
          assert report["call_accounting"]["logical_calls_total"] == 266
          assert report["confirmatory_evidence"] is False
          assert report["production_historical_substrate_enabled"] is False
          manifest = json.loads(Path("output/d2-calibration-r2/manifest.json").read_text())
          assert manifest["development_only"] is True
          assert manifest["confirmatory_evidence"] is False
          assert manifest["logical_calls_total"] == 266
          assert manifest["production_historical_substrate_enabled"] is False
          PY
          sha256sum output/d2-calibration-r2/*
      - uses: actions/upload-artifact@v4
        with:
          name: d2-0-development-calibration-r2
          path: output/d2-calibration-r2
          if-no-files-found: error
          retention-days: 90
