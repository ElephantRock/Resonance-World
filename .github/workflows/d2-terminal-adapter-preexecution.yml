name: D2 Terminal Adapter Preexecution

on:
  pull_request:
    paths:
      - "research/d2_terminal_adapter/**"
      - "research/evidence/d2_terminal_response_observability/**"
      - "scripts/qualify_d2_terminal_adapter.py"
      - "src/resonance_world/d2_terminal_adapter.py"
      - "src/resonance_world/d2_terminal_transport.py"
      - "src/resonance_world/provider_send_guard.py"
      - "tests/test_d2_terminal_adapter.py"
      - ".github/workflows/d2-terminal-adapter-*.yml"

permissions:
  contents: read

jobs:
  zero-provider-preexecution:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify lifecycle and frozen file identities
        shell: bash
        run: |
          set -euo pipefail
          marker='research/d2_terminal_adapter/RUN_D2_TERMINAL_ADAPTER_QUALIFICATION'
          test ! -f "$marker"
          test "$(git hash-object research/d2_terminal_adapter/REQUEST_PLAN.json)" = \
            '05f3e9ab10e8d8f1ac833d6cf033a5fd0a32a4cb'
          test "$(git hash-object research/d2_terminal_adapter/PROBES.json)" = \
            '81ad8a9df6cc7862286ea2e42d100770a6abbaee'
          test "$(git hash-object src/resonance_world/provider_send_guard.py)" = \
            '4b8896235d8048523d007400d0acfe85470f628c'
          echo \
            'cde58890d2d6bd1027381ffa559b385f11883c15e08860a823a1a5017495a9d6  research/evidence/d2_terminal_response_observability/RESULT.json' \
            | sha256sum -c -
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Credential-free deterministic preflight twice
        shell: bash
        run: |
          set -euo pipefail
          test -z "${ZAI_API_KEY:-}"
          test -z "${D2_TERMINAL_ADAPTER_AUTHORIZED:-}"
          python scripts/qualify_d2_terminal_adapter.py \
            --preflight --output output/preflight-a.json
          python scripts/qualify_d2_terminal_adapter.py \
            --preflight --output output/preflight-b.json
          cmp output/preflight-a.json output/preflight-b.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('output/preflight-a.json').read_text())
          assert p['preserved_evidence_regression'] == {
              'effective_completed': 72,
              'native_completed': 64,
              'terminal_overrides': 8,
          }
          PY
      - name: Targeted tests
        run: |
          pytest -q \
            tests/test_provider_send_guard.py \
            tests/test_d2_terminal_adapter.py
      - name: Ruff
        run: |
          ruff check \
            src/resonance_world/d2_terminal_adapter.py \
            src/resonance_world/d2_terminal_transport.py \
            scripts/qualify_d2_terminal_adapter.py \
            tests/test_d2_terminal_adapter.py

  pinned-hermes-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Resonance World
        uses: actions/checkout@v4
      - name: Checkout pinned Hermes Agent
        uses: actions/checkout@v4
        with:
          repository: hermes-agent-org/hermes
          ref: 036cbdfa0a3158454a0a2a7a7388cf70353326b4
          path: .hermes-src
          fetch-depth: 1
      - name: Verify pinned source completion, grace, and worker contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .hermes-src rev-parse HEAD)" = \
            '036cbdfa0a3158454a0a2a7a7388cf70353326b4'
          test "$(git -C .hermes-src rev-parse HEAD:run_agent.py)" = \
            '4c0d3be4b0c2d364c550fa663d34f6545c9e6d20'
          grep -Fq 'version = "0.8.0"' .hermes-src/pyproject.toml
          grep -Fq 't = threading.Thread(target=_call, daemon=True)' .hermes-src/run_agent.py
          grep -Fq \
            'completed = final_response is not None and api_call_count < self.max_iterations' \
            .hermes-src/run_agent.py
          grep -Fq \
            'while (api_call_count < self.max_iterations and self.iteration_budget.remaining > 0) or self._budget_grace_call:' \
            .hermes-src/run_agent.py
          grep -Fq 'api_call_count += 1' .hermes-src/run_agent.py
          grep -Fq 'if self._budget_grace_call:' .hermes-src/run_agent.py
          grep -Fq '"api_calls": api_call_count' .hermes-src/run_agent.py
          grep -Fq 'request_overrides: Dict[str, Any] = None' .hermes-src/run_agent.py
          grep -Fq 'api_kwargs.update(self.request_overrides)' .hermes-src/run_agent.py
          grep -Fq 'max_retries = 3' .hermes-src/run_agent.py
