name: D2 Terminal Adapter Preexecution

on:
  pull_request:
    paths:
      - "research/d2_terminal_adapter/**"
      - "research/evidence/d2_terminal_response_observability/**"
      - "scripts/qualify_d2_terminal_adapter.py"
      - "src/resonance_world/d2_terminal_adapter.py"
      - "src/resonance_world/d2_terminal_transport.py"
      - "src/resonance_world/provider_send_guard.py"
      - "tests/test_d2_terminal_adapter.py"
      - ".github/workflows/d2-terminal-adapter-*.yml"

permissions:
  contents: read

jobs:
  zero-provider-preexecution:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify lifecycle and frozen file identities
        shell: bash
        run: |
          set -euo pipefail
          marker='research/d2_terminal_adapter/RUN_D2_TERMINAL_ADAPTER_QUALIFICATION'
          test ! -f "$marker"
          test "$(git hash-object research/d2_terminal_adapter/REQUEST_PLAN.json)" = \
            '05f3e9ab10e8d8f1ac833d6cf033a5fd0a32a4cb'
          test "$(git hash-object research/d2_terminal_adapter/PROBES.json)" = \
            '81ad8a9df6cc7862286ea2e42d100770a6abbaee'
          test "$(git hash-object src/resonance_world/provider_send_guard.py)" = \
            '4b8896235d8048523d007400d0acfe85470f628c'
          echo \
            'cde58890d2d6bd1027381ffa559b385f11883c15e08860a823a1a5017495a9d6  research/evidence/d2_terminal_response_observability/RESULT.json' \
            | sha256sum -c -
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Credential-free deterministic preflight twice
        shell: bash
        run: |
          set -euo pipefail
          test -z "${ZAI_API_KEY:-}"
          test -z "${D2_TERMINAL_ADAPTER_AUTHORIZED:-}"
          python scripts/qualify_d2_terminal_adapter.py \
            --preflight --output output/preflight-a.json
          python scripts/qualify_d2_terminal_adapter.py \
            --preflight --output output/preflight-b.json
          cmp output/preflight-a.json output/preflight-b.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('output/preflight-a.json').read_text())
          assert p['preserved_evidence_regression'] == {
              'effective_completed': 72,
              'native_completed': 64,
              'terminal_overrides': 8,
          }
          PY
      - name: Targeted tests
        run: |
          pytest -q \
            tests/test_provider_send_guard.py \
            tests/test_d2_terminal_adapter.py
      - name: Ruff
        run: |
          ruff check \
            src/resonance_world/d2_terminal_adapter.py \
            src/resonance_world/d2_terminal_transport.py \
            scripts/qualify_d2_terminal_adapter.py \
            tests/test_d2_terminal_adapter.py

  pinned-hermes-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Resonance World
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Checkout pinned Hermes Agent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hermes-agent-org/hermes
          ref: 036cbdfa0a3158454a0a2a7a7388cf70353326b4
          path: .hermes-src
          fetch-depth: 1
      - name: Verify pinned source completion, grace, worker, and lock contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .hermes-src rev-parse HEAD)" = \
            '036cbdfa0a3158454a0a2a7a7388cf70353326b4'
          test "$(git -C .hermes-src rev-parse HEAD:run_agent.py)" = \
            '4c0d3be4b0c2d364c550fa663d34f6545c9e6d20'
          test "$(git -C .hermes-src rev-parse HEAD:uv.lock)" = \
            '45efc2d93ff627fee4f94ce2b068440873a22188'
          grep -Fq 'version = "0.8.0"' .hermes-src/pyproject.toml
          grep -Fq 't = threading.Thread(target=_call, daemon=True)' .hermes-src/run_agent.py
          grep -Fq \
            'completed = final_response is not None and api_call_count < self.max_iterations' \
            .hermes-src/run_agent.py
          grep -Fq \
            'while (api_call_count < self.max_iterations and self.iteration_budget.remaining > 0) or self._budget_grace_call:' \
            .hermes-src/run_agent.py
          grep -Fq 'api_call_count += 1' .hermes-src/run_agent.py
          grep -Fq 'if self._budget_grace_call:' .hermes-src/run_agent.py
          grep -Fq '"api_calls": api_call_count' .hermes-src/run_agent.py
          grep -Fq 'request_overrides: Dict[str, Any] = None' .hermes-src/run_agent.py
          grep -Fq 'api_kwargs.update(self.request_overrides)' .hermes-src/run_agent.py
          grep -Fq 'max_retries = 3' .hermes-src/run_agent.py

  locked-live-environment-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.locked-hermes-venv
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Checkout Resonance World
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Checkout pinned Hermes Agent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hermes-agent-org/hermes
          ref: 036cbdfa0a3158454a0a2a7a7388cf70353326b4
          path: .hermes-src
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install exact uv tool
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.12.13"
          enable-cache: false
      - name: Materialize Hermes hash-locked runtime without Resonance build backend
        shell: bash
        run: |
          set -euo pipefail
          test -z "${ZAI_API_KEY:-}"
          test -z "${D2_TERMINAL_ADAPTER_AUTHORIZED:-}"
          test "$(git -C .hermes-src rev-parse HEAD:uv.lock)" = \
            '45efc2d93ff627fee4f94ce2b068440873a22188'
          uv lock --check --project .hermes-src
          uv sync --project .hermes-src --locked --no-dev --python "$(command -v python)"
      - name: Verify locked runtime and protected files after installation
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/.hermes-src
        shell: bash
        run: |
          set -euo pipefail
          test -z "${ZAI_API_KEY:-}"
          test -z "${D2_TERMINAL_ADAPTER_AUTHORIZED:-}"
          test "$(git hash-object scripts/qualify_d2_terminal_adapter.py)" = \
            'b66e9282166e8a180f804f0f414f394ee8d18562'
          test "$(git hash-object src/resonance_world/d2_terminal_adapter.py)" = \
            'ba16d2eb4b7255437c8ab224e91d5ed093897990'
          test "$(git hash-object src/resonance_world/d2_terminal_transport.py)" = \
            '7cf40ff7534ea028d584f0751f1d1b921b8acd82'
          test "$(git hash-object src/resonance_world/provider_send_guard.py)" = \
            '4b8896235d8048523d007400d0acfe85470f628c'
          test "$(git hash-object research/d2_terminal_adapter/REQUEST_PLAN.json)" = \
            '05f3e9ab10e8d8f1ac833d6cf033a5fd0a32a4cb'
          test "$(git hash-object research/d2_terminal_adapter/PROBES.json)" = \
            '81ad8a9df6cc7862286ea2e42d100770a6abbaee'
          echo \
            'cde58890d2d6bd1027381ffa559b385f11883c15e08860a823a1a5017495a9d6  research/evidence/d2_terminal_response_observability/RESULT.json' \
            | sha256sum -c -
          test "$(git -C .hermes-src hash-object run_agent.py)" = \
            '4c0d3be4b0c2d364c550fa663d34f6545c9e6d20'
          test "$(git -C .hermes-src hash-object uv.lock)" = \
            '45efc2d93ff627fee4f94ce2b068440873a22188'
          git diff --exit-code -- \
            scripts/qualify_d2_terminal_adapter.py \
            src/resonance_world/d2_terminal_adapter.py \
            src/resonance_world/d2_terminal_transport.py \
            src/resonance_world/provider_send_guard.py \
            research/d2_terminal_adapter/REQUEST_PLAN.json \
            research/d2_terminal_adapter/PROBES.json \
            research/evidence/d2_terminal_response_observability/RESULT.json
          git -C .hermes-src diff --exit-code -- run_agent.py pyproject.toml uv.lock
          .locked-hermes-venv/bin/python - <<'PY'
          import importlib.metadata
          from pathlib import Path
          import httpx
          import openai
          import run_agent
          from resonance_world import d2_terminal_adapter, d2_terminal_transport
          from resonance_world import provider_send_guard
          from openai._constants import DEFAULT_MAX_RETRIES

          root = Path.cwd().resolve()
          assert importlib.metadata.version('hermes-agent') == '0.8.0'
          assert importlib.metadata.version('openai') == '2.21.0'
          assert importlib.metadata.version('httpx') == '0.28.1'
          assert openai.__version__ == '2.21.0'
          assert httpx.__version__ == '0.28.1'
          assert DEFAULT_MAX_RETRIES == 2
          assert Path(run_agent.__file__).resolve() == root / '.hermes-src' / 'run_agent.py'
          assert Path(d2_terminal_adapter.__file__).resolve() == (
              root / 'src' / 'resonance_world' / 'd2_terminal_adapter.py'
          )
          assert Path(d2_terminal_transport.__file__).resolve() == (
              root / 'src' / 'resonance_world' / 'd2_terminal_transport.py'
          )
          assert Path(provider_send_guard.__file__).resolve() == (
              root / 'src' / 'resonance_world' / 'provider_send_guard.py'
          )
          PY
