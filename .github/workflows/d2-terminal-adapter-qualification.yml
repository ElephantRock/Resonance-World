name: D2 Terminal Adapter Qualification

on:
  push:
    branches: ["engineering/d2-terminal-adapter-qualification"]
    paths:
      - "research/d2_terminal_adapter/RUN_D2_TERMINAL_ADAPTER_QUALIFICATION"

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  authorization-integrity:
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      candidate_sha: ${{ steps.auth.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - id: auth
        name: Verify sole-child activation and frozen adapter contract
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          marker='research/d2_terminal_adapter/RUN_D2_TERMINAL_ADAPTER_QUALIFICATION'
          candidate="$(sed -n 's/^candidate_sha=//p' "$marker")"
          issue="$(sed -n 's/^issue=//p' "$marker")"
          authorization="$(sed -n 's/^authorization=//p' "$marker")"
          test -f "$marker"
          test -n "$candidate"
          test "$issue" = '246'
          test "$authorization" = \
            'Autonomous_Operating_Charter_Amendment_A1_standing_execution_authority'
          test "$(git rev-parse HEAD^)" = "$candidate"
          test "$(git diff --name-only "$candidate" HEAD)" = "$marker"
          test "$(git diff --name-only "$candidate" HEAD | wc -l)" = '1'
          if git cat-file -e "${candidate}:${marker}" 2>/dev/null; then
            echo 'Frozen candidate already contains execution marker.' >&2
            exit 1
          fi
          mapfile -t marker_commits < <(git log --format=%H -- "$marker")
          test "${#marker_commits[@]}" -eq 1
          test "${marker_commits[0]}" = "$(git rev-parse HEAD)"
          prior_run_count="$(gh api \
            --paginate --slurp \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/d2-terminal-adapter-qualification.yml/runs?per_page=100" \
            --jq "[.[].workflow_runs[] | select((.id | tostring) != \"${GITHUB_RUN_ID}\")] | length")"
          test "$prior_run_count" -eq 0
          review_count="$(gh api \
            --paginate --slurp \
            "/repos/${GITHUB_REPOSITORY}/pulls/247/reviews?per_page=100" \
            --jq "[.[].[] | select(.commit_id == \"${candidate}\" and .user.login == \"chatgpt-codex-connector[bot]\")] | length")"
          test "$review_count" -ge 1
          git merge-base --is-ancestor \
            '83257f740262726e906fb203c4657163bf36079f' "$candidate"
          git merge-base --is-ancestor \
            '47383f2b18c993965c89350609a4c9691897bdde' "$candidate"
          test "$(git rev-parse "${candidate}:src/resonance_world/provider_send_guard.py")" = \
            '4b8896235d8048523d007400d0acfe85470f628c'
          test "$(git rev-parse \
            "${candidate}:research/d2_terminal_adapter/REQUEST_PLAN.json")" = \
            '05f3e9ab10e8d8f1ac833d6cf033a5fd0a32a4cb'
          test "$(git rev-parse \
            "${candidate}:research/d2_terminal_adapter/PROBES.json")" = \
            '81ad8a9df6cc7862286ea2e42d100770a6abbaee'
          test "$(git rev-parse \
            "${candidate}:scripts/qualify_d2_terminal_adapter.py")" = \
            'b66e9282166e8a180f804f0f414f394ee8d18562'
          test "$(git rev-parse \
            "${candidate}:src/resonance_world/d2_terminal_adapter.py")" = \
            'ba16d2eb4b7255437c8ab224e91d5ed093897990'
          test "$(git rev-parse \
            "${candidate}:src/resonance_world/d2_terminal_transport.py")" = \
            '7cf40ff7534ea028d584f0751f1d1b921b8acd82'
          python - "$candidate" <<'PY'
          import hashlib
          import json
          import subprocess
          import sys

          candidate = sys.argv[1]

          def show(path):
              return subprocess.check_output(['git', 'show', f'{candidate}:{path}'])

          evidence = show(
              'research/evidence/d2_terminal_response_observability/RESULT.json'
          )
          assert hashlib.sha256(evidence).hexdigest() == (
              'cde58890d2d6bd1027381ffa559b385f11883c15e08860a823a1a5017495a9d6'
          )
          plan = json.loads(show('research/d2_terminal_adapter/REQUEST_PLAN.json'))
          assert plan['schema'] == 'd2-terminal-adapter-request-plan-v0.1'
          assert plan['issue'] == 246
          assert plan['probe_count'] == 72
          assert plan['probe_counts_by_development_budget'] == {
              '40': 24, '80': 24, '160': 24,
          }
          assert plan['fresh_seed_namespace'] == 'rw.d2-terminal-adapter.v1'
          assert plan['max_iterations'] == 2
          assert plan['max_tokens'] == 768
          assert plan['sampling_temperature'] == 0.8
          assert plan['maximum_concurrency'] == 4
          assert plan['maximum_physical_sends_total'] == 180
          assert plan['terminal_override_exact_physical_sends'] == 2
          assert plan['preserved_evidence_expected_terminal_overrides'] == 8
          assert plan['pass_requires_all_effective_completed'] is True
          assert plan['pass_requires_terminal_override_exercised'] is True
          assert plan['hermes_completed_mutation_allowed'] is False
          assert plan['workflow_rerun_allowed'] is False
          assert plan['same_request_stream_rerun_allowed'] is False
          assert plan['predecessor_stream_rerun_or_replacement_allowed'] is False
          assert plan['scientific_scoring_performed'] is False
          assert plan['acceptance_action_authorized'] is False
          assert plan['historical_substrate_enabled'] is False
          PY
          echo "candidate_sha=$candidate" >> "$GITHUB_OUTPUT"

  execute-bounded-adapter-qualification:
    needs: authorization-integrity
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Resonance World
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Checkout pinned Hermes Agent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hermes-agent-org/hermes
          ref: 036cbdfa0a3158454a0a2a7a7388cf70353326b4
          path: .hermes-src
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Reverify exact parent, evidence, and pinned source contract
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = '1'
          test -z "${ZAI_API_KEY:-}"
          test -z "${GLM_BASE_URL:-}"
          test -z "${D2_TERMINAL_ADAPTER_AUTHORIZED:-}"
          test "$(git rev-parse HEAD^)" = \
            '${{ needs.authorization-integrity.outputs.candidate_sha }}'
          test "$(git rev-parse HEAD^:src/resonance_world/provider_send_guard.py)" = \
            '4b8896235d8048523d007400d0acfe85470f628c'
          test "$(git rev-parse HEAD^:scripts/qualify_d2_terminal_adapter.py)" = \
            'b66e9282166e8a180f804f0f414f394ee8d18562'
          test "$(git rev-parse HEAD^:src/resonance_world/d2_terminal_adapter.py)" = \
            'ba16d2eb4b7255437c8ab224e91d5ed093897990'
          test "$(git rev-parse HEAD^:src/resonance_world/d2_terminal_transport.py)" = \
            '7cf40ff7534ea028d584f0751f1d1b921b8acd82'
          echo \
            'cde58890d2d6bd1027381ffa559b385f11883c15e08860a823a1a5017495a9d6  research/evidence/d2_terminal_response_observability/RESULT.json' \
            | sha256sum -c -
          test "$(git -C .hermes-src rev-parse HEAD)" = \
            '036cbdfa0a3158454a0a2a7a7388cf70353326b4'
          test "$(git -C .hermes-src rev-parse HEAD:run_agent.py)" = \
            '4c0d3be4b0c2d364c550fa663d34f6545c9e6d20'
          grep -Fq 't = threading.Thread(target=_call, daemon=True)' .hermes-src/run_agent.py
          grep -Fq \
            'completed = final_response is not None and api_call_count < self.max_iterations' \
            .hermes-src/run_agent.py
          grep -Fq \
            'while (api_call_count < self.max_iterations and self.iteration_budget.remaining > 0) or self._budget_grace_call:' \
            .hermes-src/run_agent.py
          grep -Fq 'api_call_count += 1' .hermes-src/run_agent.py
          grep -Fq 'if self._budget_grace_call:' .hermes-src/run_agent.py
          grep -Fq '"api_calls": api_call_count' .hermes-src/run_agent.py
          grep -Fq 'api_kwargs.update(self.request_overrides)' .hermes-src/run_agent.py
      - name: Install frozen supported-product environment
        run: |
          python -m pip install -e .
          python -m pip install ./.hermes-src 'openai==2.21.0' 'httpx==0.28.1'
          python - <<'PY'
          import importlib.metadata
          import httpx
          from openai._constants import DEFAULT_MAX_RETRIES
          assert importlib.metadata.version('hermes-agent') == '0.8.0'
          assert importlib.metadata.version('openai') == '2.21.0'
          assert importlib.metadata.version('httpx') == '0.28.1'
          assert httpx.__version__ == '0.28.1'
          assert DEFAULT_MAX_RETRIES == 2
          PY
      - name: Execute bounded adapter qualification once
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          GLM_BASE_URL: https://api.z.ai/api/coding/paas/v4
          D2_TERMINAL_ADAPTER_AUTHORIZED: "1"
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ZAI_API_KEY:-}"
          test "${GLM_BASE_URL}" = 'https://api.z.ai/api/coding/paas/v4'
          test "${D2_TERMINAL_ADAPTER_AUTHORIZED}" = '1'
          env \
            -u OPENROUTER_API_KEY \
            -u OPENAI_API_KEY \
            -u OPENAI_BASE_URL \
            -u ANTHROPIC_API_KEY \
            -u ANTHROPIC_TOKEN \
            -u NOUS_API_KEY \
            -u GLM_API_KEY \
            -u Z_AI_API_KEY \
            -u KIMI_API_KEY \
            -u MINIMAX_API_KEY \
            -u DEEPSEEK_API_KEY \
            -u DASHSCOPE_API_KEY \
            -u XAI_API_KEY \
            python scripts/qualify_d2_terminal_adapter.py \
              --execute \
              --output output/d2-terminal-adapter-qualification-result.json
      - name: Verify bounded result authority
        shell: bash
        run: |
          set -euo pipefail
          test -z "${ZAI_API_KEY:-}"
          test -z "${D2_TERMINAL_ADAPTER_AUTHORIZED:-}"
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path(
              'output/d2-terminal-adapter-qualification-result.json'
          ).read_text())
          assert p['schema'] == 'd2-terminal-adapter-qualification-result-v0.1'
          assert p['issue'] == 246
          assert p['engineering_only'] is True
          assert p['candidate_sha'] == (
              '${{ needs.authorization-integrity.outputs.candidate_sha }}'
          )
          assert p['causal_predecessor_outcome_unchanged'] == (
              'VALID_TERMINAL_RESPONSE_OBSERVED'
          )
          assert p['predecessor_trajectory_result_unchanged'] == 'FAIL'
          assert p['predecessor_terminal_semantics_result_unchanged'] == 'FAIL'
          assert p['preserved_evidence_regression'] == {
              'effective_completed': 72,
              'native_completed': 64,
              'terminal_overrides': 8,
          }
          assert p['provider_id'] == 'zai'
          assert p['api_mode'] == 'chat_completions'
          assert p['requested_model'] == 'glm-5.3'
          assert p['max_iterations'] == 2
          assert p['max_tokens'] == 768
          assert p['sampling_temperature'] == 0.8
          assert p['thinking'] == {'type': 'disabled'}
          assert p['probe_count_registered'] == 72
          assert p['probe_count_attempted'] == 72
          assert len(p['probes']) == 72
          assert p['maximum_concurrency'] == 4
          assert p['maximum_physical_sends_total'] == 180
          assert 0 <= p['physical_provider_sends_observed_total'] <= 180
          assert p['qualification_outcome'] in {
              'PASS', 'FAIL', 'ADAPTER_PATH_NOT_EXERCISED', 'APPARATUS_FAILURE'
          }
          assert isinstance(p['effective_completed_count'], int)
          assert 0 <= p['effective_completed_count'] <= 72
          assert isinstance(p['terminal_iteration_override_count'], int)
          assert 0 <= p['terminal_iteration_override_count'] <= 72
          for row in p['probes']:
              if row['terminal_iteration_override_used']:
                  assert row['hermes_completed'] is False
                  assert row['api_calls'] == 2
                  assert row['physical_provider_sends_observed'] == 2
                  assert len(row['attempts']) == 2
                  assert all(a['http_status'] == 200 for a in row['attempts'])
                  assert all(a['transport_error_type'] is None for a in row['attempts'])
              if row['effective_completed']:
                  assert row['structured_parse_valid'] is True
                  assert row['final_response_length'] > 0
          if p['qualification_pass']:
              assert p['qualification_outcome'] == 'PASS'
              assert p['effective_completed_count'] == 72
              assert p['terminal_iteration_override_count'] > 0
          assert p['hermes_completed_mutated'] is False
          assert p['scientific_scoring_performed'] is False
          assert p['source_acquisition_evidence_generated'] is False
          assert p['registry_promotion_authorized'] is False
          assert p['acceptance_action_authorized'] is False
          assert p['production_historical_substrate_enabled'] is False
          assert p['raw_final_response_content_persisted'] is False
          assert p['same_request_stream_rerun_allowed'] is False
          PY
      - name: Upload bounded evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d2-terminal-adapter-qualification-result
          path: output/d2-terminal-adapter-qualification-result.json
          if-no-files-found: error
          retention-days: 90

  rerun-prohibited:
    if: ${{ github.run_attempt != 1 }}
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo 'Same-stream workflow rerun is prohibited after outcome-bearing execution.' >&2
          exit 1
