name: D2 Terminal Adapter V2 Preexecution

on:
  pull_request:
    paths:
      - "research/d2_terminal_adapter_v2/**"
      - "scripts/qualify_d2_terminal_adapter_core.py"
      - "scripts/qualify_d2_terminal_adapter_v2.py"
      - "src/resonance_world/d2_terminal_adapter.py"
      - "src/resonance_world/d2_terminal_transport.py"
      - "src/resonance_world/github_authorization_queries.py"
      - "tests/test_d2_terminal_adapter_v2.py"
      - ".github/workflows/d2-terminal-adapter-v2-preexecution.yml"
      - ".github/workflows/d2-terminal-adapter-v2-qualification.yml"

permissions:
  contents: read

jobs:
  zero-provider-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install test-only tools
        run: python -m pip install pytest==9.1.1 ruff==0.16.7 httpx==0.28.1
      - name: Verify marker absent
        run: test ! -e research/d2_terminal_adapter_v2/RUN_D2_TERMINAL_ADAPTER_V2_QUALIFICATION
      - name: Verify authorization workflow contract
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/d2-terminal-adapter-v2-qualification.yml'
          test -f "$workflow"
          grep -Fq 'python -m resonance_world.github_authorization_queries' "$workflow"
          if grep -Eq -- '--jq|--template' "$workflow"; then
            echo 'Qualification workflow reintroduced forbidden gh formatting flags.' >&2
            exit 1
          fi
          grep -Fq 'D2_TERMINAL_ADAPTER_V2_AUTHORIZED' "$workflow"
          grep -Fq 'research/d2_terminal_adapter_v2/RUN_D2_TERMINAL_ADAPTER_V2_QUALIFICATION' "$workflow"
      - name: Targeted tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: pytest -q tests/test_d2_terminal_adapter_v2.py
      - name: Ruff
        run: >-
          ruff check
          scripts/qualify_d2_terminal_adapter_v2.py
          tests/test_d2_terminal_adapter_v2.py
      - name: Credential-free preflight
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: >-
          python scripts/qualify_d2_terminal_adapter_v2.py
          --preflight
          --output /tmp/d2-terminal-adapter-v2-preflight.json
      - name: Assert no provider credential is required
        run: |
          test -z "${ZAI_API_KEY:-}"
          test -z "${D2_TERMINAL_ADAPTER_V2_AUTHORIZED:-}"

  pinned-hermes-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pinned Hermes Agent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hermes-agent-org/hermes
          ref: 036cbdfa0a3158454a0a2a7a7388cf70353326b4
          fetch-depth: 1
      - name: Verify frozen source semantics
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '036cbdfa0a3158454a0a2a7a7388cf70353326b4'
          test "$(git rev-parse HEAD:run_agent.py)" = '4c0d3be4b0c2d364c550fa663d34f6545c9e6d20'
          test "$(git rev-parse HEAD:uv.lock)" = '45efc2d93ff627fee4f94ce2b068440873a22188'
          grep -Fq 'version = "0.8.0"' pyproject.toml
          grep -Fq 't = threading.Thread(target=_call, daemon=True)' run_agent.py
          grep -Fq 'completed = final_response is not None and api_call_count < self.max_iterations' run_agent.py
          grep -Fq 'api_call_count += 1' run_agent.py
          grep -Fq '"api_calls": api_call_count' run_agent.py
          grep -Fq 'api_kwargs.update(self.request_overrides)' run_agent.py
