name: D2 Terminal Adapter V2 Qualification

on:
  push:
    branches: ["engineering/d2-terminal-adapter-v2-qualification"]
    paths:
      - "research/d2_terminal_adapter_v2/RUN_D2_TERMINAL_ADAPTER_V2_QUALIFICATION"

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  authorization-integrity:
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      candidate_sha: ${{ steps.auth.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - id: auth
        name: Verify sole-child activation and frozen v2 contract
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}/src
        shell: bash
        run: |
          set -euo pipefail
          marker='research/d2_terminal_adapter_v2/RUN_D2_TERMINAL_ADAPTER_V2_QUALIFICATION'
          candidate="$(sed -n 's/^candidate_sha=//p' "$marker")"
          issue="$(sed -n 's/^issue=//p' "$marker")"
          authorization="$(sed -n 's/^authorization=//p' "$marker")"
          test -f "$marker"
          test -n "$candidate"
          test "$issue" = '251'
          test "$authorization" = \
            'Autonomous_Operating_Charter_Amendment_A1_standing_execution_authority'
          test "$(git rev-parse HEAD^)" = "$candidate"
          test "$(git diff --name-only "$candidate" HEAD)" = "$marker"
          test "$(git diff --name-only "$candidate" HEAD | wc -l)" = '1'
          if git cat-file -e "${candidate}:${marker}" 2>/dev/null; then
            echo 'Frozen candidate already contains execution marker.' >&2
            exit 1
          fi
          mapfile -t marker_commits < <(git log --format=%H -- "$marker")
          test "${#marker_commits[@]}" -eq 1
          test "${marker_commits[0]}" = "$(git rev-parse HEAD)"

          prior_run_count="$(python -m resonance_world.github_authorization_queries \
            workflow-runs \
            --repository "$GITHUB_REPOSITORY" \
            --workflow d2-terminal-adapter-v2-qualification.yml \
            --exclude-run-id "$GITHUB_RUN_ID")"
          test "$prior_run_count" -eq 0

          accepted_review_count="$(python -m resonance_world.github_authorization_queries \
            reviews \
            --repository "$GITHUB_REPOSITORY" \
            --pull-request 253 \
            --candidate-sha "$candidate")"
          test "$accepted_review_count" -ge 1

          unresolved_review_thread_count="$(python -m resonance_world.github_authorization_queries \
            threads \
            --repository "$GITHUB_REPOSITORY" \
            --pull-request 253)"
          test "$unresolved_review_thread_count" -eq 0

          git merge-base --is-ancestor \
            '09d6c5c6ac7884213b492da62a1c236f08f1d62c' "$candidate"
          git merge-base --is-ancestor \
            '83257f740262726e906fb203c4657163bf36079f' "$candidate"
          git merge-base --is-ancestor \
            '47383f2b18c993965c89350609a4c9691897bdde' "$candidate"

          test "$(git rev-parse "${candidate}:src/resonance_world/provider_send_guard.py")" = \
            '4b8896235d8048523d007400d0acfe85470f628c'
          test "$(git rev-parse "${candidate}:src/resonance_world/github_authorization_queries.py")" = \
            '4fec4f0bfac06ae17a87a7c148dea6521736a97a'
          test "$(git rev-parse "${candidate}:research/d2_terminal_adapter_v2/REQUEST_PLAN.json")" = \
            '8d932cf1b844127c3c655ab56638d73c876a08d3'
          test "$(git rev-parse "${candidate}:scripts/qualify_d2_terminal_adapter_core.py")" = \
            'b66e9282166e8a180f804f0f414f394ee8d18562'
          test "$(git rev-parse "${candidate}:scripts/qualify_d2_terminal_adapter_v2.py")" = \
            'f240b9848fa7a80e88797d896aec08297988b824'
          test "$(git rev-parse "${candidate}:src/resonance_world/d2_terminal_adapter.py")" = \
            'ba16d2eb4b7255437c8ab224e91d5ed093897990'
          test "$(git rev-parse "${candidate}:src/resonance_world/d2_terminal_transport.py")" = \
            '7cf40ff7534ea028d584f0751f1d1b921b8acd82'

          python - "$candidate" <<'PY'
          import hashlib
          import json
          import subprocess
          import sys

          candidate = sys.argv[1]

          def show(path):
              return subprocess.check_output(['git', 'show', f'{candidate}:{path}'])

          evidence = show('research/evidence/d2_terminal_response_observability/RESULT.json')
          assert hashlib.sha256(evidence).hexdigest() == (
              'cde58890d2d6bd1027381ffa559b385f11883c15e08860a823a1a5017495a9d6'
          )
          plan = json.loads(show('research/d2_terminal_adapter_v2/REQUEST_PLAN.json'))
          assert plan['schema'] == 'd2-terminal-adapter-request-plan-v0.2'
          assert plan['issue'] == 251
          assert plan['consumed_predecessor_issue'] == 246
          assert plan['consumed_predecessor_outcome'] == 'INTEGRITY_APPARATUS_FAILURE_PRE_PROVIDER'
          assert plan['consumed_predecessor_provider_traffic'] is False
          assert plan['authorization_gate_repair_merge_sha'] == (
              '09d6c5c6ac7884213b492da62a1c236f08f1d62c'
          )
          assert plan['probe_count'] == 72
          assert plan['probe_counts_by_development_budget'] == {
              '40': 24, '80': 24, '160': 24,
          }
          assert plan['fresh_seed_namespace'] == 'rw.d2-terminal-adapter.v2'
          assert plan['fresh_seed_start'] == 2000000
          assert plan['probe_id_prefix'] == 'adapter_v2'
          assert plan['max_iterations'] == 2
          assert plan['max_tokens'] == 768
          assert plan['sampling_temperature'] == 0.8
          assert plan['maximum_concurrency'] == 4
          assert plan['maximum_physical_sends_total'] == 180
          assert plan['terminal_override_exact_physical_sends'] == 2
          assert plan['preserved_evidence_expected_terminal_overrides'] == 8
          assert plan['pass_requires_all_effective_completed'] is True
          assert plan['pass_requires_terminal_override_exercised'] is True
          assert plan['hermes_completed_mutation_allowed'] is False
          assert plan['workflow_rerun_allowed'] is False
          assert plan['same_request_stream_rerun_allowed'] is False
          assert plan['predecessor_stream_rerun_or_replacement_allowed'] is False
          assert plan['scientific_scoring_performed'] is False
          assert plan['acceptance_action_authorized'] is False
          assert plan['historical_substrate_enabled'] is False
          PY
          echo "candidate_sha=$candidate" >> "$GITHUB_OUTPUT"

  execute-bounded-adapter-v2-qualification:
    needs: authorization-integrity
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.locked-hermes-venv
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Checkout Resonance World
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Checkout pinned Hermes Agent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hermes-agent-org/hermes
          ref: 036cbdfa0a3158454a0a2a7a7388cf70353326b4
          path: .hermes-src
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install exact uv tool
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.12.13"
          enable-cache: false
      - name: Reverify exact parent and pinned source contract
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = '1'
          test -z "${ZAI_API_KEY:-}"
          test -z "${GLM_BASE_URL:-}"
          test -z "${D2_TERMINAL_ADAPTER_V2_AUTHORIZED:-}"
          test "$(git rev-parse HEAD^)" = '${{ needs.authorization-integrity.outputs.candidate_sha }}'
          test "$(git rev-parse HEAD^:src/resonance_world/provider_send_guard.py)" = '4b8896235d8048523d007400d0acfe85470f628c'
          test "$(git rev-parse HEAD^:src/resonance_world/github_authorization_queries.py)" = '4fec4f0bfac06ae17a87a7c148dea6521736a97a'
          test "$(git rev-parse HEAD^:research/d2_terminal_adapter_v2/REQUEST_PLAN.json)" = '8d932cf1b844127c3c655ab56638d73c876a08d3'
          test "$(git rev-parse HEAD^:scripts/qualify_d2_terminal_adapter_core.py)" = 'b66e9282166e8a180f804f0f414f394ee8d18562'
          test "$(git rev-parse HEAD^:scripts/qualify_d2_terminal_adapter_v2.py)" = 'f240b9848fa7a80e88797d896aec08297988b824'
          test "$(git rev-parse HEAD^:src/resonance_world/d2_terminal_adapter.py)" = 'ba16d2eb4b7255437c8ab224e91d5ed093897990'
          test "$(git rev-parse HEAD^:src/resonance_world/d2_terminal_transport.py)" = '7cf40ff7534ea028d584f0751f1d1b921b8acd82'
          echo 'cde58890d2d6bd1027381ffa559b385f11883c15e08860a823a1a5017495a9d6  research/evidence/d2_terminal_response_observability/RESULT.json' | sha256sum -c -
          test "$(git -C .hermes-src rev-parse HEAD)" = '036cbdfa0a3158454a0a2a7a7388cf70353326b4'
          test "$(git -C .hermes-src rev-parse HEAD:run_agent.py)" = '4c0d3be4b0c2d364c550fa663d34f6545c9e6d20'
          test "$(git -C .hermes-src rev-parse HEAD:uv.lock)" = '45efc2d93ff627fee4f94ce2b068440873a22188'
          grep -Fq 'version = "0.8.0"' .hermes-src/pyproject.toml
          grep -Fq 't = threading.Thread(target=_call, daemon=True)' .hermes-src/run_agent.py
          grep -Fq 'completed = final_response is not None and api_call_count < self.max_iterations' .hermes-src/run_agent.py
          grep -Fq 'api_call_count += 1' .hermes-src/run_agent.py
          grep -Fq '"api_calls": api_call_count' .hermes-src/run_agent.py
          grep -Fq 'api_kwargs.update(self.request_overrides)' .hermes-src/run_agent.py
      - name: Materialize hash-locked runtime without project build backends
        shell: bash
        run: |
          set -euo pipefail
          test -z "${ZAI_API_KEY:-}"
          test -z "${D2_TERMINAL_ADAPTER_V2_AUTHORIZED:-}"
          uv lock --check --project .hermes-src
          uv sync --project .hermes-src --locked --no-dev --no-install-project --python "$(command -v python)"
          cat > /tmp/openai-2.21.0.txt <<'EOF'
          openai==2.21.0 --hash=sha256:0bc1c775e5b1536c294eded39ee08f8407656537ccc71b1004104fe1602e267c
          EOF
          uv pip install --python "$UV_PROJECT_ENVIRONMENT/bin/python" --no-deps --require-hashes -r /tmp/openai-2.21.0.txt
          purelib="$($UV_PROJECT_ENVIRONMENT/bin/python - <<'PY'
          import sysconfig
          print(sysconfig.get_paths()['purelib'])
          PY
          )"
          dist_info="$purelib/hermes_agent-0.8.0.dist-info"
          mkdir -p "$dist_info"
          cat > "$dist_info/METADATA" <<'EOF'
          Metadata-Version: 2.1
          Name: hermes-agent
          Version: 0.8.0
          EOF
      - name: Reverify locked runtime and protected execution files
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/.hermes-src
        shell: bash
        run: |
          set -euo pipefail
          test -z "${ZAI_API_KEY:-}"
          test -z "${D2_TERMINAL_ADAPTER_V2_AUTHORIZED:-}"
          test "$(git hash-object scripts/qualify_d2_terminal_adapter_core.py)" = 'b66e9282166e8a180f804f0f414f394ee8d18562'
          test "$(git hash-object scripts/qualify_d2_terminal_adapter_v2.py)" = 'f240b9848fa7a80e88797d896aec08297988b824'
          test "$(git hash-object src/resonance_world/d2_terminal_adapter.py)" = 'ba16d2eb4b7255437c8ab224e91d5ed093897990'
          test "$(git hash-object src/resonance_world/d2_terminal_transport.py)" = '7cf40ff7534ea028d584f0751f1d1b921b8acd82'
          test "$(git hash-object src/resonance_world/provider_send_guard.py)" = '4b8896235d8048523d007400d0acfe85470f628c'
          test "$(git hash-object src/resonance_world/github_authorization_queries.py)" = '4fec4f0bfac06ae17a87a7c148dea6521736a97a'
          test "$(git hash-object research/d2_terminal_adapter_v2/REQUEST_PLAN.json)" = '8d932cf1b844127c3c655ab56638d73c876a08d3'
          echo 'cde58890d2d6bd1027381ffa559b385f11883c15e08860a823a1a5017495a9d6  research/evidence/d2_terminal_response_observability/RESULT.json' | sha256sum -c -
          test "$(git -C .hermes-src hash-object run_agent.py)" = '4c0d3be4b0c2d364c550fa663d34f6545c9e6d20'
          test "$(git -C .hermes-src hash-object uv.lock)" = '45efc2d93ff627fee4f94ce2b068440873a22188'
          git diff --exit-code -- scripts/qualify_d2_terminal_adapter_core.py scripts/qualify_d2_terminal_adapter_v2.py src/resonance_world/d2_terminal_adapter.py src/resonance_world/d2_terminal_transport.py src/resonance_world/provider_send_guard.py src/resonance_world/github_authorization_queries.py research/d2_terminal_adapter_v2/REQUEST_PLAN.json research/evidence/d2_terminal_response_observability/RESULT.json
          git -C .hermes-src diff --exit-code -- run_agent.py pyproject.toml uv.lock
          .locked-hermes-venv/bin/python - <<'PY'
          import importlib.metadata
          from pathlib import Path
          import httpx
          import openai
          import run_agent
          from openai._constants import DEFAULT_MAX_RETRIES
          from resonance_world import d2_terminal_adapter, d2_terminal_transport
          from resonance_world import provider_send_guard

          root = Path.cwd().resolve()
          assert importlib.metadata.version('hermes-agent') == '0.8.0'
          assert importlib.metadata.version('openai') == '2.21.0'
          assert importlib.metadata.version('httpx') == '0.28.1'
          assert openai.__version__ == '2.21.0'
          assert httpx.__version__ == '0.28.1'
          assert DEFAULT_MAX_RETRIES == 2
          assert Path(run_agent.__file__).resolve() == root / '.hermes-src' / 'run_agent.py'
          assert Path(d2_terminal_adapter.__file__).resolve() == root / 'src' / 'resonance_world' / 'd2_terminal_adapter.py'
          assert Path(d2_terminal_transport.__file__).resolve() == root / 'src' / 'resonance_world' / 'd2_terminal_transport.py'
          assert Path(provider_send_guard.__file__).resolve() == root / 'src' / 'resonance_world' / 'provider_send_guard.py'
          PY
      - name: Execute bounded adapter v2 qualification once
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          GLM_BASE_URL: https://api.z.ai/api/coding/paas/v4
          D2_TERMINAL_ADAPTER_V2_AUTHORIZED: "1"
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/.hermes-src
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ZAI_API_KEY:-}"
          test "${GLM_BASE_URL}" = 'https://api.z.ai/api/coding/paas/v4'
          test "${D2_TERMINAL_ADAPTER_V2_AUTHORIZED}" = '1'
          env -u OPENROUTER_API_KEY -u OPENAI_API_KEY -u OPENAI_BASE_URL -u ANTHROPIC_API_KEY -u ANTHROPIC_TOKEN -u NOUS_API_KEY -u GLM_API_KEY -u Z_AI_API_KEY -u KIMI_API_KEY -u MINIMAX_API_KEY -u DEEPSEEK_API_KEY -u DASHSCOPE_API_KEY -u XAI_API_KEY \
            .locked-hermes-venv/bin/python scripts/qualify_d2_terminal_adapter_v2.py \
            --execute --output output/d2-terminal-adapter-v2-qualification-result.json
      - name: Verify bounded result authority
        shell: bash
        run: |
          set -euo pipefail
          test -z "${ZAI_API_KEY:-}"
          test -z "${D2_TERMINAL_ADAPTER_V2_AUTHORIZED:-}"
          .locked-hermes-venv/bin/python - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(Path('output/d2-terminal-adapter-v2-qualification-result.json').read_text())
          assert p['schema'] == 'd2-terminal-adapter-v2-qualification-result-v0.1'
          assert p['issue'] == 251
          assert p['engineering_only'] is True
          assert p['candidate_sha'] == '${{ needs.authorization-integrity.outputs.candidate_sha }}'
          assert p['fresh_seed_namespace'] == 'rw.d2-terminal-adapter.v2'
          assert p['fresh_seed_start'] == 2000000
          assert p['consumed_predecessor_issue'] == 246
          assert p['consumed_predecessor_outcome_unchanged'] == 'INTEGRITY_APPARATUS_FAILURE_PRE_PROVIDER'
          assert p['consumed_predecessor_provider_traffic'] is False
          assert p['authorization_gate_repair_merge_sha'] == '09d6c5c6ac7884213b492da62a1c236f08f1d62c'
          assert p['preserved_evidence_regression'] == {
              'effective_completed': 72,
              'native_completed': 64,
              'terminal_overrides': 8,
          }
          assert p['provider_id'] == 'zai'
          assert p['api_mode'] == 'chat_completions'
          assert p['requested_model'] == 'glm-5.3'
          assert p['probe_count_registered'] == 72
          assert p['probe_count_attempted'] == 72
          assert len(p['probes']) == 72
          assert p['maximum_concurrency'] == 4
          assert p['maximum_physical_sends_total'] == 180
          assert 0 <= p['physical_provider_sends_observed_total'] <= 180
          assert p['qualification_outcome'] in {
              'PASS', 'FAIL', 'ADAPTER_PATH_NOT_EXERCISED', 'APPARATUS_FAILURE'
          }
          assert isinstance(p['effective_completed_count'], int)
          assert 0 <= p['effective_completed_count'] <= 72
          assert isinstance(p['terminal_iteration_override_count'], int)
          assert 0 <= p['terminal_iteration_override_count'] <= 72
          for row in p['probes']:
              assert row['seed'] >= 2000000
              assert row['probe_id'].startswith('adapter_v2_')
              if row['terminal_iteration_override_used']:
                  assert row['hermes_completed'] is False
                  assert row['api_calls'] == 2
                  assert row['physical_provider_sends_observed'] == 2
                  assert len(row['attempts']) == 2
                  assert all(a['http_status'] == 200 for a in row['attempts'])
                  assert all(a['transport_error_type'] is None for a in row['attempts'])
              if row['effective_completed']:
                  assert row['structured_parse_valid'] is True
                  assert row['final_response_length'] > 0
          if p['qualification_pass']:
              assert p['qualification_outcome'] == 'PASS'
              assert p['effective_completed_count'] == 72
              assert p['terminal_iteration_override_count'] > 0
          assert p['hermes_completed_mutated'] is False
          assert p['scientific_scoring_performed'] is False
          assert p['source_acquisition_evidence_generated'] is False
          assert p['registry_promotion_authorized'] is False
          assert p['acceptance_action_authorized'] is False
          assert p['production_historical_substrate_enabled'] is False
          assert p['raw_final_response_content_persisted'] is False
          assert p['same_request_stream_rerun_allowed'] is False
          PY
      - name: Upload bounded evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d2-terminal-adapter-v2-qualification-result
          path: output/d2-terminal-adapter-v2-qualification-result.json
          if-no-files-found: error
          retention-days: 90

  rerun-prohibited:
    if: ${{ github.run_attempt != 1 }}
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo 'Same-stream workflow rerun is prohibited after outcome-bearing execution.' >&2
          exit 1
