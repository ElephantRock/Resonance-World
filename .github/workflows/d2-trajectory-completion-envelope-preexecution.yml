name: D2 Trajectory Completion Envelope Preexecution

on:
  pull_request:
    paths:
      - "research/d2_trajectory_completion_envelope/**"
      - "scripts/qualify_d2_trajectory_completion_envelope.py"
      - "scripts/d2_trajectory_completion_contract.py"
      - "scripts/d2_trajectory_completion_transport.py"
      - "tests/test_d2_trajectory_completion_envelope.py"
      - "src/resonance_world/provider_send_guard.py"
      - "research/evidence/d2_stage1_completion_envelope/RESULT.json"
      - ".github/workflows/d2-trajectory-completion-envelope-preexecution.yml"
      - ".github/workflows/d2-trajectory-completion-envelope-qualification.yml"

permissions:
  contents: read

jobs:
  zero-provider-preexecution:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - id: lifecycle
        name: Verify lifecycle state
        shell: bash
        run: |
          set -euo pipefail
          marker='research/d2_trajectory_completion_envelope/RUN_D2_TRAJECTORY_COMPLETION_ENVELOPE'
          if test -f "$marker"; then
            grep -Eq '^candidate_sha=[0-9a-f]{40}$' "$marker"
            grep -Fxq 'issue=234' "$marker"
            grep -Fxq 'authorization=Autonomous_Operating_Charter_Amendment_A1_standing_execution_authority' "$marker"
            echo 'authorized=true' >> "$GITHUB_OUTPUT"
          else
            echo 'authorized=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Verify preserved Stage-1 authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path('research/evidence/d2_stage1_completion_envelope/RESULT.json')
          p = json.loads(path.read_text())
          canonical = (json.dumps(p, sort_keys=True, separators=(',', ':')) + '\n').encode()
          assert hashlib.sha256(canonical).hexdigest() == (
              '9982e3c059e864cc06027173cfc3e3c17de7276393c501b15d4a4831a722f6a5'
          )
          assert p['schema'] == 'd2-stage1-completion-envelope-result-v0.1'
          assert p['issue'] == 231
          assert p['qualification_pass'] is True
          assert p['selected_profile'] == {
              'name': 'iterations2_tokens768',
              'max_iterations': 2,
              'max_tokens': 768,
          }
          assert p['trajectory_stage_executed'] is False
          assert p['scientific_scoring_performed'] is False
          assert p['production_historical_substrate_enabled'] is False
          PY
      - name: Credential-free deterministic preflight twice
        if: steps.lifecycle.outputs.authorized != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -z "${ZAI_API_KEY:-}"
          test -z "${D2_TRAJECTORY_COMPLETION_ENVELOPE_AUTHORIZED:-}"
          python scripts/qualify_d2_trajectory_completion_envelope.py --preflight \
            --output output/preflight-a.json
          python scripts/qualify_d2_trajectory_completion_envelope.py --preflight \
            --output output/preflight-b.json
          cmp output/preflight-a.json output/preflight-b.json
      - name: Targeted tests
        run: |
          pytest -q \
            tests/test_provider_send_guard.py \
            tests/test_d2_trajectory_completion_envelope.py
      - name: Ruff
        run: |
          ruff check \
            scripts/qualify_d2_trajectory_completion_envelope.py \
            scripts/d2_trajectory_completion_contract.py \
            scripts/d2_trajectory_completion_transport.py \
            tests/test_d2_trajectory_completion_envelope.py

  pinned-hermes-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Resonance World
        uses: actions/checkout@v4
      - name: Checkout pinned Hermes Agent
        uses: actions/checkout@v4
        with:
          repository: hermes-agent-org/hermes
          ref: 036cbdfa0a3158454a0a2a7a7388cf70353326b4
          path: .hermes-src
          fetch-depth: 1
      - name: Verify supported-product source and worker-drain contract without credentials
        shell: bash
        run: |
          set -euo pipefail
          test -z "${ZAI_API_KEY:-}"
          test "$(git -C .hermes-src rev-parse HEAD)" = \
            '036cbdfa0a3158454a0a2a7a7388cf70353326b4'
          test "$(git -C .hermes-src rev-parse HEAD:run_agent.py)" = \
            '4c0d3be4b0c2d364c550fa663d34f6545c9e6d20'
          test "$(git rev-parse HEAD:src/resonance_world/provider_send_guard.py)" = \
            '4b8896235d8048523d007400d0acfe85470f628c'
          grep -Fq 'version = "0.8.0"' .hermes-src/pyproject.toml
          grep -Fq '"openai>=2.21.0,<3"' .hermes-src/pyproject.toml
          grep -Fq 'request_overrides: Dict[str, Any] = None' .hermes-src/run_agent.py
          grep -Fq 'api_kwargs.update(self.request_overrides)' .hermes-src/run_agent.py
          grep -Fq 't = threading.Thread(target=_call, daemon=True)' .hermes-src/run_agent.py
          grep -Fq 'while t.is_alive():' .hermes-src/run_agent.py
          grep -Fq 't.join(timeout=0.3)' .hermes-src/run_agent.py
          grep -Fq 'max_retries = 3' .hermes-src/run_agent.py
          grep -Fq 'primary_recovery_attempted = False' .hermes-src/run_agent.py
