name: D2 Trajectory Terminal Adapter Preexecution

on:
  pull_request:
    paths:
      - "research/d2_trajectory_terminal_adapter/**"
      - "scripts/d2_trajectory_completion_contract.py"
      - "scripts/d2_trajectory_completion_transport.py"
      - "scripts/qualify_d2_trajectory_terminal_adapter.py"
      - "src/resonance_world/d2_terminal_adapter.py"
      - "src/resonance_world/provider_send_guard.py"
      - "src/resonance_world/github_authorization_queries.py"
      - "research/evidence/d2_terminal_adapter_v2_qualification/RESULT.json"
      - "tests/test_d2_trajectory_terminal_adapter.py"
      - "pyproject.toml"
      - ".github/workflows/d2-trajectory-terminal-adapter-preexecution.yml"
      - ".github/workflows/d2-trajectory-terminal-adapter-qualification.yml"

permissions:
  contents: read

jobs:
  zero-provider-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install test-only tools
        run: python -m pip install pytest==9.1.1 ruff==0.16.7 httpx==0.28.1
      - name: Verify marker absent
        run: test ! -e research/d2_trajectory_terminal_adapter/RUN_D2_TRAJECTORY_TERMINAL_ADAPTER
      - name: Verify one-shot authorization workflow contract
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/d2-trajectory-terminal-adapter-qualification.yml'
          test -f "$workflow"
          grep -Fq 'python -m resonance_world.github_authorization_queries' "$workflow"
          if grep -Eq -- '--jq|--template' "$workflow"; then
            echo 'Qualification workflow reintroduced forbidden gh formatting flags.' >&2
            exit 1
          fi
          grep -Fq 'D2_TRAJECTORY_TERMINAL_ADAPTER_AUTHORIZED' "$workflow"
          grep -Fq 'RUN_D2_TRAJECTORY_TERMINAL_ADAPTER' "$workflow"
          grep -Fq -- '--pull-request 256' "$workflow"
          grep -Fq 'run_attempt == 1' "$workflow"
          grep -Fq 'Same-stream workflow rerun is prohibited' "$workflow"
      - name: Verify preserved adapter evidence and frozen blobs
        shell: bash
        run: |
          set -euo pipefail
          echo 'f0c9ba663642bfec83b04287b71991ec3da275e9c231a3666acf88c3ce5b956e  research/evidence/d2_terminal_adapter_v2_qualification/RESULT.json' | sha256sum -c -
          test "$(git hash-object src/resonance_world/provider_send_guard.py)" = '4b8896235d8048523d007400d0acfe85470f628c'
          test "$(git hash-object src/resonance_world/github_authorization_queries.py)" = '4fec4f0bfac06ae17a87a7c148dea6521736a97a'
          test "$(git hash-object src/resonance_world/d2_terminal_adapter.py)" = 'ba16d2eb4b7255437c8ab224e91d5ed093897990'
          test "$(git hash-object scripts/d2_trajectory_completion_contract.py)" = '9d91e35937dfb4f6eadbc23ab240c84d20535ee5'
          test "$(git hash-object scripts/d2_trajectory_completion_transport.py)" = '877112d82d0612d027e13bf93bd0393733fc3c89'
          test "$(git hash-object scripts/qualify_d2_trajectory_terminal_adapter.py)" = 'ba42cf31dab8c6c1fc2db15baab12715eb416578'
          test "$(git hash-object research/d2_trajectory_terminal_adapter/REQUEST_PLAN.json)" = 'e3e877a3738bddc2f3c8e0458d957e560aa153f3'
          test "$(git hash-object research/d2_trajectory_terminal_adapter/TOPOLOGY.json)" = 'b6e68e5a1953ca5ead88a230ec16ea818000dacf'
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('research/evidence/d2_terminal_adapter_v2_qualification/RESULT.json').read_text())
          assert p['issue'] == 251
          assert p['qualification_outcome'] == 'PASS'
          assert p['effective_completed_count'] == 72
          assert p['native_hermes_completed_count'] == 71
          assert p['terminal_iteration_override_count'] == 1
          assert p['physical_provider_sends_observed_total'] == 73
          assert p['apparatus_failure'] is False
          PY
      - name: Deterministic credential-free preflight twice
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        shell: bash
        run: |
          set -euo pipefail
          test -z "${ZAI_API_KEY:-}"
          test -z "${D2_TRAJECTORY_TERMINAL_ADAPTER_AUTHORIZED:-}"
          python scripts/qualify_d2_trajectory_terminal_adapter.py --preflight --output /tmp/preflight-a.json
          python scripts/qualify_d2_trajectory_terminal_adapter.py --preflight --output /tmp/preflight-b.json
          cmp /tmp/preflight-a.json /tmp/preflight-b.json
      - name: Targeted tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: pytest -q tests/test_provider_send_guard.py tests/test_d2_trajectory_terminal_adapter.py
      - name: Ruff
        run: >-
          ruff check
          scripts/d2_trajectory_completion_contract.py
          scripts/d2_trajectory_completion_transport.py
          scripts/qualify_d2_trajectory_terminal_adapter.py
          tests/test_d2_trajectory_terminal_adapter.py
          src/resonance_world/d2_terminal_adapter.py

  pinned-hermes-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pinned Hermes Agent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hermes-agent-org/hermes
          ref: 036cbdfa0a3158454a0a2a7a7388cf70353326b4
          fetch-depth: 1
      - name: Verify frozen source semantics
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '036cbdfa0a3158454a0a2a7a7388cf70353326b4'
          test "$(git rev-parse HEAD:run_agent.py)" = '4c0d3be4b0c2d364c550fa663d34f6545c9e6d20'
          test "$(git rev-parse HEAD:uv.lock)" = '45efc2d93ff627fee4f94ce2b068440873a22188'
          grep -Fq 'version = "0.8.0"' pyproject.toml
          grep -Fq 't = threading.Thread(target=_call, daemon=True)' run_agent.py
          grep -Fq 'while t.is_alive():' run_agent.py
          grep -Fq 't.join(timeout=0.3)' run_agent.py
          grep -Fq 'completed = final_response is not None and api_call_count < self.max_iterations' run_agent.py
          grep -Fq 'api_call_count += 1' run_agent.py
          grep -Fq '"api_calls": api_call_count' run_agent.py
          grep -Fq 'api_kwargs.update(self.request_overrides)' run_agent.py
