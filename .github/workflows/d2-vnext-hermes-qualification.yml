name: D2-vNext Hermes Coding Plan Qualification Execution

on:
  push:
    branches: ["engineering/d2-vnext-hermes-coding-qualification"]
    paths:
      - "research/d2_coding_plan_hermes/RUN_D2_CODING_PLAN_HERMES_QUALIFICATION"

permissions:
  contents: read

jobs:
  authorization-integrity:
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      candidate_sha: ${{ steps.auth.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: auth
        name: Verify sole-child authorization and frozen contract
        shell: bash
        run: |
          set -euo pipefail
          marker='research/d2_coding_plan_hermes/RUN_D2_CODING_PLAN_HERMES_QUALIFICATION'
          test -f "$marker"
          candidate="$(sed -n 's/^candidate_sha=//p' "$marker")"
          issue="$(sed -n 's/^issue=//p' "$marker")"
          authorization="$(sed -n 's/^authorization=//p' "$marker")"
          test -n "$candidate"
          test "$issue" = '213'
          test "$authorization" = 'D2_vNext_Hermes_Coding_Plan_execution_explicitly_authorized'
          test "$(git rev-parse HEAD^)" = "$candidate"
          test "$(git diff --name-only "$candidate" HEAD)" = "$marker"
          test "$(git diff --name-only "$candidate" HEAD | wc -l)" = '1'
          if git cat-file -e "${candidate}:${marker}" 2>/dev/null; then
            echo 'Frozen candidate already contains execution marker.' >&2
            exit 1
          fi
          python - "$candidate" <<'PY'
          import json, subprocess, sys
          candidate=sys.argv[1]
          raw=subprocess.check_output([
              'git','show',
              f'{candidate}:research/d2_coding_plan_hermes/CODING_PLAN_HERMES_REQUEST_PLAN.json'
          ], text=True)
          p=json.loads(raw)
          assert p['issue']==213
          assert p['engineering_only'] is True
          assert p['subscription_product']=='GLM Coding Plan'
          assert p['supported_product_environment']=='Hermes Agent Python library'
          assert p['hermes_repository']=='hermes-agent-org/hermes'
          assert p['hermes_revision']=='036cbdfa0a3158454a0a2a7a7388cf70353326b4'
          assert p['hermes_package_version']=='0.8.0'
          assert p['openai_sdk_version']=='2.21.0'
          assert p['openai_sdk_default_max_retries']==2
          assert p['endpoint_base_url']=='https://api.z.ai/api/coding/paas/v4'
          assert p['provider_id']=='zai'
          assert p['api_mode']=='chat_completions'
          assert p['requested_model']=='glm-5.3'
          assert p['logical_probe_count']==3
          assert p['provider_http_attempt_count_maximum']==9
          assert p['enabled_toolsets']==[]
          assert p['fallback_provider_configured'] is False
          assert p['general_api_fallback_allowed'] is False
          assert p['replacement_probe_allowed'] is False
          assert p['workflow_rerun_allowed'] is False
          assert p['provider_execution_authorized'] is False
          assert p['scientific_campaign_authorized'] is False
          assert p['registry_promotion_authorized'] is False
          assert p['historical_substrate_enabled'] is False
          assert p['same_request_stream_rerun_allowed'] is False
          PY
          echo "candidate_sha=$candidate" >> "$GITHUB_OUTPUT"

  execute-bounded-qualification:
    needs: authorization-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      D2_CODING_PLAN_HERMES_AUTHORIZED: "1"
    steps:
      - name: Checkout Resonance World
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Checkout pinned Hermes Agent
        uses: actions/checkout@v4
        with:
          repository: hermes-agent-org/hermes
          ref: 036cbdfa0a3158454a0a2a7a7388cf70353326b4
          path: .hermes-src
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Reverify exact authorized parent and pinned Hermes source
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = '1'
          test -n "${ZAI_API_KEY:-}"
          test "$(git rev-parse HEAD^)" = '${{ needs.authorization-integrity.outputs.candidate_sha }}'
          test "$(git -C .hermes-src rev-parse HEAD)" = '036cbdfa0a3158454a0a2a7a7388cf70353326b4'
          grep -Fq 'version = "0.8.0"' .hermes-src/pyproject.toml
          grep -Fq '"openai>=2.21.0,<3"' .hermes-src/pyproject.toml
      - name: Install frozen supported-product environment
        run: |
          python -m pip install ./.hermes-src 'openai==2.21.0'
          python - <<'PY'
          import importlib.metadata
          from openai._constants import DEFAULT_MAX_RETRIES
          assert importlib.metadata.version('hermes-agent') == '0.8.0'
          assert importlib.metadata.version('openai') == '2.21.0'
          assert DEFAULT_MAX_RETRIES == 2
          PY
      - name: Execute three bounded Hermes probes
        shell: bash
        run: |
          set -euo pipefail
          env \
            -u OPENROUTER_API_KEY \
            -u OPENAI_API_KEY \
            -u ANTHROPIC_API_KEY \
            -u ANTHROPIC_TOKEN \
            -u NOUS_API_KEY \
            -u KIMI_API_KEY \
            -u MINIMAX_API_KEY \
            -u DEEPSEEK_API_KEY \
            python scripts/qualify_d2_coding_plan_hermes.py \
              --execute \
              --output output/d2-vnext-hermes-coding-plan-qualification.json
      - name: Verify bounded result authority
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('output/d2-vnext-hermes-coding-plan-qualification.json').read_text())
          assert p['schema']=='d2-vnext-hermes-coding-plan-qualification-result-v0.1'
          assert p['issue']==213
          assert p['engineering_only'] is True
          assert p['subscription_product']=='GLM Coding Plan'
          assert p['supported_product_environment']=='Hermes Agent Python library'
          assert p['hermes_revision']=='036cbdfa0a3158454a0a2a7a7388cf70353326b4'
          assert p['hermes_package_version']=='0.8.0'
          assert p['openai_sdk_version']=='2.21.0'
          assert p['endpoint_base_url']=='https://api.z.ai/api/coding/paas/v4'
          assert p['provider_id']=='zai'
          assert p['api_mode']=='chat_completions'
          assert p['requested_model']=='glm-5.3'
          assert p['logical_probe_count']==3
          assert p['provider_http_attempt_count_maximum']==9
          assert len(p['probes'])==3
          assert isinstance(p['qualification_pass'], bool)
          for row in p['probes']:
              assert row['requested_model']=='glm-5.3'
              assert row['tools_exposed']==0
              assert row['max_agent_iterations']==1
              assert row['openai_sdk_max_retries']==2
              assert row['provider_http_attempts_maximum']==3
              assert row['effective_model_identity_observed'] is False
              assert row['effective_model'] is None
          assert p['scientific_field_trajectory_executed'] is False
          assert p['scientific_scoring_performed'] is False
          assert p['scientific_campaign_authorized'] is False
          assert p['registry_promotion_authorized'] is False
          assert p['acceptance_action_authorized'] is False
          assert p['production_historical_substrate_enabled'] is False
          assert p['raw_credentials_persisted'] is False
          assert p['raw_provider_error_body_persisted'] is False
          assert p['raw_provider_error_message_persisted'] is False
          assert p['same_request_stream_rerun_allowed'] is False
          assert p['historical_d2d_s2_replacement'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: d2-vnext-hermes-coding-plan-qualification-result
          path: output/d2-vnext-hermes-coding-plan-qualification.json
          if-no-files-found: error
          retention-days: 90

  rerun-prohibited:
    if: ${{ github.run_attempt != 1 }}
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo 'D2-vNext Hermes/Coding Plan qualification reruns are prohibited.' >&2
          exit 1
