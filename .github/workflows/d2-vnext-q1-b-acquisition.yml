name: D2-vNext-Q1-B Acquisition Qualification

on:
  push:
    branches: ["qualification/d2-vnext-q1-acquisition"]
    paths:
      - "research/d2_vnext_q1/RUN_D2_VNEXT_Q1_B"

permissions:
  contents: read

jobs:
  authorization-integrity:
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      candidate_sha: ${{ steps.auth.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - id: auth
        name: Verify sole-child Q1-B authorization, Q1-A PASS, and frozen contract
        shell: bash
        run: |
          set -euo pipefail
          marker='research/d2_vnext_q1/RUN_D2_VNEXT_Q1_B'
          closeout='research/d2_vnext_q1/D2_VNEXT_Q1_A_QUALIFICATION_CLOSEOUT.json'
          test -f "$marker"
          candidate="$(sed -n 's/^candidate_sha=//p' "$marker")"
          issue="$(sed -n 's/^issue=//p' "$marker")"
          authorization="$(sed -n 's/^authorization=//p' "$marker")"
          cap="$(sed -n 's/^maximum_physical_sends_campaign=//p' "$marker")"
          q1a_hash="$(sed -n 's/^q1_a_result_sha256=//p' "$marker")"
          test -n "$candidate"
          test "$issue" = '290'
          test "$authorization" = 'D2_vNext_Q1_B_exact_candidate_acquisition_qualification_and_27648_send_cap_explicitly_authorized'
          test "$cap" = '27648'
          test -n "$q1a_hash"
          test "$(git rev-parse HEAD^)" = "$candidate"
          test "$(git diff --name-only "$candidate" HEAD)" = "$marker"
          test "$(git diff --name-only "$candidate" HEAD | wc -l)" = '1'
          if git cat-file -e "${candidate}:${marker}" 2>/dev/null; then
            echo 'Frozen Q1-B candidate already contains execution marker.' >&2
            exit 1
          fi
          git show "${candidate}:${closeout}" > /tmp/q1a-closeout.json
          test "$(sha256sum /tmp/q1a-closeout.json | awk '{print $1}')" = "$q1a_hash"
          python - "$candidate" <<'PY'
          import json, subprocess, sys
          candidate=sys.argv[1]
          def show(path):
              return subprocess.check_output(['git','show',f'{candidate}:{path}'], text=True)
          p=json.loads(show('research/d2_vnext_q1/D2_VNEXT_Q1_REQUEST_PLAN.json'))
          assert p['schema']=='d2-vnext-q1-acquisition-qualification-request-plan-v0.1'
          assert p['issue']==290
          assert p['requested_model']=='glm-5.3'
          assert p['hermes_revision']=='036cbdfa0a3158454a0a2a7a7388cf70353326b4'
          assert p['max_physical_provider_sends_per_logical_call']==36
          assert p['max_physical_provider_sends_per_shard']==1152
          assert p['stages']['Q1-B']['maximum_physical_provider_sends_campaign']==27648
          assert p['stages']['Q1-B']['attempted_pairs_total']==384
          assert p['stages']['Q1-B']['requires_q1_a_pass'] is True
          assert p['provider_execution_authorized'] is False
          assert p['scientific_effect_gates_authorized'] is False
          closeout=json.loads(show('research/d2_vnext_q1/D2_VNEXT_Q1_A_QUALIFICATION_CLOSEOUT.json'))
          assert closeout['classification']=='D2-vNext-Q1-A-PASS'
          assert closeout['q1_b_provider_execution_authorized'] is False
          assert closeout['scientific_effect_gates_computed'] is False
          lock=json.loads(show('research/d2_vnext_q1/D2_VNEXT_Q1_B_COHORT_LOCK.json'))
          assert lock['cohort_pairs_sha256']=='41124075eeda43439b392997b090ed7fe11275271b4bae86bc619371f86a750e'
          assert lock['pair_count']==384 and lock['pairs_per_schema']==96
          shards=json.loads(show('research/d2_vnext_q1/D2_VNEXT_Q1_B_SHARD_MAP.json'))
          assert shards['shard_count']==24
          assert shards['workflow_max_parallel']==4
          assert shards['maximum_registered_logical_calls_per_shard']==880
          assert shards['maximum_physical_provider_sends_per_shard']==1152
          assert shards['maximum_physical_provider_sends_campaign']==27648
          assert all(row['schema_counts']=={'threshold_at_4':4,'parity_pair':4,'interval_pair':4,'pairwise_order':4} for row in shards['shards'])
          PY
          echo "candidate_sha=$candidate" >> "$GITHUB_OUTPUT"

  provider-wave-0:
    needs: authorization-integrity
    uses: ./.github/workflows/d2-vnext-q1-b-provider-wave.yml
    with:
      shards: '[0,1,2,3]'
      execution_wave: 0
      candidate_sha: ${{ needs.authorization-integrity.outputs.candidate_sha }}
    secrets: inherit

  provider-wave-1:
    needs: [authorization-integrity, provider-wave-0]
    uses: ./.github/workflows/d2-vnext-q1-b-provider-wave.yml
    with:
      shards: '[4,5,6,7]'
      execution_wave: 1
      candidate_sha: ${{ needs.authorization-integrity.outputs.candidate_sha }}
    secrets: inherit

  provider-wave-2:
    needs: [authorization-integrity, provider-wave-1]
    uses: ./.github/workflows/d2-vnext-q1-b-provider-wave.yml
    with:
      shards: '[8,9,10,11]'
      execution_wave: 2
      candidate_sha: ${{ needs.authorization-integrity.outputs.candidate_sha }}
    secrets: inherit

  provider-wave-3:
    needs: [authorization-integrity, provider-wave-2]
    uses: ./.github/workflows/d2-vnext-q1-b-provider-wave.yml
    with:
      shards: '[12,13,14,15]'
      execution_wave: 3
      candidate_sha: ${{ needs.authorization-integrity.outputs.candidate_sha }}
    secrets: inherit

  provider-wave-4:
    needs: [authorization-integrity, provider-wave-3]
    uses: ./.github/workflows/d2-vnext-q1-b-provider-wave.yml
    with:
      shards: '[16,17,18,19]'
      execution_wave: 4
      candidate_sha: ${{ needs.authorization-integrity.outputs.candidate_sha }}
    secrets: inherit

  provider-wave-5:
    needs: [authorization-integrity, provider-wave-4]
    uses: ./.github/workflows/d2-vnext-q1-b-provider-wave.yml
    with:
      shards: '[20,21,22,23]'
      execution_wave: 5
      candidate_sha: ${{ needs.authorization-integrity.outputs.candidate_sha }}
    secrets: inherit

  aggregate-provider:
    needs: [authorization-integrity, provider-wave-0, provider-wave-1, provider-wave-2, provider-wave-3, provider-wave-4, provider-wave-5]
    if: ${{ always() && needs.authorization-integrity.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: mkdir -p output/provider-shards
      - name: Download available Q1-B provider shard artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          pattern: d2-vnext-q1b-provider-wave-*-shard-*
          path: output/provider-shards
          merge-multiple: true
      - name: Aggregate Q1-B without classification
        run: |
          test -z "${ZAI_API_KEY:-}"
          PYTHONPATH=scripts python scripts/aggregate_d2_vnext_q1_acquisition.py \
            output/provider-shards \
            --stage Q1-B \
            --output-dir output/canonical-provider
      - name: Build frozen execution-wave index
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for path in sorted(Path('output/provider-shards').glob('**/execution-wave.json')):
              rows.append(json.loads(path.read_text()))
          Path('output/canonical-provider/execution-wave-index.json').write_text(
              json.dumps({
                  'schema':'d2-vnext-q1-b-execution-wave-index-v0.1',
                  'study_stream':'D2-vNext-Q1',
                  'stage':'Q1-B',
                  'rows':sorted(rows, key=lambda r:int(r['shard_id'])),
              }, sort_keys=True, separators=(',',':'))+'\n'
          )
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d2-vnext-q1b-canonical-provider-output
          path: output/canonical-provider/
          if-no-files-found: error
          retention-days: 90

  evaluate-frozen:
    needs: aggregate-provider
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: d2-vnext-q1b-canonical-provider-output
          path: output/canonical-provider
      - name: Evaluate frozen Q1-B resource-feasibility contract
        run: |
          test -z "${ZAI_API_KEY:-}"
          PYTHONPATH=scripts python scripts/evaluate_d2_vnext_q1_acquisition.py \
            output/canonical-provider/d2-vnext-q1b-provider-output.json \
            --output-dir output/evaluation
      - name: Preserve execution-wave index beside evaluation
        run: cp output/canonical-provider/execution-wave-index.json output/evaluation/
      - name: Verify Q1-B authority ceiling
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('output/evaluation/d2-vnext-q1b-qualification-result.json').read_text())
          assert p['classification'] in {'D2-vNext-Q1-B0','D2-vNext-Q1-B1','D2-vNext-Q1-B2'}
          assert p['scientific_effect_gates_computed'] is False
          assert p['s2_data_pooled'] is False
          assert p['registry_promotion_authorized'] is False
          assert p['acceptance_action_authorized'] is False
          assert p['production_historical_substrate_enabled'] is False
          if p['classification']=='D2-vNext-Q1-B2':
              assert p['exchangeability_review_required'] is True
              assert p['exchangeability_review_status']=='pending_independent_review'
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d2-vnext-q1b-acquisition-qualification-evaluation
          path: output/evaluation/
          if-no-files-found: error
          retention-days: 90

  rerun-prohibited:
    if: ${{ github.run_attempt != 1 }}
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo 'D2-vNext-Q1-B provider workflow reruns are prohibited.' >&2
          exit 1
