name: D2-vNext-Q1 Materialization

on:
  pull_request:
    paths:
      - "research/d2_vnext_q1/**"
      - "scripts/d2_vnext_q1_acquisition_core.py"
      - "scripts/materialize_d2_vnext_q1_acquisition.py"
      - "tests/test_d2_vnext_q1_materialization.py"
      - ".github/workflows/d2-vnext-q1-materialization.yml"
  push:
    branches:
      - qualification/d2-vnext-q1-acquisition
    paths:
      - "research/d2_vnext_q1/**"
      - "scripts/d2_vnext_q1_acquisition_core.py"
      - "scripts/materialize_d2_vnext_q1_acquisition.py"
      - "tests/test_d2_vnext_q1_materialization.py"
      - ".github/workflows/d2-vnext-q1-materialization.yml"

permissions:
  contents: read

jobs:
  credential-free-materialization:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Assert provider credentials absent
        shell: bash
        run: |
          set -euo pipefail
          test -z "${ZAI_API_KEY:-}"
          test -z "${GLM_API_KEY:-}"
          test -z "${OPENAI_API_KEY:-}"
          test -z "${D2_VNEXT_Q1_A_EXECUTION_AUTHORIZED:-}"
          test -z "${D2_VNEXT_Q1_B_EXECUTION_AUTHORIZED:-}"
      - run: python -m pip install -e '.[dev]'
      - name: Materialize twice and compare byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          rm -rf output/q1-a output/q1-b
          python scripts/materialize_d2_vnext_q1_acquisition.py --output-dir output/q1-a
          python scripts/materialize_d2_vnext_q1_acquisition.py --output-dir output/q1-b
          for f in D2_VNEXT_Q1_A_COHORT_LOCK.json D2_VNEXT_Q1_A_SHARD_MAP.json D2_VNEXT_Q1_B_COHORT_LOCK.json D2_VNEXT_Q1_B_SHARD_MAP.json materialization-manifest.json; do
            cmp "output/q1-a/$f" "output/q1-b/$f"
          done
      - name: Verify committed frozen cohort and shard commitments
        shell: bash
        run: |
          set -euo pipefail
          for f in D2_VNEXT_Q1_A_COHORT_LOCK.json D2_VNEXT_Q1_A_SHARD_MAP.json D2_VNEXT_Q1_B_COHORT_LOCK.json D2_VNEXT_Q1_B_SHARD_MAP.json; do
            cmp "output/q1-a/$f" "research/d2_vnext_q1/$f"
          done
      - name: Targeted tests
        env:
          PYTHONPATH: scripts
        run: pytest -q tests/test_d2_vnext_q1_materialization.py
      - name: Ruff
        run: |
          ruff check scripts/d2_vnext_q1_acquisition_core.py scripts/materialize_d2_vnext_q1_acquisition.py tests/test_d2_vnext_q1_materialization.py
      - uses: actions/upload-artifact@v4
        with:
          name: d2-vnext-q1-materialization
          path: output/q1-a/
          if-no-files-found: error
