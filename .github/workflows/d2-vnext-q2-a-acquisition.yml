name: D2-vNext-Q2-A Acquisition Qualification

on:
  push:
    branches: ["qualification/d2-vnext-q2-empty-regeneration"]
    paths: ["research/d2_vnext_q2/RUN_D2_VNEXT_Q2_A"]
permissions:
  contents: read
jobs:
  authorization-integrity:
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    outputs:
      candidate_sha: ${{ steps.auth.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 2}
      - id: auth
        shell: bash
        run: |
          set -euo pipefail
          marker=research/d2_vnext_q2/RUN_D2_VNEXT_Q2_A
          candidate=$(sed -n 's/^candidate_sha=//p' "$marker")
          test "$(sed -n 's/^issue=//p' "$marker")" = 293
          test "$(sed -n 's/^authorization=//p' "$marker")" = D2_vNext_Q2_A_exact_candidate_acquisition_qualification_and_4608_send_cap_explicitly_authorized
          test "$(sed -n 's/^maximum_physical_sends_campaign=//p' "$marker")" = 4608
          test "$(git rev-parse HEAD^)" = "$candidate"
          test "$(git diff --name-only "$candidate" HEAD)" = "$marker"
          echo "candidate_sha=$candidate" >> "$GITHUB_OUTPUT"
  provider-shards:
    needs: authorization-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: {shard: [0,1,2,3]}
    env:
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      GLM_BASE_URL: https://api.z.ai/api/coding/paas/v4
      D2_VNEXT_Q2_A_EXECUTION_AUTHORIZED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 2}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {repository: hermes-agent-org/hermes, ref: 036cbdfa0a3158454a0a2a7a7388cf70353326b4, path: .hermes-src}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - run: python -m pip install -e '.[dev]' && python -m pip install ./.hermes-src 'openai==2.21.0' 'httpx==0.28.1'
      - name: Execute bounded Q2-A shard
        run: python scripts/run_d2_vnext_q2_acquisition.py --stage Q2-A --shard-id '${{ matrix.shard }}' --output-dir 'output/provider-${{ matrix.shard }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: "d2-vnext-q2a-provider-shard-${{ matrix.shard }}", path: "output/provider-${{ matrix.shard }}/", if-no-files-found: error, retention-days: 90}
  aggregate-provider:
    needs: [authorization-integrity, provider-shards]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - run: python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {pattern: d2-vnext-q2a-provider-shard-*, path: output/provider-shards, merge-multiple: true}
      - run: PYTHONPATH=scripts python scripts/aggregate_d2_vnext_q2_acquisition.py output/provider-shards --stage Q2-A --output-dir output/canonical-provider
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: d2-vnext-q2a-canonical-provider-output, path: output/canonical-provider/, if-no-files-found: error, retention-days: 90}
  evaluate-frozen:
    needs: aggregate-provider
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - run: python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: d2-vnext-q2a-canonical-provider-output, path: output/canonical-provider}
      - run: PYTHONPATH=scripts python scripts/evaluate_d2_vnext_q2_acquisition.py output/canonical-provider/d2-vnext-q2a-provider-output.json --output-dir output/evaluation
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: d2-vnext-q2a-acquisition-qualification-evaluation, path: output/evaluation/, if-no-files-found: error, retention-days: 90}
  rerun-prohibited:
    if: ${{ github.run_attempt != 1 }}
    runs-on: ubuntu-24.04
    steps:
      - run: exit 1
