name: D2-vNext-Q2-B Acquisition Qualification
on:
  push:
    branches: ["qualification/d2-vnext-q2-empty-regeneration"]
    paths: ["research/d2_vnext_q2/RUN_D2_VNEXT_Q2_B"]
permissions: {contents: read}
jobs:
  authorization-integrity:
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    outputs:
      candidate_sha: ${{ steps.auth.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 2}
      - id: auth
        run: |
          set -euo pipefail
          marker=research/d2_vnext_q2/RUN_D2_VNEXT_Q2_B
          candidate=$(sed -n 's/^candidate_sha=//p' "$marker")
          test "$(sed -n 's/^issue=//p' "$marker")" = 293
          test "$(sed -n 's/^authorization=//p' "$marker")" = D2_vNext_Q2_B_exact_candidate_acquisition_qualification_and_27648_send_cap_explicitly_authorized
          test "$(sed -n 's/^maximum_physical_sends_campaign=//p' "$marker")" = 27648
          test "$(git rev-parse HEAD^)" = "$candidate"
          test "$(git diff --name-only "$candidate" HEAD)" = "$marker"
          if git cat-file -e "$candidate:$marker" 2>/dev/null; then
            echo "authorization marker must be absent from candidate" >&2
            exit 1
          fi
          python - <<'PY2'
          import json
          p=json.load(open('research/d2_vnext_q2/D2_VNEXT_Q2_A_QUALIFICATION_CLOSEOUT.json'))
          assert p['classification']=='D2-vNext-Q2-A-PASS'
          PY2
          echo "candidate_sha=$candidate" >> "$GITHUB_OUTPUT"
  provider-wave-0:
    needs: authorization-integrity
    uses: ./.github/workflows/d2-vnext-q2-b-provider-wave.yml
    with: {shards: '[0,1,2,3]', execution_wave: 0, candidate_sha: "${{ needs.authorization-integrity.outputs.candidate_sha }}"}
    secrets: inherit
  provider-wave-1:
    needs: [authorization-integrity, provider-wave-0]
    uses: ./.github/workflows/d2-vnext-q2-b-provider-wave.yml
    with: {shards: '[4,5,6,7]', execution_wave: 1, candidate_sha: "${{ needs.authorization-integrity.outputs.candidate_sha }}"}
    secrets: inherit
  provider-wave-2:
    needs: [authorization-integrity, provider-wave-1]
    uses: ./.github/workflows/d2-vnext-q2-b-provider-wave.yml
    with: {shards: '[8,9,10,11]', execution_wave: 2, candidate_sha: "${{ needs.authorization-integrity.outputs.candidate_sha }}"}
    secrets: inherit
  provider-wave-3:
    needs: [authorization-integrity, provider-wave-2]
    uses: ./.github/workflows/d2-vnext-q2-b-provider-wave.yml
    with: {shards: '[12,13,14,15]', execution_wave: 3, candidate_sha: "${{ needs.authorization-integrity.outputs.candidate_sha }}"}
    secrets: inherit
  provider-wave-4:
    needs: [authorization-integrity, provider-wave-3]
    uses: ./.github/workflows/d2-vnext-q2-b-provider-wave.yml
    with: {shards: '[16,17,18,19]', execution_wave: 4, candidate_sha: "${{ needs.authorization-integrity.outputs.candidate_sha }}"}
    secrets: inherit
  provider-wave-5:
    needs: [authorization-integrity, provider-wave-4]
    uses: ./.github/workflows/d2-vnext-q2-b-provider-wave.yml
    with: {shards: '[20,21,22,23]', execution_wave: 5, candidate_sha: "${{ needs.authorization-integrity.outputs.candidate_sha }}"}
    secrets: inherit
  aggregate-provider:
    if: ${{ always() && needs.authorization-integrity.result == 'success' }}
    needs: [authorization-integrity, provider-wave-0, provider-wave-1, provider-wave-2, provider-wave-3, provider-wave-4, provider-wave-5]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - run: python -m pip install -e '.[dev]'
      - run: mkdir -p output/provider-shards
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with: {pattern: d2-vnext-q2b-provider-wave-*-shard-*, path: output/provider-shards, merge-multiple: false}
      - run: PYTHONPATH=scripts python scripts/aggregate_d2_vnext_q2_acquisition.py output/provider-shards --stage Q2-B --output-dir output/canonical-provider
      - name: Materialize execution-wave index
        env:
          CANDIDATE_SHA: ${{ needs.authorization-integrity.outputs.candidate_sha }}
        run: |
          python - <<'PY2'
          import json, os
          from pathlib import Path
          root=Path('output/provider-shards')
          observed={}
          for path in root.glob('**/execution-wave.json'):
              row=json.loads(path.read_text())
              shard=int(row['shard_id']); wave=int(row['execution_wave'])
              if not 0 <= shard < 24 or wave != shard//4 or shard in observed:
                  raise SystemExit('invalid or duplicate Q2-B execution-wave record')
              observed[shard]=wave
          payload={
              'schema':'d2-vnext-q2-b-execution-wave-index-v0.1',
              'study_stream':'D2-vNext-Q2',
              'stage':'Q2-B',
              'authorized_candidate_sha':os.environ['CANDIDATE_SHA'],
              'expected_shards':24,
              'observed_execution_wave_records':len(observed),
              'shards':[{'shard_id':i,'execution_wave':i//4,'execution_wave_record_observed':i in observed} for i in range(24)],
              'scientific_effect_inputs_consulted':False,
          }
          out=Path('output/canonical-provider/execution-wave-index.json')
          out.write_text(json.dumps(payload,sort_keys=True,separators=(',',':'))+'\n')
          PY2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: d2-vnext-q2b-canonical-provider-output, path: output/canonical-provider/, if-no-files-found: error, retention-days: 90}
  evaluate-frozen:
    needs: aggregate-provider
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - run: python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: d2-vnext-q2b-canonical-provider-output, path: output/canonical-provider}
      - run: PYTHONPATH=scripts python scripts/evaluate_d2_vnext_q2_acquisition.py output/canonical-provider/d2-vnext-q2b-provider-output.json --output-dir output/evaluation
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: d2-vnext-q2b-acquisition-qualification-evaluation, path: output/evaluation/, if-no-files-found: error, retention-days: 90}
  rerun-prohibited:
    if: ${{ github.run_attempt != 1 }}
    runs-on: ubuntu-24.04
    steps: [{run: exit 1}]
