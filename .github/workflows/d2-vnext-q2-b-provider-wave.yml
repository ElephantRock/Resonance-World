name: D2-vNext-Q2-B Provider Wave
on:
  workflow_call:
    inputs:
      shards: {required: true, type: string}
      execution_wave: {required: true, type: number}
      candidate_sha: {required: true, type: string}
    secrets:
      ZAI_API_KEY: {required: true}
permissions: {contents: read}
jobs:
  provider-shards:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: ${{ fromJSON(inputs.shards) }}
    env:
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      GLM_BASE_URL: https://api.z.ai/api/coding/paas/v4
      D2_VNEXT_Q2_B_EXECUTION_AUTHORIZED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 2}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {repository: hermes-agent-org/hermes, ref: 036cbdfa0a3158454a0a2a7a7388cf70353326b4, path: .hermes-src}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - run: python -m pip install -e '.[dev]' && python -m pip install ./.hermes-src 'openai==2.21.0' 'httpx==0.28.1'
      - run: python scripts/run_d2_vnext_q2_acquisition.py --stage Q2-B --shard-id '${{ matrix.shard }}' --output-dir 'output/provider-${{ matrix.shard }}'
      - run: python -c "import json,pathlib; pathlib.Path('output/provider-${{ matrix.shard }}/execution-wave.json').write_text(json.dumps({'stage':'Q2-B','shard_id':${{ matrix.shard }},'execution_wave':${{ inputs.execution_wave }}},sort_keys=True)+'\n')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: "d2-vnext-q2b-provider-wave-${{ inputs.execution_wave }}-shard-${{ matrix.shard }}", path: "output/provider-${{ matrix.shard }}/", if-no-files-found: error, retention-days: 90}
