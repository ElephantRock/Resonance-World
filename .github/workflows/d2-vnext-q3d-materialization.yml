name: D2-vNext-Q3-D Materialization

on:
  push:
    branches: ["qualification/d2-vnext-q3d-terminal-boundary"]
    paths:
      - "scripts/d2_vnext_q3d_diagnostic_core.py"
      - "scripts/materialize_d2_vnext_q3d_diagnostic.py"
      - "research/d2_vnext_q3d/**"
      - ".github/workflows/d2-vnext-q3d-materialization.yml"
  pull_request:
    paths:
      - "scripts/d2_vnext_q3d_diagnostic_core.py"
      - "scripts/materialize_d2_vnext_q3d_diagnostic.py"
      - "research/d2_vnext_q3d/**"
      - ".github/workflows/d2-vnext-q3d-materialization.yml"

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: PYTHONPATH=scripts python scripts/materialize_d2_vnext_q3d_diagnostic.py --output-dir output/q3d-materialization
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d2-vnext-q3d-materialization
          path: output/q3d-materialization/
          if-no-files-found: error
          retention-days: 90
