name: D2-vNext-Q3-D Preexecution

on:
  push:
    branches: ["qualification/d2-vnext-q3d-terminal-boundary"]
  pull_request:
    paths:
      - "scripts/*q3d*"
      - "research/d2_vnext_q3d/**"
      - "tests/test_d2_vnext_q3d_diagnostic.py"
      - ".github/workflows/d2-vnext-q3d-*.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - run: python -m pip install -e '.[dev]'
      - name: Marker must remain absent
        run: test ! -e research/d2_vnext_q3d/RUN_D2_VNEXT_Q3D
      - name: Deterministic materialization
        run: PYTHONPATH=scripts python scripts/materialize_d2_vnext_q3d_diagnostic.py --output-dir output/q3d-materialization
      - name: Q3-D construction tests
        run: PYTHONPATH=scripts pytest -q tests/test_d2_vnext_q3d_diagnostic.py
      - name: Compile future execution apparatus
        run: python -m py_compile scripts/d2_vnext_q3d_hermes_client.py scripts/run_d2_vnext_q3d_diagnostic.py scripts/aggregate_d2_vnext_q3d_diagnostic.py scripts/evaluate_d2_vnext_q3d_diagnostic.py
