name: D2-vNext-Q3-D3 HTTP-SDK Boundary Diagnostic

on:
  push:
    branches: ["qualification/d2-vnext-q3d3-http-sdk-boundary"]
    paths: ["research/d2_vnext_q3d3/RUN_D2_VNEXT_Q3D3"]

permissions:
  contents: read

jobs:
  authorization-integrity:
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    outputs:
      candidate_sha: ${{ steps.auth.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 2}
      - id: auth
        shell: bash
        run: |
          set -euo pipefail
          marker=research/d2_vnext_q3d3/RUN_D2_VNEXT_Q3D3
          candidate=$(sed -n 's/^candidate_sha=//p' "$marker")
          test "$(sed -n 's/^issue=//p' "$marker")" = 306
          test "$(sed -n 's/^authorization=//p' "$marker")" = D2_vNext_Q3_D3_exact_candidate_http_sdk_boundary_diagnostic_and_2304_send_cap_explicitly_authorized
          test "$(sed -n 's/^maximum_physical_sends_campaign=//p' "$marker")" = 2304
          test "$(git rev-parse HEAD^)" = "$candidate"
          test "$(git diff --name-only "$candidate" HEAD)" = "$marker"
          if git cat-file -e "$candidate:$marker" 2>/dev/null; then
            echo "authorization marker must be absent from candidate" >&2
            exit 1
          fi
          echo "candidate_sha=$candidate" >> "$GITHUB_OUTPUT"

  provider-shards:
    needs: authorization-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: {shard: [0, 1]}
    env:
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      GLM_BASE_URL: https://api.z.ai/api/coding/paas/v4
      D2_VNEXT_Q3D3_EXECUTION_AUTHORIZED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 2}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hermes-agent-org/hermes
          ref: 036cbdfa0a3158454a0a2a7a7388cf70353326b4
          path: .hermes-src
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - run: python -m pip install -e '.[dev]' && python -m pip install ./.hermes-src 'openai==2.21.0' 'httpx==0.28.1'
      - name: Execute bounded Q3-D3 shard
        run: python scripts/run_d2_vnext_q3d3_diagnostic.py --shard-id '${{ matrix.shard }}' --output-dir 'output/provider-${{ matrix.shard }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d2-vnext-q3d3-provider-shard-${{ matrix.shard }}
          path: output/provider-${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 90

  aggregate-provider:
    if: ${{ always() && needs.authorization-integrity.result == 'success' }}
    needs: [authorization-integrity, provider-shards]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - run: python -m pip install -e '.[dev]'
      - run: mkdir -p output/provider-shards
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          pattern: d2-vnext-q3d3-provider-shard-*
          path: output/provider-shards
          merge-multiple: true
      - run: PYTHONPATH=scripts python scripts/aggregate_d2_vnext_q3d3_diagnostic.py output/provider-shards --output-dir output/canonical-provider
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d2-vnext-q3d3-canonical-provider-output
          path: output/canonical-provider/
          if-no-files-found: error
          retention-days: 90

  evaluate-frozen:
    needs: aggregate-provider
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - run: python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: d2-vnext-q3d3-canonical-provider-output
          path: output/canonical-provider
      - run: PYTHONPATH=scripts python scripts/evaluate_d2_vnext_q3d3_diagnostic.py output/canonical-provider/d2-vnext-q3d3-provider-output.json --output-dir output/evaluation
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d2-vnext-q3d3-http-sdk-boundary-evaluation
          path: output/evaluation/
          if-no-files-found: error
          retention-days: 90

  rerun-prohibited:
    if: ${{ github.run_attempt != 1 }}
    runs-on: ubuntu-24.04
    steps:
      - run: exit 1
