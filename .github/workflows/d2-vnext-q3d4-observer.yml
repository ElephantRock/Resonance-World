name: D2-vNext-Q3-D4 Buffered Response Observer Qualification

on:
  pull_request:
    paths:
      - "scripts/d2_vnext_q3d4_openai_response_observer.py"
      - "research/d2_vnext_q3d3/**"
      - "research/d2_vnext_q3d4/**"
      - "tests/test_d2_vnext_q3d4_*.py"
      - ".github/workflows/d2-vnext-q3d3-*.yml"
      - ".github/workflows/d2-vnext-q3d4-observer.yml"
  push:
    branches: ["main"]
    paths:
      - "scripts/d2_vnext_q3d4_openai_response_observer.py"
      - "research/d2_vnext_q3d3/**"
      - "research/d2_vnext_q3d4/**"
      - "tests/test_d2_vnext_q3d4_*.py"
      - ".github/workflows/d2-vnext-q3d3-*.yml"
      - ".github/workflows/d2-vnext-q3d4-observer.yml"

permissions:
  contents: read

jobs:
  exact-runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hermes-agent-org/hermes
          ref: 036cbdfa0a3158454a0a2a7a7388cf70353326b4
          path: .hermes-src
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install exact credential-free runtime
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install ./.hermes-src
          python -m pip install 'openai==2.21.0' 'httpx==0.28.1'
      - name: Verify pinned package versions
        run: |
          python - <<'PY'
          import importlib.metadata as m
          assert m.version("openai") == "2.21.0"
          assert m.version("httpx") == "0.28.1"
          assert m.version("hermes-agent") == "0.8.0"
          PY
      - name: Assert Q3-D4 execution apparatus is absent
        run: |
          test ! -e research/d2_vnext_q3d4/RUN_D2_VNEXT_Q3D4
          test ! -e .github/workflows/d2-vnext-q3d4-diagnostic.yml
      - name: Run Q3-D4 credential-free tests
        env:
          PYTHONPATH: scripts:.hermes-src
        run: |
          pytest -q \
            tests/test_d2_vnext_q3d4_openai_response_observer.py \
            tests/test_d2_vnext_q3d4_contract.py \
            tests/test_d2_vnext_q3d4_exact_runtime.py
      - name: Compile observer
        run: python -m py_compile scripts/d2_vnext_q3d4_openai_response_observer.py
