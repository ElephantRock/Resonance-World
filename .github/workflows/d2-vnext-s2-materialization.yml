name: D2-vNext-S2 Materialization

on:
  pull_request:
    paths:
      - "research/d2_vnext_s2/**"
      - "scripts/d2_vnext_s2_acquisition_core.py"
      - "scripts/materialize_d2_vnext_s2_source_acquisition.py"
      - "tests/test_d2_vnext_s2_source_acquisition.py"
      - ".github/workflows/d2-vnext-s2-materialization.yml"

permissions:
  contents: read

jobs:
  deterministic-zero-provider-materialization:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Verify frozen consumed lifecycle authority record
        shell: bash
        run: |
          set -euo pipefail
          test -z "${ZAI_API_KEY:-}"
          test -z "${D2_VNEXT_S2_SCIENTIFIC_EXECUTION_AUTHORIZED:-}"
          marker='research/d2_vnext_s2/RUN_D2_VNEXT_S2_SOURCE_ACQUISITION'
          test -f "$marker"
          python - <<'PY'
          import json
          from pathlib import Path
          marker = Path('research/d2_vnext_s2/RUN_D2_VNEXT_S2_SOURCE_ACQUISITION')
          fields = dict(line.split('=', 1) for line in marker.read_text().splitlines() if line)
          assert fields == {
              'candidate_sha': 'd65f5bb803af966b79622d6104f00756b7e9e8c7',
              'issue': '279',
              'authorization': 'D2_vNext_S2_exact_candidate_scientific_campaign_and_48000_send_cap_explicitly_authorized',
              'maximum_physical_sends_campaign': '48000',
          }
          closeout = json.loads(Path('research/d2_vnext_s2/D2_VNEXT_S2_SOURCE_ACQUISITION_CLOSEOUT.json').read_text())
          assert closeout['workflow_run_id'] == 35909017872
          assert closeout['classification'] == 'D2-vNext-S2-A0'
          assert closeout['same_request_stream_rerun_authorized'] is False
          assert closeout['registry_promotion_authorized'] is False
          assert closeout['acceptance_action_authorized'] is False
          assert closeout['historical_substrate_enabled'] is False
          PY
      - name: Materialize twice and verify frozen determinism
        shell: bash
        run: |
          set -euo pipefail
          rm -rf output/d2-vnext-s2-material-a output/d2-vnext-s2-material-b
          python scripts/materialize_d2_vnext_s2_source_acquisition.py \
            --output-dir output/d2-vnext-s2-material-a
          python scripts/materialize_d2_vnext_s2_source_acquisition.py \
            --output-dir output/d2-vnext-s2-material-b
          cmp output/d2-vnext-s2-material-a/d2-vnext-s2-source-acquisition-cohort-lock.json \
              output/d2-vnext-s2-material-b/d2-vnext-s2-source-acquisition-cohort-lock.json
          cmp output/d2-vnext-s2-material-a/D2_VNEXT_S2_SHARD_MAP.json \
              output/d2-vnext-s2-material-b/D2_VNEXT_S2_SHARD_MAP.json
          cmp output/d2-vnext-s2-material-a/d2-vnext-s2-source-acquisition-cohort-lock.json \
              research/d2_vnext_s2/d2-vnext-s2-source-acquisition-cohort-lock.json
          cmp output/d2-vnext-s2-material-a/D2_VNEXT_S2_SHARD_MAP.json \
              research/d2_vnext_s2/D2_VNEXT_S2_SHARD_MAP.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('output/d2-vnext-s2-material-a/d2-vnext-s2-source-acquisition-cohort-lock.json').read_text())
          print('D2_VNEXT_S2_COHORT_PAIRS_SHA256=' + p['cohort_pairs_sha256'])
          assert p['cohort_pairs_sha256']=='a61a2667b088301bfedc9158662511179a4e806d4aaf679fb865e1c42ded6c94'
          assert p['pair_count']==384
          assert p['pairs_per_schema']==96
          assert p['cross_schema_seed_overlap']==0
          assert all(value == 0 for value in p['predecessor_seed_namespace_overlap'].values())
          assert p['all_development_evaluation_overlaps_zero'] is True
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d2-vnext-s2-materialization
          path: output/d2-vnext-s2-material-a/
          if-no-files-found: error
          retention-days: 30
