name: D2-vNext-S2 Materialization

on:
  pull_request:
    paths:
      - "research/d2_vnext_s2/**"
      - "scripts/d2_vnext_s2_acquisition_core.py"
      - "scripts/materialize_d2_vnext_s2_source_acquisition.py"
      - "tests/test_d2_vnext_s2_source_acquisition.py"
      - ".github/workflows/d2-vnext-s2-materialization.yml"

permissions:
  contents: read

jobs:
  deterministic-zero-provider-materialization:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Verify provider authority is absent
        shell: bash
        run: |
          set -euo pipefail
          test -z "${ZAI_API_KEY:-}"
          test -z "${D2_VNEXT_S2_SCIENTIFIC_EXECUTION_AUTHORIZED:-}"
          test ! -f research/d2_vnext_s2/RUN_D2_VNEXT_S2_SOURCE_ACQUISITION
      - name: Materialize twice and verify determinism
        shell: bash
        run: |
          set -euo pipefail
          rm -rf output/d2-vnext-s2-material-a output/d2-vnext-s2-material-b
          python scripts/materialize_d2_vnext_s2_source_acquisition.py \
            --output-dir output/d2-vnext-s2-material-a
          python scripts/materialize_d2_vnext_s2_source_acquisition.py \
            --output-dir output/d2-vnext-s2-material-b
          cmp output/d2-vnext-s2-material-a/d2-vnext-s2-source-acquisition-cohort-lock.json \
              output/d2-vnext-s2-material-b/d2-vnext-s2-source-acquisition-cohort-lock.json
          cmp output/d2-vnext-s2-material-a/D2_VNEXT_S2_SHARD_MAP.json \
              output/d2-vnext-s2-material-b/D2_VNEXT_S2_SHARD_MAP.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('output/d2-vnext-s2-material-a/d2-vnext-s2-source-acquisition-cohort-lock.json').read_text())
          print('D2_VNEXT_S2_COHORT_PAIRS_SHA256=' + p['cohort_pairs_sha256'])
          assert p['pair_count']==384
          assert p['pairs_per_schema']==96
          assert p['cross_schema_seed_overlap']==0
          assert all(value == 0 for value in p['predecessor_seed_namespace_overlap'].values())
          assert p['all_development_evaluation_overlaps_zero'] is True
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: d2-vnext-s2-materialization
          path: output/d2-vnext-s2-material-a/
          if-no-files-found: error
          retention-days: 30
