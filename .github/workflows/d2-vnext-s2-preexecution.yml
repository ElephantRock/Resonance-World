name: D2-vNext-S2 Source Acquisition Preexecution

on:
  pull_request:
    paths:
      - "research/d2_vnext_s2/**"
      - "scripts/d2_vnext_s2_acquisition_core.py"
      - "scripts/d2_vnext_s2_hermes_client.py"
      - "scripts/materialize_d2_vnext_s2_source_acquisition.py"
      - "scripts/run_d2_vnext_s2_source_acquisition.py"
      - "scripts/aggregate_d2_vnext_s2_source_acquisition.py"
      - "scripts/evaluate_d2_vnext_s2_source_acquisition.py"
      - "src/resonance_world/d2_terminal_adapter.py"
      - "tests/test_d2_vnext_s2_source_acquisition.py"
      - ".github/workflows/d2-vnext-s2-materialization.yml"
      - ".github/workflows/d2-vnext-s2-preexecution.yml"
      - ".github/workflows/d2-vnext-s2-source-acquisition.yml"

permissions:
  contents: read

jobs:
  zero-provider-preexecution:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Verify frozen consumed lifecycle authority record
        shell: bash
        run: |
          set -euo pipefail
          test -z "${ZAI_API_KEY:-}"
          test -z "${D2_VNEXT_S2_SCIENTIFIC_EXECUTION_AUTHORIZED:-}"
          marker='research/d2_vnext_s2/RUN_D2_VNEXT_S2_SOURCE_ACQUISITION'
          test -f "$marker"
          python - <<'PY'
          import json
          from pathlib import Path
          marker = Path('research/d2_vnext_s2/RUN_D2_VNEXT_S2_SOURCE_ACQUISITION')
          fields = dict(line.split('=', 1) for line in marker.read_text().splitlines() if line)
          assert fields == {
              'candidate_sha': 'd65f5bb803af966b79622d6104f00756b7e9e8c7',
              'issue': '279',
              'authorization': 'D2_vNext_S2_exact_candidate_scientific_campaign_and_48000_send_cap_explicitly_authorized',
              'maximum_physical_sends_campaign': '48000',
          }
          closeout = json.loads(Path('research/d2_vnext_s2/D2_VNEXT_S2_SOURCE_ACQUISITION_CLOSEOUT.json').read_text())
          assert closeout['workflow_run_id'] == 35909017872
          assert closeout['classification'] == 'D2-vNext-S2-A0'
          assert closeout['same_request_stream_rerun_authorized'] is False
          assert closeout['registry_promotion_authorized'] is False
          assert closeout['acceptance_action_authorized'] is False
          assert closeout['historical_substrate_enabled'] is False
          PY
      - name: Rebuild and verify committed frozen cohort
        shell: bash
        run: |
          set -euo pipefail
          rm -rf output/d2-vnext-s2-preflight-a output/d2-vnext-s2-preflight-b
          python scripts/materialize_d2_vnext_s2_source_acquisition.py \
            --output-dir output/d2-vnext-s2-preflight-a
          python scripts/materialize_d2_vnext_s2_source_acquisition.py \
            --output-dir output/d2-vnext-s2-preflight-b
          cmp output/d2-vnext-s2-preflight-a/d2-vnext-s2-source-acquisition-cohort-lock.json \
              output/d2-vnext-s2-preflight-b/d2-vnext-s2-source-acquisition-cohort-lock.json
          cmp output/d2-vnext-s2-preflight-a/D2_VNEXT_S2_SHARD_MAP.json \
              output/d2-vnext-s2-preflight-b/D2_VNEXT_S2_SHARD_MAP.json
          cmp output/d2-vnext-s2-preflight-a/d2-vnext-s2-source-acquisition-cohort-lock.json \
              research/d2_vnext_s2/d2-vnext-s2-source-acquisition-cohort-lock.json
          cmp output/d2-vnext-s2-preflight-a/D2_VNEXT_S2_SHARD_MAP.json \
              research/d2_vnext_s2/D2_VNEXT_S2_SHARD_MAP.json
      - name: Verify frozen scientific and execution contract
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('research/d2_vnext_s2/D2_VNEXT_S2_REQUEST_PLAN.json').read_text())
          assert p['schema']=='d2-vnext-s2-source-acquisition-request-plan-v0.1'
          assert p['issue']==279
          assert p['study_stream']=='D2-vNext-S2'
          assert p['fresh_namespace']=='rw.d2-vnext-s2-source-acquisition.v1'
          assert p['subscription_product']=='GLM Coding Plan'
          assert p['supported_product_environment']=='Hermes Agent Python library'
          assert p['hermes_repository']=='hermes-agent-org/hermes'
          assert p['hermes_revision']=='036cbdfa0a3158454a0a2a7a7388cf70353326b4'
          assert p['hermes_package_version']=='0.8.0'
          assert p['hermes_run_agent_blob_sha']=='4c0d3be4b0c2d364c550fa663d34f6545c9e6d20'
          assert p['hermes_pyproject_blob_sha']=='95a1dfddd74bc399dd7f23f8d0143852b5689463'
          assert p['qualified_terminal_adapter_blob_sha']=='ba16d2eb4b7255437c8ab224e91d5ed093897990'
          assert p['qualified_provider_send_guard_blob_sha']=='4b8896235d8048523d007400d0acfe85470f628c'
          assert p['openai_sdk_version']=='2.21.0'
          assert p['openai_sdk_default_max_retries']==2
          assert p['httpx_version']=='0.28.1'
          assert p['endpoint_base_url']=='https://api.z.ai/api/coding/paas/v4'
          assert p['provider_id']=='zai'
          assert p['api_mode']=='chat_completions'
          assert p['requested_model']=='glm-5.3'
          assert p['sampling_temperature']==0.8
          assert p['thinking']=={'type':'disabled'}
          assert p['json_mode']=={'type':'json_object'}
          assert p['max_agent_iterations_per_invocation']==2
          assert p['max_agent_invocations_per_logical_call']==2
          assert p['max_tokens_per_invocation']==768
          assert p['max_physical_provider_sends_per_logical_call']==36
          assert p['registered_logical_calls_if_all_pairs_complete']==21120
          assert p['max_physical_provider_sends_per_shard']==2000
          assert p['max_physical_provider_sends_campaign']==48000
          assert p['attempted_pairs_total']==384
          assert p['attempted_pairs_per_schema']==96
          assert p['minimum_analyzable_pairs_per_schema']==88
          assert p['adaptive_n_allowed'] is False
          assert p['failed_pair_replacement_allowed'] is False
          assert p['general_api_fallback_allowed'] is False
          assert p['retry_raw_first_response_content_allowed'] is False
          assert p['scientific_campaign_authorized'] is False
          assert p['provider_execution_authorized'] is False
          assert p['workflow_rerun_allowed'] is False
          assert p['same_request_stream_rerun_allowed'] is False
          assert p['registry_promotion_authorized'] is False
          assert p['acceptance_action_authorized'] is False
          assert p['historical_substrate_enabled'] is False
          lock=json.loads(Path('research/d2_vnext_s2/d2-vnext-s2-source-acquisition-cohort-lock.json').read_text())
          assert lock['cohort_pairs_sha256']=='a61a2667b088301bfedc9158662511179a4e806d4aaf679fb865e1c42ded6c94'
          assert lock['pair_count']==384
          assert lock['pairs_per_schema']==96
          assert lock['cross_schema_seed_overlap']==0
          assert all(value == 0 for value in lock['predecessor_seed_namespace_overlap'].values())
          assert lock['all_development_evaluation_overlaps_zero'] is True
          shards=json.loads(Path('research/d2_vnext_s2/D2_VNEXT_S2_SHARD_MAP.json').read_text())
          assert shards['shard_count']==24
          assert shards['pairs_per_provider_shard']==16
          assert shards['workflow_max_parallel']==4
          assert shards['logical_calls_per_complete_pair']==55
          assert shards['registered_logical_calls_if_all_pairs_complete']==21120
          assert shards['maximum_physical_provider_sends_per_logical_call']==36
          assert shards['maximum_physical_provider_sends_per_shard']==2000
          assert shards['maximum_physical_provider_sends_campaign']==48000
          assert shards['favorable_result_possible_with_missing_whole_shard'] is False
          PY
          test "$(git hash-object src/resonance_world/d2_terminal_adapter.py)" = \
            'ba16d2eb4b7255437c8ab224e91d5ed093897990'
          test "$(git hash-object src/resonance_world/provider_send_guard.py)" = \
            '4b8896235d8048523d007400d0acfe85470f628c'
      - name: Targeted tests
        run: pytest -q tests/test_d2_vnext_s2_source_acquisition.py
      - name: Ruff
        run: |
          ruff check \
            scripts/d2_vnext_s2_acquisition_core.py \
            scripts/d2_vnext_s2_hermes_client.py \
            scripts/materialize_d2_vnext_s2_source_acquisition.py \
            scripts/run_d2_vnext_s2_source_acquisition.py \
            scripts/aggregate_d2_vnext_s2_source_acquisition.py \
            scripts/evaluate_d2_vnext_s2_source_acquisition.py \
            tests/test_d2_vnext_s2_source_acquisition.py

  pinned-hermes-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Resonance World
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Checkout pinned Hermes Agent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hermes-agent-org/hermes
          ref: 036cbdfa0a3158454a0a2a7a7388cf70353326b4
          path: .hermes-src
          fetch-depth: 1
      - name: Verify supported-product source contract without credentials
        shell: bash
        run: |
          set -euo pipefail
          test -z "${ZAI_API_KEY:-}"
          test "$(git -C .hermes-src rev-parse HEAD)" = \
            '036cbdfa0a3158454a0a2a7a7388cf70353326b4'
          test "$(git -C .hermes-src rev-parse HEAD:run_agent.py)" = \
            '4c0d3be4b0c2d364c550fa663d34f6545c9e6d20'
          test "$(git -C .hermes-src rev-parse HEAD:pyproject.toml)" = \
            '95a1dfddd74bc399dd7f23f8d0143852b5689463'
          grep -Fq 'version = "0.8.0"' .hermes-src/pyproject.toml
          grep -Fq '"openai>=2.21.0,<3"' .hermes-src/pyproject.toml
          grep -Fq 'request_overrides: Dict[str, Any] = None' .hermes-src/run_agent.py
          grep -Fq 'api_kwargs.update(self.request_overrides)' .hermes-src/run_agent.py
          grep -Fq 'max_retries = 3' .hermes-src/run_agent.py
          grep -Fq 'primary_recovery_attempted = False' .hermes-src/run_agent.py
