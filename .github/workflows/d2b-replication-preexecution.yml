name: D2b Replication Preexecution Scaffold Audit

on:
  push:
    branches: ["research/d2b-fresh-replication"]
    paths:
      - ".github/workflows/d2b-replication-preexecution.yml"
      - "research/d2b/**"
      - "research/mechanisms/registry.json"
      - "scripts/materialize_d2b_replication.py"
      - "tests/test_d2b_scaffold.py"
  pull_request:
    paths:
      - ".github/workflows/d2b-replication-preexecution.yml"
      - "research/d2b/**"
      - "research/mechanisms/registry.json"
      - "scripts/materialize_d2b_replication.py"
      - "tests/test_d2b_scaffold.py"

permissions:
  contents: read

jobs:
  zero-provider-scaffold-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install research environment
        run: python -m pip install -e '.[dev]'
      - name: Assert provider credentials are unavailable
        run: test -z "${ZAI_API_KEY:-}"
      - name: Compile D2b zero-provider materializer
        run: python -m py_compile scripts/materialize_d2b_replication.py
      - name: Verify D2b scaffold contract
        run: python -m pytest -q tests/test_d2b_scaffold.py
      - name: Materialize fresh cohort and shard locks
        run: python scripts/materialize_d2b_replication.py --output-dir output/d2b-materialized
      - name: Verify materialized lock invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('output/d2b-materialized')
          summary = json.loads((root / 'materialization-summary.json').read_text())
          cohort = json.loads((root / 'd2b-replication-cohort-lock.json').read_text())
          shards = json.loads((root / 'D2B_SHARD_MAP.json').read_text())
          assert summary['pair_count'] == 360
          assert summary['shard_count'] == 18
          assert summary['all_source_destination_overlaps_zero'] is True
          assert summary['all_development_evaluation_overlaps_zero'] is True
          assert summary['c1_seed_namespace_overlap'] == 0
          assert summary['c2_seed_namespace_overlap'] == 0
          assert cohort['cohort_pairs_sha256'] == summary['cohort_pairs_sha256']
          assert len(cohort['pairs']) == 360
          assert len(shards['shards']) == 18
          assert cohort['production_historical_substrate_enabled'] is False
          assert shards['production_historical_substrate_enabled'] is False
          PY
      - name: Upload zero-provider D2b materialization
        uses: actions/upload-artifact@v4
        with:
          name: d2b-zero-provider-materialization
          path: output/d2b-materialized
          retention-days: 30
      - name: Verify provider execution remains absent
        run: |
          test ! -e research/d2b/RUN_D2B_REPLICATION
          test ! -e scripts/run_d2b_replication.py
          test ! -e scripts/aggregate_d2b_replication.py
          test ! -e scripts/evaluate_d2b_replication.py
          test ! -e .github/workflows/d2b-replication.yml
          grep -q 'prospective_zero_provider_scaffold_not_execution_candidate' research/d2b/REQUEST_PLAN_DRAFT.json
          grep -q 'Production/default Historical Substrate remains OFF' research/d2b/PLAN.md

  provider-execution-disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "D2b provider execution remains blocked until full apparatus/candidate freeze and separate authorization."
