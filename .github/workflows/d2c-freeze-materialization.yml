name: D2c Freeze Deterministic Materialization

on:
  push:
    branches: ["research/d2c-schema-generalization"]
    paths:
      - ".github/workflows/d2c-freeze-materialization.yml"

permissions:
  contents: write

jobs:
  freeze-materialization:
    if: "${{ github.event.head_commit.message == 'D2c: stage deterministic cohort-lock freeze' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify zero-provider provenance and branch ancestry
        shell: bash
        run: |
          set -euo pipefail
          test ! -e research/d2c/RUN_D2C_SCHEMA_GENERALIZATION
          test "$(git merge-base HEAD 3bb07ed2300824781da2403c729e0c24c58d2d01)" = "3bb07ed2300824781da2403c729e0c24c58d2d01"
      - name: Re-materialize exact deterministic cohort
        shell: bash
        run: |
          set -euo pipefail
          python scripts/materialize_d2c_schema_generalization.py --output-dir output/d2c-materialized
          echo "5701669d2594aaeb49ad0bc8c682b61c3cbfde6a1cb496bbf63b265a6ce26f00  output/d2c-materialized/d2c-schema-cohort-lock.json" | sha256sum -c -
          echo "2f23b0a940a6a2b4bd71aedf7d6d008939f5e89e6978284eac304e060e0009b5  output/d2c-materialized/D2C_SHARD_MAP.json" | sha256sum -c -
          echo "c5479b42632b089bc4858a23beb8c31c952d02c328bc0639c8284bd6d305ea44  output/d2c-materialized/materialization-summary.json" | sha256sum -c -
          python - <<'PY'
          import json
          from pathlib import Path
          s = json.loads(Path('output/d2c-materialized/materialization-summary.json').read_text())
          assert s['cohort_pairs_sha256'] == '559a4420a1d592d85fa350d087a8d4b945f4bf882a683c660a77cf9fdb6b9c04'
          assert s['pair_count'] == 540
          assert s['schema_pair_counts'] == {'parity_pair': 180, 'interval_pair': 180, 'pairwise_order': 180}
          assert s['cross_schema_seed_overlap'] == 0
          assert s['predecessor_seed_namespace_overlap'] == {'D2-C1': 0, 'D2-C2': 0, 'D2b': 0}
          assert s['production_historical_substrate_enabled'] is False
          PY
      - name: Commit immutable materialization lock and remove staging workflow
        shell: bash
        run: |
          set -euo pipefail
          cp output/d2c-materialized/d2c-schema-cohort-lock.json research/d2c/d2c-schema-cohort-lock.json
          cp output/d2c-materialized/D2C_SHARD_MAP.json research/d2c/D2C_SHARD_MAP.json
          cp output/d2c-materialized/materialization-summary.json research/d2c/MATERIALIZATION_SUMMARY.json
          rm .github/workflows/d2c-freeze-materialization.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/d2c/d2c-schema-cohort-lock.json research/d2c/D2C_SHARD_MAP.json research/d2c/MATERIALIZATION_SUMMARY.json .github/workflows/d2c-freeze-materialization.yml
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git commit -m "D2c: freeze deterministic fresh schema cohort"
          git push origin HEAD:research/d2c-schema-generalization
