name: H1 Pre-Outcome Apparatus Lock

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialize:
    if: github.head_ref == 'h1/structured-bounded-history-value' || github.ref_name == 'h1/structured-bounded-history-value'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Freeze exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$candidate" = "$expected"
          echo "$candidate" > h1-apparatus-revision.txt

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize frozen H1 fixtures
        run: python scripts/materialize_h1_fixtures.py --output-root output/h1

      - name: Verify frozen H1 apparatus lock
        run: |
          python scripts/verify_h1_lock.py \
            --lock research/h1/apparatus-lock.json \
            --materialization output/h1/materialization-manifest.json \
            --corpus-root output/h1 \
            --output output/h1-lock-verification.json

      - name: Verify pre-outcome separation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          plane_e = json.loads(Path('output/h1/plane_e/evidence.json').read_text())
          fixture = json.loads(Path('output/h1/meta/fixture-manifest.json').read_text())
          assert len(plane_e['units']) == 30
          assert fixture['family_counts'] == {'f0': 10, 'f1': 10, 'f2': 10}
          assert fixture['result_limit'] == 2
          public = json.dumps(plane_e, sort_keys=True)
          assert '"family"' not in public
          assert '"correct_action"' not in public
          assert '"hidden_private_sentinel"' not in public
          PY

      - name: Upload pre-outcome lock manifests only
        uses: actions/upload-artifact@v4
        with:
          name: h1-preoutcome-apparatus-manifests
          path: |
            output/h1/materialization-manifest.json
            output/h1/meta/fixture-manifest.json
            output/h1-lock-verification.json
            h1-apparatus-revision.txt
          if-no-files-found: error
          retention-days: 90
