name: H1 Structured Bounded History Value

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    if: github.head_ref == 'h1/structured-bounded-history-value' || github.ref_name == 'h1/structured-bounded-history-value'
    strategy:
      fail-fast: false
      matrix:
        replica: [primary, independent]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Freeze exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$candidate" = "$expected"
          echo "CANDIDATE_HEAD=$candidate" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install exact H1 dependencies
        run: python -m pip install -e '.[dev,contextgraph]'

      - name: Lint H1 implementation
        run: |
          ruff check \
            scripts/materialize_h1_fixtures.py \
            scripts/verify_h1_lock.py \
            scripts/h1_runtime_core.py \
            scripts/run_h1_value.py \
            scripts/freeze_h1_prekey.py \
            scripts/h1_accept_core.py \
            scripts/accept_h1_value.py

      - name: Materialize frozen H1 fixtures
        run: python scripts/materialize_h1_fixtures.py --output-root _h1_corpus

      - name: Verify frozen H1 apparatus lock
        run: |
          python scripts/verify_h1_lock.py \
            --lock research/h1/apparatus-lock.json \
            --materialization _h1_corpus/materialization-manifest.json \
            --corpus-root _h1_corpus \
            --output _h1_work/apparatus-lock-verification.json

      - name: Isolate admissible Plane E before evaluator access
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _h1_public
          cp _h1_corpus/plane_e/evidence.json _h1_public/evidence.json
          rm -rf _h1_corpus
          test ! -e _h1_public/plane_k

      - name: Run H1 treatment before evaluator key
        run: |
          python scripts/run_h1_value.py \
            --plane-e _h1_public/evidence.json \
            --output-dir _h1_work/research

      - name: Freeze participant-facing outputs before evaluator key
        run: |
          python scripts/freeze_h1_prekey.py \
            --output-dir _h1_work/research \
            --manifest _h1_work/pre-key-manifest.json

      - name: Remove pre-key workspace
        run: rm -rf _h1_public

      - name: Restore evaluator corpus only after pre-key freeze
        run: python scripts/materialize_h1_fixtures.py --output-root _h1_eval_corpus

      - name: Reverify evaluator fixture lock
        run: |
          python scripts/verify_h1_lock.py \
            --lock research/h1/apparatus-lock.json \
            --materialization _h1_eval_corpus/materialization-manifest.json \
            --corpus-root _h1_eval_corpus \
            --output _h1_work/evaluator-lock-verification.json
          cmp _h1_work/apparatus-lock-verification.json _h1_work/evaluator-lock-verification.json

      - name: Evaluate registered H1 gates
        id: accept
        continue-on-error: true
        run: |
          python scripts/accept_h1_value.py \
            --lock-verification _h1_work/apparatus-lock-verification.json \
            --corpus-root _h1_eval_corpus \
            --researcher-output _h1_work/research \
            --pre-key-manifest _h1_work/pre-key-manifest.json \
            --candidate-head "$CANDIDATE_HEAD" \
            --output-dir _h1_work/acceptance

      - name: Confirm pre-key bytes did not change
        run: |
          python scripts/freeze_h1_prekey.py \
            --output-dir _h1_work/research \
            --manifest _h1_work/pre-key-after-evaluation.json
          cmp _h1_work/pre-key-manifest.json _h1_work/pre-key-after-evaluation.json

      - name: Assemble authoritative artifact
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _h1_authoritative
          cp research/h1/apparatus-lock.json _h1_authoritative/
          cp _h1_work/apparatus-lock-verification.json _h1_authoritative/
          cp _h1_work/pre-key-manifest.json _h1_authoritative/
          cp _h1_work/research/*.json _h1_authoritative/
          if [ -d _h1_work/acceptance ]; then
            cp _h1_work/acceptance/*.json _h1_authoritative/
          fi

      - name: Upload authoritative reproduction
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h1-authoritative-${{ matrix.replica }}
          path: _h1_authoritative
          if-no-files-found: error
          retention-days: 90

      - name: Enforce registered outcome
        if: steps.accept.outcome == 'failure'
        run: exit 1

  compare-reproductions:
    if: ${{ always() && (github.head_ref == 'h1/structured-bounded-history-value' || github.ref_name == 'h1/structured-bounded-history-value') }}
    needs: reproduce
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download both exact-head reproductions
        uses: actions/download-artifact@v4
        with:
          pattern: h1-authoritative-*
          path: compare

      - name: Byte-compare every authoritative product
        shell: bash
        run: |
          set -euo pipefail
          test -d compare/h1-authoritative-primary
          test -d compare/h1-authoritative-independent
          diff -ru \
            compare/h1-authoritative-primary \
            compare/h1-authoritative-independent
