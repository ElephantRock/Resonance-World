name: H4 Frozen Confirmatory Evaluation

on:
  push:
    branches: ["experiment/h4-stochastic-history-use"]
    paths:
      - ".github/workflows/h4-frozen-evaluation.yml"

permissions:
  actions: read
  contents: read

jobs:
  evaluate-frozen-live-output:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: 42bc88e59707e2013cb8d2923fae0c0c2b0df56e
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install exact candidate with ContextGraph release
        run: python -m pip install -e '.[dev,contextgraph]'
      - uses: actions/download-artifact@v4
        with:
          name: h4-plane-e
          path: input/plane-e
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31761562214
      - uses: actions/download-artifact@v4
        with:
          name: h4-plane-k
          path: input/plane-k
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31761562214
      - uses: actions/download-artifact@v4
        with:
          name: h4-fixture-meta
          path: input/meta
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31761562214
      - uses: actions/download-artifact@v4
        with:
          name: h4-live-output
          path: input/live
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31761562214
      - name: Verify authoritative frozen live bytes
        run: |
          test "$(sha256sum input/live/h4-live-output.json | cut -d' ' -f1)" = "4d1c2d2e0184ed8bf61fdcf4edabf904c1cfaf3403ae82bde3954ff7b4e369fc"
          test "$(sha256sum input/plane-e/h4-fixtures/plane_e/evidence.json | cut -d' ' -f1)" = "e2c0a4735c38abff803d2eab2ab872ed296ca01d48165a28f6f5541a2b28191b"
          test "$(sha256sum input/plane-k/evaluator.json | cut -d' ' -f1)" = "4800f93d01fd0a88abbe62140aa6e73160f0102720d7c946ac0d4e4d3d2e82f2"
          test "$(sha256sum input/meta/fixture-manifest.json | cut -d' ' -f1)" = "9758f65f18bfd63de98b11a8d7b6334bdd6b66f196e904668518bb9571fb69a2"
      - name: Evaluate frozen provider output twice
        run: |
          mkdir -p output/eval-a output/eval-b
          set +e
          python scripts/accept_h4_stochastic.py \
            --plane-e input/plane-e/h4-fixtures/plane_e/evidence.json \
            --plane-k input/plane-k/evaluator.json \
            --fixture-manifest input/meta/fixture-manifest.json \
            --live-output input/live/h4-live-output.json \
            --output-dir output/eval-a \
            --candidate-head "42bc88e59707e2013cb8d2923fae0c0c2b0df56e" > output/eval-a/evaluator.log
          status_a=$?
          python scripts/accept_h4_stochastic.py \
            --plane-e input/plane-e/h4-fixtures/plane_e/evidence.json \
            --plane-k input/plane-k/evaluator.json \
            --fixture-manifest input/meta/fixture-manifest.json \
            --live-output input/live/h4-live-output.json \
            --output-dir output/eval-b \
            --candidate-head "42bc88e59707e2013cb8d2923fae0c0c2b0df56e" > output/eval-b/evaluator.log
          status_b=$?
          set -e
          printf '%s\n' "$status_a" > output/eval-a/evaluator-exit-status.txt
          printf '%s\n' "$status_b" > output/eval-a/second-evaluator-exit-status.txt
          cmp output/eval-a/result.json output/eval-b/result.json
          cmp output/eval-a/manifest.json output/eval-b/manifest.json
          cmp output/eval-a/audit.json output/eval-b/audit.json
          test "$status_a" = "$status_b"
      - uses: actions/upload-artifact@v4
        with:
          name: h4-confirmatory-evaluation
          path: output/eval-a
          if-no-files-found: error
          retention-days: 90
      - name: Enforce registered scientific classification
        run: |
          cat output/eval-a/evaluator.log
          python - <<'PY'
          import json
          result = json.load(open('output/eval-a/result.json'))
          if result['classification'] != 'historical_substrate_stochastic_successor_reasoning_pass':
              raise SystemExit(3)
          if not all(result['gates'].values()):
              raise SystemExit(4)
          PY
