name: O1 ContextGraph Observatory Reconstruction Validity

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  O1_BRANCH: o1/observatory-reconstruction-validity

jobs:
  o1-reproduction:
    if: >-
      github.head_ref == 'o1/observatory-reconstruction-validity' ||
      github.ref_name == 'o1/observatory-reconstruction-validity'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        reproduction: [primary, independent]
    steps:
      - name: Checkout exact O1 candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_HEAD }}
          fetch-depth: 0

      - name: Verify exact candidate head
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_HEAD"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install World and immutable ContextGraph release
        run: python -m pip install -e '.[dev,contextgraph]'

      - name: Lint O1 apparatus
        run: |
          ruff check src/resonance_world/o1_reconstruction.py
          ruff check scripts/materialize_o1_benchmarks.py
          ruff check scripts/run_o1_reconstruction.py
          ruff check scripts/accept_o1_reconstruction.py
          ruff check scripts/verify_o1_fixture_lock.py
          ruff check tests/test_o1_reconstruction.py

      - name: Test O1 reconstruction apparatus
        run: |
          pytest -q \
            tests/test_o1_reconstruction.py \
            tests/test_observatory.py \
            tests/test_context_graph_runtime.py

      - name: Download frozen historical benchmark artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p historical
          gh api --method GET \
            "/repos/${{ github.repository }}/actions/artifacts/9158432521/zip" \
            > historical/phase4c.zip
          gh api --method GET \
            "/repos/${{ github.repository }}/actions/artifacts/9163662793/zip" \
            > historical/phase5c.zip
          gh api --method GET \
            "/repos/${{ github.repository }}/actions/artifacts/9163101495/zip" \
            > historical/phase5c-source.zip
          gh api --method GET \
            "/repos/${{ github.repository }}/actions/artifacts/9163835188/zip" \
            > historical/w9.zip

      - name: Materialize and verify frozen benchmark planes
        run: |
          mkdir -p output/o1
          python scripts/materialize_o1_benchmarks.py \
            --phase4c-artifact historical/phase4c.zip \
            --phase5c-artifact historical/phase5c.zip \
            --phase5c-source-artifact historical/phase5c-source.zip \
            --w9-artifact historical/w9.zip \
            --output-root output/o1/benchmarks
          python scripts/verify_o1_fixture_lock.py \
            --benchmark-root output/o1/benchmarks \
            --provenance research/o1/provenance.json

      - name: Replay accepted O0 relationship benchmark without observer
        run: |
          python scripts/run_o0_observatory.py \
            --mode baseline \
            --trace-output output/o1/relationship-baseline-trace.json

      - name: Replay accepted O0 relationship benchmark with Observatory
        run: |
          python scripts/run_o0_observatory.py \
            --mode observatory \
            --trace-output output/o1/relationship-observatory-trace.json \
            --evidence-output output/o1/relationship-contextgraph-evidence.json

      - name: Enforce Plane-K and raw-source absence during reconstruction
        shell: bash
        run: |
          set -euo pipefail
          rm -rf output/o1/benchmarks/plane_k historical
          test ! -e output/o1/benchmarks/plane_k
          test ! -e historical

      - name: Reconstruct from Plane E only
        run: |
          python scripts/run_o1_reconstruction.py \
            --relationship-evidence output/o1/relationship-contextgraph-evidence.json \
            --plane-e-dir output/o1/benchmarks/plane_e \
            --output-dir output/o1

      - name: Freeze reconstruction before evaluator key is available
        shell: bash
        run: |
          set -euo pipefail
          authoritative=(
            contextgraph-evidence.json
            event-ledger.json
            entity-ledger.json
            relationship-ledger.json
            authority-ledger.json
            organization-lineage.json
            capability-evidence.json
            source-sustainability-evidence.json
          )
          for file in "${authoritative[@]}"; do
            test -f "output/o1/$file"
            sha256sum "output/o1/$file"
          done > output/o1/reconstruction-pre-key.sha256

      - name: Download evaluator sources only after reconstruction freeze
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p historical-evaluator
          gh api --method GET \
            "/repos/${{ github.repository }}/actions/artifacts/9158432521/zip" \
            > historical-evaluator/phase4c.zip
          gh api --method GET \
            "/repos/${{ github.repository }}/actions/artifacts/9163662793/zip" \
            > historical-evaluator/phase5c.zip
          gh api --method GET \
            "/repos/${{ github.repository }}/actions/artifacts/9163101495/zip" \
            > historical-evaluator/phase5c-source.zip
          gh api --method GET \
            "/repos/${{ github.repository }}/actions/artifacts/9163835188/zip" \
            > historical-evaluator/w9.zip

      - name: Restore and verify evaluator-only Plane K
        run: |
          python scripts/materialize_o1_benchmarks.py \
            --phase4c-artifact historical-evaluator/phase4c.zip \
            --phase5c-artifact historical-evaluator/phase5c.zip \
            --phase5c-source-artifact historical-evaluator/phase5c-source.zip \
            --w9-artifact historical-evaluator/w9.zip \
            --output-root output/o1/evaluator-benchmarks
          python scripts/verify_o1_fixture_lock.py \
            --benchmark-root output/o1/evaluator-benchmarks \
            --provenance research/o1/provenance.json

      - name: Evaluate preregistered O1 gates
        run: |
          python scripts/accept_o1_reconstruction.py \
            --relationship-baseline output/o1/relationship-baseline-trace.json \
            --relationship-observatory output/o1/relationship-observatory-trace.json \
            --relationship-evidence output/o1/relationship-contextgraph-evidence.json \
            --plane-e-dir output/o1/benchmarks/plane_e \
            --plane-k-dir output/o1/evaluator-benchmarks/plane_k \
            --output-dir output/o1 \
            --candidate-head "$CANDIDATE_HEAD"

      - name: Prove reconstruction bytes did not change after Plane K appeared
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c output/o1/reconstruction-pre-key.sha256

      - name: Remove benchmark inputs and evaluator sources from authoritative artifact
        if: always()
        shell: bash
        run: |
          rm -rf \
            output/o1/benchmarks \
            output/o1/evaluator-benchmarks \
            historical-evaluator

      - name: Upload O1 authoritative artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: o1-reconstruction-${{ matrix.reproduction }}
          path: output/o1
          if-no-files-found: error
          retention-days: 90

  compare-reproductions:
    if: >-
      always() &&
      (github.head_ref == 'o1/observatory-reconstruction-validity' ||
      github.ref_name == 'o1/observatory-reconstruction-validity')
    needs: o1-reproduction
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require both isolated reproductions to pass
        run: test '${{ needs.o1-reproduction.result }}' = 'success'

      - name: Download primary reproduction
        uses: actions/download-artifact@v4
        with:
          name: o1-reconstruction-primary
          path: artifacts/primary

      - name: Download independent reproduction
        uses: actions/download-artifact@v4
        with:
          name: o1-reconstruction-independent
          path: artifacts/independent

      - name: Enforce byte-identical authoritative O1 outputs
        shell: bash
        run: |
          set -euo pipefail
          authoritative=(
            relationship-baseline-trace.json
            relationship-observatory-trace.json
            relationship-contextgraph-evidence.json
            contextgraph-evidence.json
            event-ledger.json
            entity-ledger.json
            relationship-ledger.json
            authority-ledger.json
            organization-lineage.json
            capability-evidence.json
            source-sustainability-evidence.json
            reconstruction-pre-key.sha256
            o1-result.json
            o1-manifest.json
          )
          for file in "${authoritative[@]}"; do
            test -f "artifacts/primary/$file"
            test -f "artifacts/independent/$file"
            cmp --silent "artifacts/primary/$file" "artifacts/independent/$file" || {
              echo "O1 reproduction mismatch: $file" >&2
              exit 1
            }
          done
