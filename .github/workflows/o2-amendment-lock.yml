name: O2 D2 Amendment Apparatus Lock

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialize-amended-contract:
    if: github.head_ref == 'o2/longitudinal-scientific-utility' || github.ref_name == 'o2/longitudinal-scientific-utility'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Freeze candidate identity
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$candidate" = "$expected"
          echo "CANDIDATE_HEAD=$candidate" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Lint amendment apparatus
        run: |
          python -m pip install ruff
          ruff check \
            scripts/materialize_o2_amended_benchmarks.py \
            scripts/amend_o2_researcher_outputs.py \
            src/resonance_world/o2_accept_support.py

      - name: Materialize amended corpus
        run: |
          python scripts/materialize_o2_amended_benchmarks.py \
            --output-root output/o2-amended \
            --original-lock research/o2/apparatus-lock.json

      - name: Prove unchanged scientific histories
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          old = json.loads(Path('research/o2/apparatus-lock.json').read_text())
          new = json.loads(Path('output/o2-amended/materialization-manifest.json').read_text())
          for name in ('plane_e', 'r0', 'r1'):
              assert new['roots'][name]['file_count'] == old['roots'][name]['file_count']
              assert new['roots'][name]['manifest_root_sha256'] == old['roots'][name]['manifest_root_sha256']
          assert new['amendment_issue'] == 126
          assert new['amendment_query_id'] == 'contribution_vector_by_interval'
          PY

      - name: Record exact workflow revision
        run: printf '%s\n' "$CANDIDATE_HEAD" > output/o2-amended/amendment-workflow-revision.txt

      - name: Upload amended lock manifests only
        uses: actions/upload-artifact@v4
        with:
          name: o2-d2-amendment-lock-manifests
          path: |
            output/o2-amended/materialization-manifest.json
            output/o2-amended/meta/*.json
            output/o2-amended/amendment-workflow-revision.txt
          if-no-files-found: error
          retention-days: 90
