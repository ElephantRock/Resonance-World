name: PIANO Society Intention Stress Phase 2C

on:
  push:
    branches:
      - experiment/piano-society-intention-stress
    paths:
      - "experiments/piano_society/phase2c*"
      - "experiments/piano_society/PHASE2C_PREREGISTRATION.md"
      - "tests/test_piano_society_phase2c.py"
      - ".github/workflows/piano-society-intention-stress.yml"
  pull_request:
    paths:
      - "experiments/piano_society/phase2c*"
      - "experiments/piano_society/PHASE2C_PREREGISTRATION.md"
      - "tests/test_piano_society_phase2c.py"
      - ".github/workflows/piano-society-intention-stress.yml"

permissions:
  contents: read

env:
  PIANO_FIELD_SHA: f9ce80dd51cc3bd3adf9b810972f832263b3fe87

jobs:
  validate-intention-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Resonance Field
        run: |
          git clone https://github.com/ElephantRock/Resonance-Field.git ../field
          git -C ../field checkout "$PIANO_FIELD_SHA"
          test "$(git -C ../field rev-parse HEAD)" = "$PIANO_FIELD_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install World and pinned Field
        run: python -m pip install -e '../field[dev]' -e '.[dev]'
      - name: Lint and test Phase 2C contract
        run: |
          ruff check experiments/piano_society/phase2c.py experiments/piano_society/phase2c_campaign.py tests/test_piano_society_phase2c.py
          pytest -q tests/test_piano_society_phase2c.py
      - name: Validate exact scientific lock
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from experiments.piano_society.phase2c import validate_config

          config = json.loads(Path('experiments/piano_society/phase2c_config.json').read_text())
          normalized = validate_config(config)
          assert config['campaign_locked'] is True
          assert config['preregistration_revision'] == 'glm5.2-intention-stress-v1'
          assert config['field_revision'] == 'f9ce80dd51cc3bd3adf9b810972f832263b3fe87'
          assert config['required_model_snapshot'] == 'glm-5.2'
          assert config['max_output_tokens_per_call'] == 128
          assert config['action_vocabulary'] == ['OBSERVE', 'REQUEST_TOOL', 'SLEEP']
          assert config['arms'] == ['baseline', 'broadcast']
          assert config['required_pairs'] == 36
          assert normalized['required_pairs'] == 36
          prerequisite = config['acknowledgement_prerequisite']
          assert prerequisite['validated'] is True
          assert prerequisite['world_revision'] == '9aed50abfc2d3500ac6b0fa082d03bb0a2c64606'
          assert prerequisite['artifact_digest'] == 'sha256:6fdc5d0ddf1aa693c81801b78aae4f71f4807215d27960d19bbc9d2c0b62a7e2'
          backend = config['model_backend']
          assert backend['thinking'] == 'disabled'
          assert backend['do_sample'] is False
          assert backend['temperature'] == 0.0
          assert backend['timeout_seconds'] == 60.0
          assert backend['max_attempts'] == 4
          assert backend['max_workers'] == 6
          PY
      - name: Emit locked preregistration summary
        run: |
          mkdir -p output/piano_society/phase2c-prereg
          python -m experiments.piano_society.phase2c \
            --config experiments/piano_society/phase2c_config.json \
            > output/piano_society/phase2c-prereg/preregistration.json
          cp experiments/piano_society/phase2c_config.json output/piano_society/phase2c-prereg/
          cp experiments/piano_society/PHASE2C_PREREGISTRATION.md output/piano_society/phase2c-prereg/
      - uses: actions/upload-artifact@v4
        with:
          name: piano-society-phase2c-preregistration
          path: output/piano_society/phase2c-prereg
          if-no-files-found: error
          retention-days: 30

  intention-campaign:
    needs: validate-intention-lock
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Require campaign credential
        run: |
          if [ -z "$ZAI_API_KEY" ]; then
            echo "::error::ZAI_API_KEY is required for Phase 2C execution"
            exit 2
          fi
      - name: Checkout pinned Resonance Field
        run: |
          git clone https://github.com/ElephantRock/Resonance-Field.git ../field
          git -C ../field checkout "$PIANO_FIELD_SHA"
          test "$(git -C ../field rev-parse HEAD)" = "$PIANO_FIELD_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen experiment revisions
        run: python -m pip install -e '../field[dev]' -e '.[dev]'
      - name: Execute 36-pair intention-broadcast stress campaign
        run: |
          python -m experiments.piano_society.phase2c_campaign \
            --config experiments/piano_society/phase2c_config.json \
            --output-dir output/piano_society/phase2c-live
      - uses: actions/upload-artifact@v4
        with:
          name: piano-society-phase2c-intention-live
          path: output/piano_society/phase2c-live
          if-no-files-found: error
          retention-days: 90
