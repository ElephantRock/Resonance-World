name: PIANO Society Phase 4 Authority v2

on:
  push:
    branches:
      - experiment/piano-society-phase4-authority-v2
    paths:
      - experiments/piano_society/authority_ledger.py
      - experiments/piano_society/phase4_authority.py
      - experiments/piano_society/phase4_authority_v2.py
      - experiments/piano_society/phase4_authority_v2_campaign.py
      - experiments/piano_society/phase4_authority_config.json
      - experiments/piano_society/PHASE4_AUTHORITY_V2_PREREGISTRATION.md
      - tests/test_piano_society_phase4_authority_v2.py
      - .github/workflows/piano-society-phase4-authority-v2.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PIANO_FIELD_SHA: e877bf03dbf6681ce7cbd98d984e73c032e911aa

jobs:
  validate-authority-v2-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Resonance Field v2
        run: |
          git clone https://github.com/ElephantRock/Resonance-Field.git ../field
          git -C ../field checkout "$PIANO_FIELD_SHA"
          test "$(git -C ../field rev-parse HEAD)" = "$PIANO_FIELD_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install World and pinned Field
        run: python -m pip install -e '../field[dev]' -e '.[dev]'
      - name: Lint and test Phase 4 v2 contract
        run: |
          ruff check \
            experiments/piano_society/phase4_authority_v2.py \
            experiments/piano_society/phase4_authority_v2_campaign.py \
            tests/test_piano_society_phase4_authority_v2.py
          pytest -q tests/test_piano_society_phase4_authority_v2.py
      - name: Validate scientific equivalence and transport amendment
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from experiments.piano_society.phase4_authority_v2 import validate_config

          config = json.loads(
              Path('experiments/piano_society/phase4_authority_config.json').read_text()
          )
          value = validate_config(config)
          assert config['campaign_locked'] is True
          assert value['field_revision'] == 'e877bf03dbf6681ce7cbd98d984e73c032e911aa'
          assert value['required_model_snapshot'] == 'glm-5.2'
          assert len(value['roles']) == 60
          assert value['scientific_projection_digest'] == (
              '8b197ce8a3a57260e7215974be66be8fb7558465336aa2420838751c9804fd24'
          )
          assert config['transport_amendment']['v1_complete_scientific_artifacts'] == 0
          assert config['transport_amendment']['scientific_user_prompts_unchanged'] is True
          assert config['model_backend']['max_attempts'] == 12
          assert config['model_backend']['contract_retry_prompt_hardening'] is True
          assert config['model_backend']['unique_request_id_per_attempt'] is True
          PY
      - name: Emit locked Phase 4 v2 preregistration
        run: |
          mkdir -p output/piano_society/phase4-v2-preregistration
          python -m experiments.piano_society.phase4_authority_v2 \
            --config experiments/piano_society/phase4_authority_config.json \
            > output/piano_society/phase4-v2-preregistration/lock.json
          cp experiments/piano_society/PHASE4_AUTHORITY_V2_PREREGISTRATION.md \
            output/piano_society/phase4-v2-preregistration/
      - uses: actions/upload-artifact@v4
        with:
          name: piano-society-phase4-authority-v2-preregistration
          path: output/piano_society/phase4-v2-preregistration
          if-no-files-found: error

  authority-v2-campaign:
    needs: validate-authority-v2-lock
    runs-on: ubuntu-latest
    env:
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Require campaign credential
        run: |
          if [ -z "$ZAI_API_KEY" ]; then
            echo "::error::ZAI_API_KEY is required for Phase 4 v2 execution"
            exit 2
          fi
      - name: Checkout pinned Resonance Field v2
        run: |
          git clone https://github.com/ElephantRock/Resonance-Field.git ../field
          git -C ../field checkout "$PIANO_FIELD_SHA"
          test "$(git -C ../field rev-parse HEAD)" = "$PIANO_FIELD_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen experiment revisions
        run: python -m pip install -e '../field[dev]' -e '.[dev]'
      - name: Execute six ten-agent authority cases with v2 transport
        run: |
          python -m experiments.piano_society.phase4_authority_v2_campaign \
            --config experiments/piano_society/phase4_authority_config.json \
            --output-dir output/piano_society/phase4-authority-v2-live
      - uses: actions/upload-artifact@v4
        with:
          name: piano-society-phase4-authority-v2-live
          path: output/piano_society/phase4-authority-v2-live
          if-no-files-found: error
