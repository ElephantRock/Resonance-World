name: PIANO Society Phase 4 Authority

on:
  push:
    branches:
      - experiment/piano-society-phase4-authority
    paths:
      - experiments/piano_society/authority_ledger.py
      - experiments/piano_society/phase4_authority.py
      - experiments/piano_society/phase4_authority_campaign.py
      - experiments/piano_society/phase4_authority_config.json
      - experiments/piano_society/PHASE4_AUTHORITY_PREREGISTRATION.md
      - tests/test_piano_society_phase4_authority.py
      - .github/workflows/piano-society-phase4-authority.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PIANO_FIELD_SHA: fe416fe5d04d9db8e43bce7f923f522d7164cc7c

jobs:
  validate-authority-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Resonance Field
        run: |
          git clone https://github.com/ElephantRock/Resonance-Field.git ../field
          git -C ../field checkout "$PIANO_FIELD_SHA"
          test "$(git -C ../field rev-parse HEAD)" = "$PIANO_FIELD_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install World and pinned Field
        run: python -m pip install -e '../field[dev]' -e '.[dev]'
      - name: Lint and test Phase 4 contract
        run: |
          ruff check \
            experiments/piano_society/authority_ledger.py \
            experiments/piano_society/phase4_authority.py \
            experiments/piano_society/phase4_authority_campaign.py \
            tests/test_piano_society_phase4_authority.py
          pytest -q tests/test_piano_society_phase4_authority.py
      - name: Validate exact scientific lock
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          from experiments.piano_society.phase4_authority import validate_config

          path = Path('experiments/piano_society/phase4_authority_config.json')
          config = json.loads(path.read_text())
          value = validate_config(config)
          roles = value['roles']
          assert config['campaign_locked'] is True
          assert value['field_revision'] == 'fe416fe5d04d9db8e43bce7f923f522d7164cc7c'
          assert value['required_model_snapshot'] == 'glm-5.2'
          assert len(roles) == 60
          assert Counter(role['spoof_action'] for role in roles) == Counter(
              {'OBSERVE': 20, 'REQUEST_TOOL': 20, 'SLEEP': 20}
          )
          assert Counter(role['notice_order'] for role in roles) == Counter(
              {'legitimate_first': 30, 'spoof_first': 30}
          )
          assert config['validated_prerequisites']['phase3_v2_artifact_digest'] == (
              'sha256:8eb56824df7b5ccce88204cb34f4212fbdcad6025e011208183059388d049498'
          )
          PY
      - name: Emit locked preregistration summary
        run: |
          mkdir -p output/piano_society/phase4-preregistration
          python -m experiments.piano_society.phase4_authority \
            --config experiments/piano_society/phase4_authority_config.json \
            > output/piano_society/phase4-preregistration/lock.json
          cp experiments/piano_society/PHASE4_AUTHORITY_PREREGISTRATION.md \
            output/piano_society/phase4-preregistration/
      - uses: actions/upload-artifact@v4
        with:
          name: piano-society-phase4-authority-preregistration
          path: output/piano_society/phase4-preregistration
          if-no-files-found: error

  authority-campaign:
    needs: validate-authority-lock
    runs-on: ubuntu-latest
    env:
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Require campaign credential
        run: |
          if [ -z "$ZAI_API_KEY" ]; then
            echo "::error::ZAI_API_KEY is required for Phase 4 execution"
            exit 2
          fi
      - name: Checkout pinned Resonance Field
        run: |
          git clone https://github.com/ElephantRock/Resonance-Field.git ../field
          git -C ../field checkout "$PIANO_FIELD_SHA"
          test "$(git -C ../field rev-parse HEAD)" = "$PIANO_FIELD_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen experiment revisions
        run: python -m pip install -e '../field[dev]' -e '.[dev]'
      - name: Execute six ten-agent authority cases
        run: |
          python -m experiments.piano_society.phase4_authority_campaign \
            --config experiments/piano_society/phase4_authority_config.json \
            --output-dir output/piano_society/phase4-authority-live
      - uses: actions/upload-artifact@v4
        with:
          name: piano-society-phase4-authority-live
          path: output/piano_society/phase4-authority-live
          if-no-files-found: error
