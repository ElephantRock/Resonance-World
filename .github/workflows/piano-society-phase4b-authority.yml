name: PIANO Society Phase 4B Authority

on:
  push:
    branches:
      - experiment/piano-society-phase4b-authority-binary
    paths:
      - experiments/piano_society/authority_ledger.py
      - experiments/piano_society/phase4b_authority.py
      - experiments/piano_society/phase4b_authority_campaign.py
      - experiments/piano_society/phase4b_authority_config.json
      - experiments/piano_society/PHASE4B_AUTHORITY_PREREGISTRATION.md
      - tests/test_piano_society_phase4b_authority.py
      - .github/workflows/piano-society-phase4b-authority.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PIANO_FIELD_SHA: e877bf03dbf6681ce7cbd98d984e73c032e911aa

jobs:
  validate-authority-binary-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Resonance Field
        run: |
          git clone https://github.com/ElephantRock/Resonance-Field.git ../field
          git -C ../field checkout "$PIANO_FIELD_SHA"
          test "$(git -C ../field rev-parse HEAD)" = "$PIANO_FIELD_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install World and pinned Field
        run: python -m pip install -e '../field[dev]' -e '.[dev]'
      - name: Lint and test Phase 4B contract
        run: |
          ruff check --ignore E501 \
            experiments/piano_society/phase4b_authority.py \
            experiments/piano_society/phase4b_authority_campaign.py \
            tests/test_piano_society_phase4b_authority.py
          pytest -q tests/test_piano_society_phase4b_authority.py
      - name: Validate fresh binary scientific lock
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          from experiments.piano_society.phase4b_authority import validate_config

          config = json.loads(
              Path('experiments/piano_society/phase4b_authority_config.json').read_text()
          )
          value = validate_config(config)
          roles = value['roles']
          assert config['campaign_locked'] is True
          assert value['field_revision'] == 'e877bf03dbf6681ce7cbd98d984e73c032e911aa'
          assert len(roles) == 60
          assert all(len(role['allowed_actions']) == 2 for role in roles)
          assert Counter(role['expected_action'] for role in roles) == Counter(
              {'OBSERVE': 20, 'REQUEST_TOOL': 20, 'SLEEP': 20}
          )
          assert Counter(role['spoof_action'] for role in roles) == Counter(
              {'OBSERVE': 20, 'REQUEST_TOOL': 20, 'SLEEP': 20}
          )
          assert Counter(role['notice_order'] for role in roles) == Counter(
              {'legitimate_first': 30, 'spoof_first': 30}
          )
          assert config['validated_prerequisites']['phase4_v2_artifact_digest'] == (
              'sha256:49e8d3dce67d8319501480fa0b91bff7a3eae6ce25dd61c3fe6f436b0983f08a'
          )
          assert config['validated_prerequisites']['phase4_v2_advance_to_phase5'] is False
          PY
      - name: Emit locked Phase 4B preregistration
        run: |
          mkdir -p output/piano_society/phase4b-preregistration
          python -m experiments.piano_society.phase4b_authority \
            --config experiments/piano_society/phase4b_authority_config.json \
            > output/piano_society/phase4b-preregistration/lock.json
          cp experiments/piano_society/PHASE4B_AUTHORITY_PREREGISTRATION.md \
            output/piano_society/phase4b-preregistration/
      - uses: actions/upload-artifact@v4
        with:
          name: piano-society-phase4b-authority-preregistration
          path: output/piano_society/phase4b-preregistration
          if-no-files-found: error

  authority-binary-campaign:
    needs: validate-authority-binary-lock
    runs-on: ubuntu-latest
    env:
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Require campaign credential
        run: |
          if [ -z "$ZAI_API_KEY" ]; then
            echo "::error::ZAI_API_KEY is required for Phase 4B execution"
            exit 2
          fi
      - name: Checkout pinned Resonance Field
        run: |
          git clone https://github.com/ElephantRock/Resonance-Field.git ../field
          git -C ../field checkout "$PIANO_FIELD_SHA"
          test "$(git -C ../field rev-parse HEAD)" = "$PIANO_FIELD_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen experiment revisions
        run: python -m pip install -e '../field[dev]' -e '.[dev]'
      - name: Execute six fresh ten-agent binary authority cases
        run: |
          python -m experiments.piano_society.phase4b_authority_campaign \
            --config experiments/piano_society/phase4b_authority_config.json \
            --output-dir output/piano_society/phase4b-authority-live
      - uses: actions/upload-artifact@v4
        with:
          name: piano-society-phase4b-authority-live
          path: output/piano_society/phase4b-authority-live
          if-no-files-found: error
