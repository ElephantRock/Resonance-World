name: PIANO Society Phase 4C Authority

on:
  push:
    branches:
      - experiment/piano-society-phase4c-authority-opaque
    paths:
      - experiments/piano_society/authority_ledger.py
      - experiments/piano_society/phase4c_authority.py
      - experiments/piano_society/phase4c_authority_campaign.py
      - experiments/piano_society/phase4c_authority_config.json
      - experiments/piano_society/PHASE4C_AUTHORITY_PREREGISTRATION.md
      - tests/test_piano_society_phase4c_authority.py
      - .github/workflows/piano-society-phase4c-authority.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PIANO_FIELD_SHA: e877bf03dbf6681ce7cbd98d984e73c032e911aa

jobs:
  validate-opaque-authority-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Resonance Field
        run: |
          git clone https://github.com/ElephantRock/Resonance-Field.git ../field
          git -C ../field checkout "$PIANO_FIELD_SHA"
          test "$(git -C ../field rev-parse HEAD)" = "$PIANO_FIELD_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install World and pinned Field
        run: python -m pip install -e '../field[dev]' -e '.[dev]'
      - name: Lint and test Phase 4C contract
        run: |
          ruff check --ignore E501 \
            experiments/piano_society/phase4c_authority.py \
            experiments/piano_society/phase4c_authority_campaign.py \
            tests/test_piano_society_phase4c_authority.py
          pytest -q tests/test_piano_society_phase4c_authority.py
      - name: Validate opaque scientific lock
        run: |
          python - <<'PY'
          import json
          import re
          from collections import Counter
          from pathlib import Path
          from experiments.piano_society.phase4c_authority import validate_config

          config = json.loads(
              Path('experiments/piano_society/phase4c_authority_config.json').read_text()
          )
          value = validate_config(config)
          roles = value['roles']
          assert config['campaign_locked'] is True
          assert value['field_revision'] == 'e877bf03dbf6681ce7cbd98d984e73c032e911aa'
          assert len(roles) == 60
          ids = [
              role[key]
              for role in roles
              for key in ('legitimate_notice_id', 'spoof_notice_id')
          ]
          assert len(ids) == len(set(ids)) == 120
          assert all(re.fullmatch(r'notice-[0-9a-f]{24}', notice_id) for notice_id in ids)
          forbidden = config['institutional_authority']['forbidden_model_visible_id_tokens']
          assert all(all(token not in notice_id.lower() for token in forbidden) for notice_id in ids)
          assert Counter(role['notice_order'] for role in roles) == Counter(
              {'legitimate_first': 30, 'spoof_first': 30}
          )
          assert Counter(role['legitimate_slot'] for role in roles) == Counter(
              {'slot_a': 30, 'slot_b': 30}
          )
          assert Counter(role['allowed_action_order'] for role in roles) == Counter(
              {'expected_first': 30, 'spoof_first': 30}
          )
          pairs = Counter((role['expected_action'], role['spoof_action']) for role in roles)
          assert len(pairs) == 6 and set(pairs.values()) == {10}
          correction = config['methodological_correction']
          assert correction['prior_runs_invalidated'] is True
          assert correction['phase5_remains_blocked'] is True
          assert correction['phase4_v2_artifact_digest'] == (
              'sha256:49e8d3dce67d8319501480fa0b91bff7a3eae6ce25dd61c3fe6f436b0983f08a'
          )
          assert correction['phase4b_artifact_digest'] == (
              'sha256:eb427f655b5fe0d13d3af57c044f38efc94c26a5769f08160d484af26f9bcc07'
          )
          PY
      - name: Emit locked Phase 4C preregistration
        run: |
          mkdir -p output/piano_society/phase4c-preregistration
          python -m experiments.piano_society.phase4c_authority \
            --config experiments/piano_society/phase4c_authority_config.json \
            > output/piano_society/phase4c-preregistration/lock.json
          cp experiments/piano_society/PHASE4C_AUTHORITY_PREREGISTRATION.md \
            output/piano_society/phase4c-preregistration/
      - uses: actions/upload-artifact@v4
        with:
          name: piano-society-phase4c-authority-preregistration
          path: output/piano_society/phase4c-preregistration
          if-no-files-found: error

  opaque-authority-campaign:
    needs: validate-opaque-authority-lock
    runs-on: ubuntu-latest
    env:
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Require campaign credential
        run: |
          if [ -z "$ZAI_API_KEY" ]; then
            echo "::error::ZAI_API_KEY is required for Phase 4C execution"
            exit 2
          fi
      - name: Checkout pinned Resonance Field
        run: |
          git clone https://github.com/ElephantRock/Resonance-Field.git ../field
          git -C ../field checkout "$PIANO_FIELD_SHA"
          test "$(git -C ../field rev-parse HEAD)" = "$PIANO_FIELD_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen experiment revisions
        run: python -m pip install -e '../field[dev]' -e '.[dev]'
      - name: Execute six fresh ten-agent opaque authority cases
        run: |
          python -m experiments.piano_society.phase4c_authority_campaign \
            --config experiments/piano_society/phase4c_authority_config.json \
            --output-dir output/piano_society/phase4c-authority-live
      - uses: actions/upload-artifact@v4
        with:
          name: piano-society-phase4c-authority-live
          path: output/piano_society/phase4c-authority-live
          if-no-files-found: error
