name: PIANO Society Phase 5B v2 Calibration

on:
  push:
    branches:
      - experiment/piano-society-phase5b-transferable-memory
    paths:
      - experiments/piano_society/phase5b_search_config_v2.json
      - experiments/piano_society/phase5b_search.py
      - experiments/piano_society/phase5b_transfer_memory.py
      - experiments/piano_society/phase5b_controller.py
      - tests/test_piano_society_phase5b.py
      - .github/workflows/piano-society-phase5b-v2-calibration.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  FIELD_SHA: e877bf03dbf6681ce7cbd98d984e73c032e911aa
  SOURCE_RUN: "31649544130"
  SOURCE_ARTIFACT: piano-society-phase5b-frozen-source
  SOURCE_CAPSULE_SHA256: 3db71e9b498605853454abe64c0937f032e8d91bf0500c76fe20b17c9e436ebd

jobs:
  frozen-source-v2-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Resonance World
        uses: actions/checkout@v4
        with:
          path: world
      - name: Checkout pinned Resonance Field
        run: |
          git clone https://github.com/ElephantRock/Resonance-Field.git field
          git -C field checkout "$FIELD_SHA"
          test "$(git -C field rev-parse HEAD)" = "$FIELD_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            world/pyproject.toml
            field/pyproject.toml
      - name: Install frozen revisions
        run: python -m pip install -e 'field[dev]' -e world
      - name: Download exact frozen Phase 5B source
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: frozen-source
          github-token: ${{ github.token }}
          repository: ElephantRock/Resonance-World
          run-id: ${{ env.SOURCE_RUN }}
      - name: Verify frozen source and prohibit confirmatory reads
        run: |
          CAPSULE="$(find frozen-source -name capsules.private.jsonl -print -quit)"
          test -n "$CAPSULE"
          test "$(sha256sum "$CAPSULE" | awk '{print $1}')" = "$SOURCE_CAPSULE_SHA256"
          python - <<'PY'
          import json
          from pathlib import Path
          summary_path = next(Path('frozen-source').rglob('w4-source-summary.json'))
          data = json.loads(summary_path.read_text())
          assert data['field_count'] == 8, data
          assert data['agent_count'] == 96, data
          assert data['capsule_sha256'] == '3db71e9b498605853454abe64c0937f032e8d91bf0500c76fe20b17c9e436ebd', data
          assert data['candidate_sha256'] == 'ca6a9317358643fdf22464512447b800b4336470b3488b03764a9dd3cc862190', data
          PY
      - name: Lint and test Phase 5B contract
        working-directory: world
        run: |
          ruff check --ignore E501,I001 \
            experiments/piano_society/phase5b_transfer_memory.py \
            experiments/piano_society/phase5b_search.py \
            experiments/piano_society/phase5b_controller.py \
            tests/test_piano_society_phase5b.py
          pytest -q tests/test_piano_society_phase5b.py
      - name: Validate exact v2 preregistration
        working-directory: world
        run: |
          python - <<'PY'
          import json
          data = json.load(open('experiments/piano_society/phase5b_search_config_v2.json', encoding='utf-8'))
          assert data['revision'] == 'piano-phase5b-transfer-search-v2'
          assert data['no_model_calls'] is True
          assert data['source_lock']['workflow_run'] == 31649544130
          assert data['source_lock']['artifact_id'] == 9162069554
          assert data['source_lock']['capsule_sha256'] == '3db71e9b498605853454abe64c0937f032e8d91bf0500c76fe20b17c9e436ebd'
          assert data['formation_depth'] == 96
          assert data['evaluation_trials_per_policy'] == 256
          assert data['acceptance']['min_mean_transfer_policy_lift_over_neutral_policy'] == 0.03
          assert data['acceptance']['min_nonnegative_selected_units'] == 6
          assert data['source_fields']['calibration'] == ['w4-source-seed-13007', 'w4-source-seed-13109']
          assert data['source_fields']['confirmatory_untouched'] == [
              'w4-source-seed-13217', 'w4-source-seed-13331',
              'w4-source-seed-13441', 'w4-source-seed-13553',
              'w4-source-seed-13669', 'w4-source-seed-13781'
          ]
          PY
      - name: Run registered v2 transfer search
        working-directory: world
        shell: bash
        run: |
          mkdir -p ../output/phase5b-v2
          CAPSULE="$(find ../frozen-source -name capsules.private.jsonl -print -quit)"
          status=0
          python -m experiments.piano_society.phase5b_search \
            "$CAPSULE" \
            experiments/piano_society/phase5b_search_config_v2.json \
            ../output/phase5b-v2/result.json || status=$?
          test "$status" = "0" -o "$status" = "3"
          echo "$status" > ../output/phase5b-v2/search-exit-status.txt
      - name: Assert calibration remained model-free
        run: |
          test -z "${ZAI_API_KEY:-}"
          python - <<'PY'
          import json
          data = json.load(open('output/phase5b-v2/result.json', encoding='utf-8'))
          assert data['revision'] == 'piano-phase5b-transfer-search-v2', data
          assert data['formation_depth'] == 96, data
          assert data['model_calls'] == 0, data
          assert data['confirmatory_fields_untouched'] == [
              'w4-source-seed-13217', 'w4-source-seed-13331',
              'w4-source-seed-13441', 'w4-source-seed-13553',
              'w4-source-seed-13669', 'w4-source-seed-13781'
          ], data
          PY
      - name: Upload Phase 5B v2 calibration audit
        uses: actions/upload-artifact@v4
        with:
          name: piano-society-phase5b-v2-transfer-search
          path: output/phase5b-v2
          if-no-files-found: error
          retention-days: 90
      - name: Enforce preregistered v2 calibration gate
        run: |
          python - <<'PY'
          import json
          data = json.load(open('output/phase5b-v2/result.json', encoding='utf-8'))
          if data['accepted'] is not True:
              raise SystemExit(3)
          PY
