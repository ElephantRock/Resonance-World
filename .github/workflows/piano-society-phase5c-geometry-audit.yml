name: PIANO Society Phase 5C Geometry Audit

on:
  push:
    branches:
      - experiment/piano-society-phase5c-decision-relevant-memory
    paths:
      - experiments/piano_society/phase5c_geometry_audit.py
      - .github/workflows/piano-society-phase5c-geometry-audit.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  FIELD_SHA: e877bf03dbf6681ce7cbd98d984e73c032e911aa
  SOURCE_RUN: "31652358960"
  SOURCE_ARTIFACT_ID: "9163101495"
  SOURCE_ARTIFACT: piano-society-phase5c-frozen-source
  SOURCE_ARTIFACT_DIGEST: sha256:2caf65e6f2839f243ad0c6e59f7d12ad196f48ddf79aab7c3cca42b0904f22f6
  SOURCE_CAPSULE_SHA256: b44926d70fe91ae3ad546351bd42096ad54a10d7d50eb954060e1bc56dcd1ea8

jobs:
  frozen-source-geometry-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Resonance World
        uses: actions/checkout@v4
        with:
          path: world
      - name: Checkout pinned Resonance Field
        run: |
          git clone https://github.com/ElephantRock/Resonance-Field.git field
          git -C field checkout "$FIELD_SHA"
          test "$(git -C field rev-parse HEAD)" = "$FIELD_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            world/pyproject.toml
            field/pyproject.toml
      - name: Install frozen revisions
        run: python -m pip install -e 'field[dev]' -e world
      - name: Verify frozen source artifact digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/ElephantRock/Resonance-World/actions/artifacts/$SOURCE_ARTIFACT_ID --jq .digest)" = "$SOURCE_ARTIFACT_DIGEST"
      - name: Download exact frozen Phase 5C source
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: frozen-source
          github-token: ${{ github.token }}
          repository: ElephantRock/Resonance-World
          run-id: ${{ env.SOURCE_RUN }}
      - name: Verify exact capsule bytes
        run: |
          CAPSULE="$(find frozen-source -name capsules.private.jsonl -print -quit)"
          test -n "$CAPSULE"
          test "$(sha256sum "$CAPSULE" | awk '{print $1}')" = "$SOURCE_CAPSULE_SHA256"
      - name: Lint geometry audit
        working-directory: world
        run: ruff check --ignore E501,I001 experiments/piano_society/phase5c_geometry_audit.py
      - name: Run pre-treatment geometry audit only
        working-directory: world
        run: |
          mkdir -p ../output/phase5c-geometry
          CAPSULE="$(find ../frozen-source -name capsules.private.jsonl -print -quit)"
          python -m experiments.piano_society.phase5c_geometry_audit \
            "$CAPSULE" \
            experiments/piano_society/phase5c_constructor_config.json \
            ../output/phase5c-geometry/result.json
      - name: Assert no training, outcomes, or model calls
        run: |
          test -z "${ZAI_API_KEY:-}"
          python - <<'PY'
          import json
          data = json.load(open('output/phase5c-geometry/result.json', encoding='utf-8'))
          assert data['model_calls'] == 0, data
          assert data['memory_training_performed'] is False, data
          assert data['mission_outcomes_evaluated'] is False, data
          assert data['constructor_revision'] == 'piano-phase5c-roster-conditional-v1', data
          PY
      - name: Upload geometry audit
        uses: actions/upload-artifact@v4
        with:
          name: piano-society-phase5c-geometry-audit
          path: output/phase5c-geometry
          if-no-files-found: error
          retention-days: 90
