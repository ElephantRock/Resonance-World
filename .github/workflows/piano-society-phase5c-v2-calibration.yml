name: PIANO Society Phase 5C v2 Calibration

on:
  push:
    branches:
      - experiment/piano-society-phase5c-decision-relevant-memory
    paths:
      - experiments/piano_society/phase5c_constructor_config_v2.json
      - experiments/piano_society/phase5c_constructor_v2.py
      - .github/workflows/piano-society-phase5c-v2-calibration.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  FIELD_SHA: e877bf03dbf6681ce7cbd98d984e73c032e911aa
  SOURCE_RUN: "31652358960"
  SOURCE_ARTIFACT_ID: "9163101495"
  SOURCE_ARTIFACT: piano-society-phase5c-frozen-source
  SOURCE_ARTIFACT_DIGEST: sha256:2caf65e6f2839f243ad0c6e59f7d12ad196f48ddf79aab7c3cca42b0904f22f6
  SOURCE_CAPSULE_SHA256: b44926d70fe91ae3ad546351bd42096ad54a10d7d50eb954060e1bc56dcd1ea8
  SOURCE_CANDIDATE_SHA256: a750b8b110a26a60e74a4561493c3359b29524cca2ebec1061bccff6cb3ad0b7
  GEOMETRY_RUN: "31652891403"
  GEOMETRY_ARTIFACT_ID: "9163248092"
  GEOMETRY_ARTIFACT: piano-society-phase5c-geometry-audit
  GEOMETRY_ARTIFACT_DIGEST: sha256:c30535d8d14e93e35605db5690a7abda08e42f0ffcff1a49354dfc1b4a42ed2c

jobs:
  frozen-source-v2-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Resonance World
        uses: actions/checkout@v4
        with:
          path: world
      - name: Checkout pinned Resonance Field
        run: |
          git clone https://github.com/ElephantRock/Resonance-Field.git field
          git -C field checkout "$FIELD_SHA"
          test "$(git -C field rev-parse HEAD)" = "$FIELD_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            world/pyproject.toml
            field/pyproject.toml
      - name: Install frozen revisions
        run: python -m pip install -e 'field[dev]' -e world
      - name: Verify bound artifact digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/ElephantRock/Resonance-World/actions/artifacts/$SOURCE_ARTIFACT_ID --jq .digest)" = "$SOURCE_ARTIFACT_DIGEST"
          test "$(gh api repos/ElephantRock/Resonance-World/actions/artifacts/$GEOMETRY_ARTIFACT_ID --jq .digest)" = "$GEOMETRY_ARTIFACT_DIGEST"
      - name: Download exact frozen source
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: frozen-source
          github-token: ${{ github.token }}
          repository: ElephantRock/Resonance-World
          run-id: ${{ env.SOURCE_RUN }}
      - name: Download exact geometry audit
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.GEOMETRY_ARTIFACT }}
          path: frozen-geometry
          github-token: ${{ github.token }}
          repository: ElephantRock/Resonance-World
          run-id: ${{ env.GEOMETRY_RUN }}
      - name: Verify frozen source and geometry facts
        run: |
          CAPSULE="$(find frozen-source -name capsules.private.jsonl -print -quit)"
          SUMMARY="$(find frozen-source -name w4-source-summary.json -print -quit)"
          GEOMETRY="$(find frozen-geometry -name result.json -print -quit)"
          test -n "$CAPSULE"
          test -n "$SUMMARY"
          test -n "$GEOMETRY"
          test "$(sha256sum "$CAPSULE" | awk '{print $1}')" = "$SOURCE_CAPSULE_SHA256"
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(next(Path('frozen-source').rglob('w4-source-summary.json')).read_text())
          assert summary['field_count'] == 24, summary
          assert summary['agent_count'] == 288, summary
          assert summary['capsule_sha256'] == 'b44926d70fe91ae3ad546351bd42096ad54a10d7d50eb954060e1bc56dcd1ea8', summary
          assert summary['candidate_sha256'] == 'a750b8b110a26a60e74a4561493c3359b29524cca2ebec1061bccff6cb3ad0b7', summary
          geometry = json.loads(next(Path('frozen-geometry').rglob('result.json')).read_text())
          assert geometry['model_calls'] == 0, geometry
          assert geometry['memory_training_performed'] is False, geometry
          assert geometry['mission_outcomes_evaluated'] is False, geometry
          assert geometry['confirmatory_fields_with_role_specific_option'] == 5, geometry
          assert geometry['confirmatory_fields_with_cross_coverage_option'] == 13, geometry
          feasible = {(row['role_specific'], row['cross_coverage']) for row in geometry['feasible_twelve_unit_balances']}
          assert (5, 7) in feasible, feasible
          assert (6, 6) not in feasible, feasible
          PY
      - name: Lint and test Phase 5C v2 constructor
        working-directory: world
        run: |
          ruff check --ignore E501,I001 \
            experiments/piano_society/phase5c_constructor.py \
            experiments/piano_society/phase5c_constructor_v2.py \
            tests/test_piano_society_phase5c_constructor.py
          pytest -q tests/test_piano_society_phase5c_constructor.py
      - name: Validate exact v2 preregistration
        working-directory: world
        run: |
          python - <<'PY'
          import json
          data = json.load(open('experiments/piano_society/phase5c_constructor_config_v2.json', encoding='utf-8'))
          assert data['revision'] == 'piano-phase5c-roster-conditional-v2'
          assert data['no_model_calls'] is True
          assert data['source_lock']['artifact_id'] == 9163101495
          assert data['source_lock']['capsule_sha256'] == 'b44926d70fe91ae3ad546351bd42096ad54a10d7d50eb954060e1bc56dcd1ea8'
          assert data['geometry_audit_lock']['artifact_id'] == 9163248092
          assert data['formation_depth'] == 96
          assert data['calibration_evaluation_trials_per_policy'] == 512
          assert data['eligibility'] == {
              'require_distinct_ordered_policy_assignments': True,
              'min_role_specific_specialist_advantage': 0.02,
              'min_cross_coverage_balanced_advantage': 0.02,
              'min_neutral_forecast_margin': 0.0005,
              'min_formation_hypothesis_identifiability': 0.005,
          }
          assert data['selection']['calibration_target_role_specific'] == 2
          assert data['selection']['calibration_target_cross_coverage'] == 2
          assert data['selection']['confirmatory_target_role_specific'] == 5
          assert data['selection']['confirmatory_target_cross_coverage'] == 7
          assert data['calibration_acceptance'] == {
              'min_mean_retained_minus_neutral_success_rate': 0.03,
              'min_nonnegative_units': 4,
              'min_forecast_preference_change_units': 4,
              'min_target_posterior_match_units': 4,
          }
          PY
      - name: Run registered v2 constructor calibration
        working-directory: world
        shell: bash
        run: |
          mkdir -p ../output/phase5c-v2
          CAPSULE="$(find ../frozen-source -name capsules.private.jsonl -print -quit)"
          status=0
          python -m experiments.piano_society.phase5c_constructor_v2 \
            "$CAPSULE" \
            experiments/piano_society/phase5c_constructor_config_v2.json \
            ../output/phase5c-v2/result.json || status=$?
          test "$status" = "0" -o "$status" = "3"
          echo "$status" > ../output/phase5c-v2/constructor-exit-status.txt
      - name: Assert v2 remained model-free and confirmatory-outcome-free
        run: |
          test -z "${ZAI_API_KEY:-}"
          python - <<'PY'
          import json
          data = json.load(open('output/phase5c-v2/result.json', encoding='utf-8'))
          assert data['revision'] == 'piano-phase5c-roster-conditional-v2', data
          assert data['model_calls'] == 0, data
          assert data['formation_depth'] == 96, data
          assert data['confirmatory_outcomes_evaluated'] is False, data
          assert data['confirmatory_selected_count'] == 12, data
          assert data['confirmatory_target_counts'] == {
              'role_specific': 5,
              'cross_coverage': 7,
          }, data
          PY
      - name: Upload Phase 5C v2 constructor audit before acceptance enforcement
        uses: actions/upload-artifact@v4
        with:
          name: piano-society-phase5c-v2-constructor-audit
          path: output/phase5c-v2
          if-no-files-found: error
          retention-days: 90
      - name: Enforce unchanged calibration gate
        run: |
          python - <<'PY'
          import json
          data = json.load(open('output/phase5c-v2/result.json', encoding='utf-8'))
          if data['accepted'] is not True:
              raise SystemExit(3)
          PY
