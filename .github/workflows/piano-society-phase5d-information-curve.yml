name: PIANO Society Phase 5D Information Curve

on:
  push:
    branches:
      - experiment/piano-society-phase5d-memory-information-curve
    paths:
      - experiments/piano_society/phase5d_source_config.json
      - experiments/piano_society/phase5d_information_config.json
      - experiments/piano_society/phase5d_information_curve.py
      - .github/workflows/piano-society-phase5d-information-curve.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  FIELD_REPOSITORY: https://github.com/ElephantRock/Resonance-Field.git
  FIELD_SHA: e877bf03dbf6681ce7cbd98d984e73c032e911aa
  PGHOST: localhost
  PGPORT: "5432"
  PGUSER: resonance
  PGPASSWORD: resonance

jobs:
  freeze-source-and-map-information-curve:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: resonance
          POSTGRES_USER: resonance
          POSTGRES_PASSWORD: resonance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resonance -d resonance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout Resonance World
        uses: actions/checkout@v4
        with:
          path: world
      - name: Checkout pinned Resonance Field
        run: |
          git clone "$FIELD_REPOSITORY" field
          git -C field checkout "$FIELD_SHA"
          test "$(git -C field rev-parse HEAD)" = "$FIELD_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            world/pyproject.toml
            field/pyproject.toml
      - name: Install frozen revisions
        run: python -m pip install -e 'field[dev]' -e world
      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Develop thirty-six fresh source Fields
        env:
          DSN: postgresql://resonance:resonance@localhost:5432/resonance
        run: |
          mkdir -p "$GITHUB_WORKSPACE/source-step" "$GITHUB_WORKSPACE/raw"
          (
            cd field
            python -m resonance.experiments.lifecycle_step_cli \
              --config "$GITHUB_WORKSPACE/world/experiments/piano_society/phase5d_source_config.json" \
              --experiment 63 \
              --code-sha "$FIELD_SHA" \
              --dsn "$DSN" \
              --output-dir "$GITHUB_WORKSPACE/source-step"
          )
      - name: Export immutable Field evidence
        env:
          DSN: postgresql://resonance:resonance@localhost:5432/resonance
          CAMPAIGN: piano-phase5d-memory-information-curve-source-v0.1
        run: |
          psql "$DSN" --csv -c "
            SELECT run_id::text, seed, arm_label, environment::text, metrics::text, completed_at
            FROM integration_campaign_runs
            WHERE campaign_name = '$CAMPAIGN'
              AND experiment_number = 63
              AND arm_label = 'immortal_control'
            ORDER BY seed
          " > raw/runs.csv
          psql "$DSN" --csv -c "
            SELECT o.run_id::text, o.cycle, o.task_id::text, o.task_domain,
                   o.required_skill, o.winner_agent_id::text, o.winner_slot,
                   o.success, o.winning_price, o.task_budget, o.created_at
            FROM integration_campaign_outcomes o
            JOIN integration_campaign_runs r ON r.run_id = o.run_id
            WHERE r.campaign_name = '$CAMPAIGN'
              AND r.experiment_number = 63
              AND r.arm_label = 'immortal_control'
            ORDER BY r.seed, o.cycle
          " > raw/outcomes.csv
          psql "$DSN" --csv -c "
            SELECT o.run_id::text, t.task_id::text, t.requester_agent_id::text
            FROM integration_campaign_outcomes o
            JOIN integration_campaign_runs r ON r.run_id = o.run_id
            JOIN market_tasks t ON t.task_id = o.task_id
            WHERE r.campaign_name = '$CAMPAIGN'
              AND r.experiment_number = 63
              AND r.arm_label = 'immortal_control'
            ORDER BY r.seed, t.task_id
          " > raw/tasks.csv
          psql "$DSN" --csv -c "
            SELECT o.run_id::text, b.task_id::text, b.bidder_agent_id::text,
                   b.price, b.confidence, b.status
            FROM integration_campaign_outcomes o
            JOIN integration_campaign_runs r ON r.run_id = o.run_id
            JOIN market_bids b ON b.task_id = o.task_id
            WHERE r.campaign_name = '$CAMPAIGN'
              AND r.experiment_number = 63
              AND r.arm_label = 'immortal_control'
            ORDER BY r.seed, b.task_id, b.bidder_agent_id
          " > raw/bids.csv
      - name: Materialize Field-derived individual state
        working-directory: world
        run: >-
          python -m resonance_world.w4_source_export
          ../raw/runs.csv ../raw/outcomes.csv ../raw/tasks.csv ../raw/bids.csv
          ../output/source
      - name: Enforce exact fresh source pool
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('output/source/w4-source-summary.json').read_text())
          expected = [
              20011,20117,20231,20341,20443,20549,
              20663,20771,20873,20983,21089,21191,
              21313,21419,21529,21647,21757,21863,
              21977,22091,22201,22307,22409,22511,
              22621,22727,22853,22961,23063,23173,
              23279,23383,23497,23603,23719,23827,
          ]
          assert data['field_count'] == 36, data
          assert data['agent_count'] == 432, data
          assert data['seeds'] == expected, data
          PY
      - name: Freeze exact Phase 5D source before information analysis
        uses: actions/upload-artifact@v4
        with:
          name: piano-society-phase5d-frozen-source
          path: output/source
          if-no-files-found: error
          retention-days: 90
      - name: Lint information-curve contract
        working-directory: world
        run: ruff check --ignore E501,I001 experiments/piano_society/phase5d_information_curve.py
      - name: Run registered model-free information curve
        working-directory: world
        shell: bash
        run: |
          mkdir -p ../output/phase5d-information
          status=0
          python -m experiments.piano_society.phase5d_information_curve \
            ../output/source/capsules.private.jsonl \
            experiments/piano_society/phase5d_information_config.json \
            ../output/phase5d-information/result.json || status=$?
          test "$status" = "0" -o "$status" = "3"
          echo "$status" > ../output/phase5d-information/curve-exit-status.txt
      - name: Assert information curve remained model-free
        run: |
          test -z "${ZAI_API_KEY:-}"
          python - <<'PY'
          import json
          data = json.load(open('output/phase5d-information/result.json', encoding='utf-8'))
          assert data['revision'] == 'piano-phase5d-memory-information-curve-v1', data
          assert data['model_calls'] == 0, data
          assert data['calibration_balanced_target_count_each'] >= 3, data
          assert data['validation_balanced_target_count_each'] >= 5, data
          if data['selected_formation_depth'] is None:
              assert data['validation_outcomes_evaluated'] is False, data
          else:
              assert data['selected_formation_depth'] in [24,48,96,192,384], data
              assert data['validation_outcomes_evaluated'] is True, data
          PY
      - name: Upload information-curve audit before advancement enforcement
        uses: actions/upload-artifact@v4
        with:
          name: piano-society-phase5d-information-curve
          path: output/phase5d-information
          if-no-files-found: error
          retention-days: 90
      - name: Enforce validation gate for model-backed replication
        run: |
          python - <<'PY'
          import json
          data = json.load(open('output/phase5d-information/result.json', encoding='utf-8'))
          if data['advance_to_model_backed_replication'] is not True:
              raise SystemExit(3)
          PY
