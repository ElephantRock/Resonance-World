name: PIANO Society Runtime

on:
  push:
    branches:
      - experiment/piano-society-runtime
    paths:
      - "experiments/piano_society/**"
      - "tests/test_piano_society*.py"
      - ".github/workflows/piano-society-runtime.yml"
  pull_request:
    paths:
      - "experiments/piano_society/**"
      - "tests/test_piano_society*.py"
      - ".github/workflows/piano-society-runtime.yml"

permissions:
  contents: read

env:
  PIANO_FIELD_SHA: d9fb7400c499feb78da11fb333e326b9563bf4ea

jobs:
  phase-zero:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run focused tests
        run: pytest -q tests/test_piano_society_experiment.py
      - name: Run paired instrumentation harness
        run: |
          python -m experiments.piano_society.harness \
            --config experiments/piano_society/config.json \
            --output output/piano_society/phase0.json
      - uses: actions/upload-artifact@v4
        with:
          name: piano-society-phase0
          path: output/piano_society/phase0.json
          if-no-files-found: error
          retention-days: 30

  phase-one-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Resonance Field
        run: |
          git clone https://github.com/ElephantRock/Resonance-Field.git ../field
          git -C ../field checkout "$PIANO_FIELD_SHA"
          test "$(git -C ../field rev-parse HEAD)" = "$PIANO_FIELD_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install World and pinned Field
        run: python -m pip install -e '../field[dev]' -e '.[dev]'
      - name: Validate World scorer
        run: |
          ruff check experiments/piano_society/phase1.py
          pytest -q tests/test_piano_society_phase1.py
      - name: Emit Field-owned paired records
        run: |
          mkdir -p output/piano_society/phase1
          python -m resonance.experiments.piano_phase1_fixture \
            --arm control \
            --output output/piano_society/phase1/control.json
          python -m resonance.experiments.piano_phase1_fixture \
            --arm treatment \
            --output output/piano_society/phase1/treatment.json
      - name: Score live contract records
        run: |
          python -m experiments.piano_society.phase1 \
            --control output/piano_society/phase1/control.json \
            --treatment output/piano_society/phase1/treatment.json \
            --field-sha "$PIANO_FIELD_SHA" \
            --output output/piano_society/phase1/result.json
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('output/piano_society/phase1/result.json').read_text())
          assert value['phase'] == 'live-contract-smoke'
          assert value['scientific_claim_allowed'] is False
          assert value['field_revision'] == 'd9fb7400c499feb78da11fb333e326b9563bf4ea'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: piano-society-phase1-contract
          path: output/piano_society/phase1
          if-no-files-found: error
          retention-days: 30

  phase-two-preregistration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Resonance Field
        run: |
          git clone https://github.com/ElephantRock/Resonance-Field.git ../field
          git -C ../field checkout "$PIANO_FIELD_SHA"
          test "$(git -C ../field rev-parse HEAD)" = "$PIANO_FIELD_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install World and pinned Field
        run: python -m pip install -e '../field[dev]' -e '.[dev]'
      - name: Validate Phase 2 implementation and analysis contract
        run: |
          ruff check experiments/piano_society/phase2.py experiments/piano_society/phase2_campaign.py
          pytest -q tests/test_piano_society_phase2.py
          python - <<'PY'
          from resonance.experiments.piano_phase2 import Phase2ExperimentAgent
          from resonance.experiments.piano_phase2_zai import ZAIChatCompletionsBackend
          assert Phase2ExperimentAgent is not None
          assert ZAIChatCompletionsBackend is not None
          PY
      - name: Validate locked preregistration
        run: |
          mkdir -p output/piano_society/phase2
          python -m experiments.piano_society.phase2 \
            --config experiments/piano_society/phase2_config.json \
            > output/piano_society/phase2/preregistration.json
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(
              Path('output/piano_society/phase2/preregistration.json').read_text()
          )
          assert value['campaign_locked'] is True
          assert value['model_snapshot'] == 'glm-5.2'
          assert value['required_pairs'] == 60
          assert value['field_revision'] == 'd9fb7400c499feb78da11fb333e326b9563bf4ea'
          PY
          cp experiments/piano_society/phase2_config.json output/piano_society/phase2/
          cp experiments/piano_society/PHASE2_PREREGISTRATION.md output/piano_society/phase2/
      - uses: actions/upload-artifact@v4
        with:
          name: piano-society-phase2-preregistration
          path: output/piano_society/phase2
          if-no-files-found: error
          retention-days: 30

  phase-two-campaign:
    needs: phase-two-preregistration
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve campaign execution location
        run: |
          if [ -z "$ZAI_API_KEY" ]; then
            echo "ZAI_API_KEY is not available in Resonance-World; live execution is delegated to Resonance-Field Actions."
          else
            echo "ZAI_API_KEY is available; World may execute the same frozen campaign."
          fi
      - name: Checkout pinned Resonance Field
        if: ${{ env.ZAI_API_KEY != '' }}
        run: |
          git clone https://github.com/ElephantRock/Resonance-Field.git ../field
          git -C ../field checkout "$PIANO_FIELD_SHA"
          test "$(git -C ../field rev-parse HEAD)" = "$PIANO_FIELD_SHA"
      - uses: actions/setup-python@v5
        if: ${{ env.ZAI_API_KEY != '' }}
        with:
          python-version: "3.12"
      - name: Install World and pinned Field
        if: ${{ env.ZAI_API_KEY != '' }}
        run: python -m pip install -e '../field[dev]' -e '.[dev]'
      - name: Execute 60 paired model-backed episodes
        if: ${{ env.ZAI_API_KEY != '' }}
        run: |
          python -m experiments.piano_society.phase2_campaign \
            --config experiments/piano_society/phase2_config.json \
            --output-dir output/piano_society/phase2-live
      - uses: actions/upload-artifact@v4
        if: ${{ env.ZAI_API_KEY != '' }}
        with:
          name: piano-society-phase2-zai-live
          path: output/piano_society/phase2-live
          if-no-files-found: error
          retention-days: 90
