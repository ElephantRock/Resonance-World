name: Preserve D2 JSON Mode Conformance Evidence

on:
  push:
    branches: ["evidence/d2-json-mode-conformance-fail"]
    paths:
      - ".github/workflows/preserve-d2-json-mode-evidence.yml"

permissions:
  actions: read
  contents: write

jobs:
  preserve-exact-result:
    if: ${{ github.event.head_commit.message == 'Materialize exact D2 JSON-mode evidence' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Download and verify sole-authorized evidence artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = 'evidence/d2-json-mode-conformance-fail'
          test ! -e research/evidence/d2_json_mode_conformance/RESULT.json
          gh api \
            -H 'Accept: application/vnd.github+json' \
            /repos/${GITHUB_REPOSITORY}/actions/artifacts/10302561413/zip \
            > /tmp/d2-json-mode-conformance-result.zip
          echo '6df950cb8e8762f429ffb6f1e1d640725d2f98fde31609c58271590d7e0e9c53  /tmp/d2-json-mode-conformance-result.zip' | sha256sum -c -
          mkdir -p /tmp/d2-json-result
          unzip -q /tmp/d2-json-mode-conformance-result.zip -d /tmp/d2-json-result
          test -f /tmp/d2-json-result/d2-json-mode-conformance-result.json
          echo '3a41456e11de292300c97ac55ac8c33e9093b8cdf09e760affd5954e653a5294  /tmp/d2-json-result/d2-json-mode-conformance-result.json' | sha256sum -c -
          cp /tmp/d2-json-result/d2-json-mode-conformance-result.json \
            research/evidence/d2_json_mode_conformance/RESULT.json
      - name: Verify bounded authority before preservation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('research/evidence/d2_json_mode_conformance/RESULT.json').read_text())
          assert p['issue'] == 258
          assert p['candidate_sha'] == '6dd5e81fafe26a8a9d10bed8dcf5e6ccd708dc32'
          assert p['qualification_outcome'] == 'FAIL_STRUCTURED_CONTRACT'
          assert p['qualification_pass'] is False
          assert p['apparatus_failure'] is False
          assert p['registered_probe_count'] == 72
          assert p['attempted_probe_count'] == 72
          assert p['effective_completed_count'] == 70
          assert p['native_hermes_completed_count'] == 66
          assert p['terminal_iteration_override_count'] == 4
          assert p['structured_parse_invalid_count'] == 2
          assert p['json_mode_compatibility_failure_count'] == 0
          assert p['physical_provider_sends_observed_total'] == 76
          assert p['unexpected_outbound_http_requests_blocked'] == 0
          assert p['provider_attempts_blocked_by_cap'] == 0
          assert p['logical_attribution_mismatch_blocks'] == 0
          assert p['provider_worker_threads_alive_after_drain'] == 0
          assert p['transport_hooks_restored_after_worker_drain'] is True
          assert p['scientific_scoring_performed'] is False
          assert p['acceptance_action_authorized'] is False
          assert p['production_historical_substrate_enabled'] is False
          assert p['raw_provider_response_body_persisted'] is False
          assert p['raw_final_response_content_persisted'] is False
          assert p['same_request_stream_rerun_allowed'] is False
          PY
      - name: Commit exact evidence and self-delete preservation workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/preserve-d2-json-mode-evidence.yml
          git config user.name 'Resonance World Evidence Bot'
          git config user.email '55954113+Alajmah@users.noreply.github.com'
          git add research/evidence/d2_json_mode_conformance/RESULT.json \
            .github/workflows/preserve-d2-json-mode-evidence.yml
          git commit -m 'Preserve exact D2 JSON-mode conformance FAIL result'
          git push origin HEAD:evidence/d2-json-mode-conformance-fail
