name: Preserve D2 trajectory terminal adapter evidence

on:
  push:
    branches: ["evidence/d2-trajectory-terminal-adapter-fail"]
    paths:
      - ".github/workflows/preserve-d2-trajectory-terminal-adapter-evidence.yml"

permissions:
  actions: read
  contents: write

jobs:
  preserve:
    if: ${{ github.run_attempt == 1 && github.event.head_commit.message == 'Seed D2 trajectory terminal adapter evidence preservation' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Download exact outcome artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/evidence
          gh run download 34678448265 -n d2-trajectory-terminal-adapter-result -D /tmp/evidence
          test -f /tmp/evidence/d2-trajectory-terminal-adapter-result.json
          echo 'c1581fbd8f7e374610adf965d0718258e5a3fe2b01e4654ae3f4be9d0d2b40be  /tmp/evidence/d2-trajectory-terminal-adapter-result.json' | sha256sum -c -
      - name: Materialize evidence-only tree and self-delete workflow
        shell: bash
        run: |
          set -euo pipefail
          dir='research/evidence/d2_trajectory_terminal_adapter_qualification'
          mkdir -p "$dir"
          cp /tmp/evidence/d2-trajectory-terminal-adapter-result.json "$dir/RESULT.json"
          cat > "$dir/README.md" <<'EOF'
          # D2 trajectory terminal adapter qualification evidence

          This directory preserves the exact outcome of issue #255 / PR #256.

          The registered result is **FAIL** under the frozen engineering rule. The sole authorized run attempted 98/220 logical calls and produced 95 effective completions: 93 native Hermes completions plus 2 valid terminal-iteration overrides. The failure is semantic/structured-output failure, not apparatus failure.

          `RESULT.json` is copied byte-for-byte from GitHub Actions artifact `10293395494` and has SHA-256 `c1581fbd8f7e374610adf965d0718258e5a3fe2b01e4654ae3f4be9d0d2b40be`. The artifact ZIP digest is `sha256:a60511f852d8df3c9f61bf7dc5c4e6308a362878c992da3a9185ce06d91726e2`.

          The request stream is consumed and must not be rerun or replaced in place. This evidence is engineering-only and does not authorize scientific scoring/source acquisition, Acceptance/registry action, Historical Substrate activation, deployment/publication, billing/purchase, or credential/permission changes.
          EOF
          cat > "$dir/PROVENANCE.md" <<'EOF'
          # D2 trajectory terminal adapter qualification — provenance

          ## Execution identity

          - Issue: #255
          - Apparatus PR: #256
          - Frozen candidate: `7ff9e471f0e383bd272ae9c37b24a59ab031459e`
          - Sole-child activation: `756ff40d18d56ff0da4b728b221b15dd4465a855`
          - Workflow: `D2 Trajectory Terminal Adapter Qualification`
          - Workflow run: `34678448265`, attempt 1
          - Artifact ID: `10293395494`
          - Artifact ZIP digest: `sha256:a60511f852d8df3c9f61bf7dc5c4e6308a362878c992da3a9185ce06d91726e2`
          - Exact `RESULT.json` SHA-256: `c1581fbd8f7e374610adf965d0718258e5a3fe2b01e4654ae3f4be9d0d2b40be`

          ## Frozen substrate

          - Provider: Z.AI GLM Coding Plan
          - Provider/API mode/model: `zai` / `chat_completions` / `glm-5.3`
          - Hermes revision: `036cbdfa0a3158454a0a2a7a7388cf70353326b4`
          - Hermes package: `0.8.0`
          - Hermes `run_agent.py` blob: `4c0d3be4b0c2d364c550fa663d34f6545c9e6d20`
          - Provider-send guard blob: `4b8896235d8048523d007400d0acfe85470f628c`
          - GitHub authorization helper blob: `4fec4f0bfac06ae17a87a7c148dea6521736a97a`
          - Qualified terminal-adapter blob: `ba16d2eb4b7255437c8ab224e91d5ed093897990`
          - Preserved #251 result SHA-256: `f0c9ba663642bfec83b04287b71991ec3da275e9c231a3666acf88c3ce5b956e`
          - Fresh request namespace: `rw.d2-trajectory-terminal-adapter.v1`
          - Registered topology: 4 trajectories × 55 logical calls = 220

          ## Authoritative outcome

          `FAIL` under the registered engineering rule; `apparatus_failure=false`.

          The sole authorized run attempted 98/220 logical calls and produced 95 effective completions: 93 native Hermes completions and 2 valid terminal-iteration overrides. It observed 101 physical provider sends. Transport/accounting remained clean: zero unexpected-outbound blocks, zero provider-cap blocks, zero attribution-mismatch blocks, zero provider workers alive after drain, and transport hooks restored after drain.

          Three trajectories stopped on parse-invalid structured responses:
          - `terminal_adapter_trajectory_0` stopped at logical index 1 (`fresh/evaluation2`) after a clean one-call/one-send Hermes completion whose final response was non-empty but failed the exact structured parse.
          - `terminal_adapter_trajectory_2` stopped at logical index 114 (`developed_40/development1`) after two clean calls/two sends; Hermes reported `completed=false`, but the final response failed the exact structured parse, so no terminal override was accepted.
          - `terminal_adapter_trajectory_3` stopped at logical index 200 (`developed_160/development9`) after a clean one-call/one-send Hermes completion whose final response failed the exact structured parse.

          `terminal_adapter_trajectory_1` completed all 55/55 calls. The terminal-override path was exercised twice overall, so this is not `ADAPTER_PATH_NOT_EXERCISED`.

          The earlier #234 trajectory result remains `FAIL`, #243 remains `VALID_TERMINAL_RESPONSE_OBSERVED`, and #251 remains `PASS`; none is rerun, rescued, or reinterpreted.

          ## Authority ceiling

          This is engineering-only completion evidence. It performs no scientific scoring or source acquisition and creates no Acceptance-plane decision, Mechanism Registry promotion, Historical Substrate activation, deployment, publication, billing/purchase, credential, or permission authority. Same-stream rerun or replacement is prohibited.
          EOF
          echo 'c1581fbd8f7e374610adf965d0718258e5a3fe2b01e4654ae3f4be9d0d2b40be  research/evidence/d2_trajectory_terminal_adapter_qualification/RESULT.json' | sha256sum -c -
          rm .github/workflows/preserve-d2-trajectory-terminal-adapter-evidence.yml
          git status --short
      - name: Commit exact evidence and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          mapfile -t changed < <(git diff --cached --name-only)
          test "${#changed[@]}" -eq 4
          printf '%s\n' "${changed[@]}" | grep -Fxq '.github/workflows/preserve-d2-trajectory-terminal-adapter-evidence.yml'
          printf '%s\n' "${changed[@]}" | grep -Fxq 'research/evidence/d2_trajectory_terminal_adapter_qualification/PROVENANCE.md'
          printf '%s\n' "${changed[@]}" | grep -Fxq 'research/evidence/d2_trajectory_terminal_adapter_qualification/README.md'
          printf '%s\n' "${changed[@]}" | grep -Fxq 'research/evidence/d2_trajectory_terminal_adapter_qualification/RESULT.json'
          git commit -m 'Evidence: preserve D2 trajectory terminal adapter FAIL'
          git push origin HEAD:evidence/d2-trajectory-terminal-adapter-fail
