name: D2 Internal Replication Promotion Assembly

on:
  push:
    branches: ["acceptance/d2-internally-replicated"]
    paths:
      - ".github/workflows/promote-d2-internal-replication.yml"

permissions:
  contents: write
  actions: read

jobs:
  assemble-promotion:
    if: ${{ github.event.head_commit.message == 'D2: stage internal-replication promotion automation' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify promotion base and current registry state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "b4494408b07d8404ced24f5edb786eb2013c01f9"
          python - <<'PY'
          import json
          from pathlib import Path
          registry = json.loads(Path('research/mechanisms/registry.json').read_text())
          node = next(n for n in registry['nodes'] if n['mechanism_id'] == 'd2_stochastic_capability_reproduction')
          assert node['status'] == 'discovery_supported'
          assert node['production_historical_substrate_enabled'] is False
          assert node['execution_record']['c2']['classification'] == 'D2-S3'
          assert node['execution_record']['c2']['result_sha256'] == 'f6010b83120c3767c518ffa75fd897b6321da17d190c42f783f1ee39a78ceec5'
          PY
      - name: Download immutable Acceptance artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/ElephantRock/Resonance-World/actions/artifacts/9765871960/zip" \
            -o /tmp/d2b-acceptance.zip
          echo "81ec7d5d9fb9a02d9baadfbec62a7eb570e9b83f36e6c9b51bb9c1dcd5832592  /tmp/d2b-acceptance.zip" | sha256sum -c -
          rm -rf /tmp/d2b-acceptance
          mkdir -p /tmp/d2b-acceptance
          unzip -q /tmp/d2b-acceptance.zip -d /tmp/d2b-acceptance
          echo "7c0ec0b9bb43e1e9c2ac66898c55f628727ea13f772684c9a0e8ac99c417859f  /tmp/d2b-acceptance/review-response.json" | sha256sum -c -
      - name: Assemble append-only promotion record and registry mutation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/acceptance/d2b
          cp /tmp/d2b-acceptance/review-response.json research/acceptance/d2b/review-response.json
          cp /tmp/d2b-acceptance/review-audit.json research/acceptance/d2b/review-audit.json
          cp /tmp/d2b-acceptance/evidence-manifest.json research/acceptance/d2b/evidence-manifest.json
          cp /tmp/d2b-acceptance/review-request.json research/acceptance/d2b/review-request.json
          python - <<'PY'
          import json
          from pathlib import Path

          def dump(path, value):
              Path(path).write_text(json.dumps(value, indent=2, ensure_ascii=False) + '\n')

          response = json.loads(Path('research/acceptance/d2b/review-response.json').read_text())
          audit = json.loads(Path('research/acceptance/d2b/review-audit.json').read_text())
          review = response['review']
          assert review['decision'] == 'ACCEPT internally_replicated'
          assert review['reservations'] == []
          assert len(review['checks']) == 16
          assert all(c['status'] == 'PASS' for c in review['checks'])
          assert audit['substantive_valid_decision_count'] == 1
          assert audit['structural_warnings'] == []
          assert audit['proposer_acceptor_separation'] is True
          assert audit['registry_mutated_by_review'] is False
          assert audit['production_historical_substrate_enabled'] is False
          assert audit['evidence_manifest_sha256'] == 'edbcba9e32d0ef2110b0b6bb8797d5f22592db0ea0599e9290e826a3b1759f0c'
          assert audit['review_response_sha256'] == '7c0ec0b9bb43e1e9c2ac66898c55f628727ea13f772684c9a0e8ac99c417859f'

          prior = json.loads(Path('research/acceptance/d2/PROMOTION_EVENTS.json').read_text())
          assert prior['registry_node'] == 'd2_stochastic_capability_reproduction'
          assert prior['events'][-1]['to_status'] == 'discovery_supported'
          assert prior['production_historical_substrate_enabled'] is False

          promotion = {
              'schema': 'resonance-registry-promotion-events-v0.1',
              'registry_node': 'd2_stochastic_capability_reproduction',
              'decision': 'ACCEPT internally_replicated',
              'proposer_id': audit['proposer_id'],
              'acceptor_id': audit['acceptor_id'],
              'acceptance_timestamp': '2026-08-31T16:14:41Z',
              'review_record': 'https://github.com/ElephantRock/Resonance-World/issues/190#issuecomment-5481124280',
              'review_workflow': 33412725524,
              'review_apparatus_candidate': '86b276c1fd388bc95061f61a8831da9d6d3e89e1',
              'review_branch_commit': '3fe0e42c9cc6054c96731b48608c6a68bfd34bd3',
              'review_artifact_id': 9765871960,
              'review_artifact_digest': 'sha256:81ec7d5d9fb9a02d9baadfbec62a7eb570e9b83f36e6c9b51bb9c1dcd5832592',
              'evidence_manifest_sha256': audit['evidence_manifest_sha256'],
              'review_response_sha256': audit['review_response_sha256'],
              'prior_acceptance_record': 'research/acceptance/d2/PROMOTION_EVENTS.json',
              'events': prior['events'] + [{
                  'sequence': len(prior['events']) + 1,
                  'registry_node': 'd2_stochastic_capability_reproduction',
                  'from_status': 'discovery_supported',
                  'to_status': 'internally_replicated',
                  'preregistration_hash_or_issue': 'https://github.com/ElephantRock/Resonance-World/issues/186',
                  'candidate_result_hash': '1a602e3813f4a4f1c58e82c3dba8feb42485fa44cda11a23d289b0de72a27757',
                  'acceptor': audit['acceptor_id'],
                  'acceptance_timestamp': '2026-08-31T16:14:41Z',
                  'review_commit_or_record': 'https://github.com/ElephantRock/Resonance-World/issues/190#issuecomment-5481124280',
              }],
              'accepted_claim': review['accepted_claim'],
              'claim_ceiling': 'registered_single_model_synthetic_individual_agent_internal_replication_only',
              'explicit_nonclaims': [
                  'weight_learning',
                  'schema_generalization',
                  'cross_model_or_cross_provider_reproduction',
                  'naturalistic_or_semantic_domain_generalization',
                  'team_swarm_relationship_or_institution_reproduction',
                  'capability_composition',
                  'market_viability',
                  'autonomous_environment_spawning',
                  'production_readiness',
                  'production_historical_substrate_authorization',
              ],
              'production_historical_substrate_enabled': False,
          }
          dump('research/acceptance/d2b/PROMOTION_EVENTS.json', promotion)

          registry_path = Path('research/mechanisms/registry.json')
          registry = json.loads(registry_path.read_text())
          node = next(n for n in registry['nodes'] if n['mechanism_id'] == 'd2_stochastic_capability_reproduction')
          assert node['status'] == 'discovery_supported'
          node['status'] = 'internally_replicated'
          node['status_provenance'] = (
              'D2-C2 was independently accepted at discovery_supported. D2b then executed as a prospectively '
              'frozen fresh replication of the same mechanism with a fully disjoint cohort and no outcome-based '
              'retuning, and its frozen evaluator emitted D2b-S3. The separate external Acceptance-plane review '
              'on issue #190 accepted exactly discovery_supported -> internally_replicated.'
          )
          for dep in (
              'https://github.com/ElephantRock/Resonance-World/issues/186',
              'https://github.com/ElephantRock/Resonance-World/issues/190',
          ):
              if dep not in node['dependencies']:
                  node['dependencies'].append(dep)
          node['execution_record']['d2b'] = {
              'state': 'completed_classifiable_fresh_replication',
              'scientific_candidate': 'cf938d895020120a0f979d035f0e428065e05140',
              'authorization_commit': 'b1402081d8a3252b28a788b7e5c75544aaacbe6d',
              'workflow': 33353320198,
              'run_attempt': 1,
              'classification': 'D2b-S3',
              'base_evaluator_classification': 'D2-S3',
              'result_sha256': '1a602e3813f4a4f1c58e82c3dba8feb42485fa44cda11a23d289b0de72a27757',
              'cohort_sha256': 'b4d8f39b9730de6869b6b3c3f9ceb4d16c76214b8eee9437c2bca62e85286b23',
              'attempted_pairs': 360,
              'analyzable_pairs': 360,
              'failed_pairs': 0,
              'all_18_provider_shards_success': True,
              'rerun_performed': False,
              'integrity_passed': True,
              'preservation_commit': 'b4494408b07d8404ced24f5edb786eb2013c01f9',
          }
          node['execution_record']['preservation_main_head'] = 'b4494408b07d8404ced24f5edb786eb2013c01f9'
          node['supported_scope'] = review['accepted_claim']
          node['known_boundary'] = (
              'Registered single-model synthetic individual-agent stochastic capability-reproduction mechanism only; '
              'internal replication is established only within the same Z.AI glm-5-turbo provider/model line and '
              'registered synthetic Field substrate. No weight learning, schema generalization, cross-model/provider, '
              'naturalistic, team/swarm/institution, composition, market, environment-spawning, production-readiness, '
              'or production Historical Substrate claim.'
          )
          node['evidence'] = ['D2-C2', 'D2b']
          node['prior_acceptance_record'] = node.get('acceptance_record')
          node['prior_acceptance_issue'] = node.get('acceptance_issue')
          node['acceptance_record'] = 'research/acceptance/d2b/PROMOTION_EVENTS.json'
          node['acceptance_issue'] = 'https://github.com/ElephantRock/Resonance-World/issues/190'
          node['acceptor'] = audit['acceptor_id']
          node['promotion_eligible'] = True
          node['production_historical_substrate_enabled'] = False
          dump(registry_path, registry)
          PY
      - name: Validate bounded registry transition
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          registry = json.loads(Path('research/mechanisms/registry.json').read_text())
          node = next(n for n in registry['nodes'] if n['mechanism_id'] == 'd2_stochastic_capability_reproduction')
          assert node['status'] == 'internally_replicated'
          assert node['evidence'] == ['D2-C2', 'D2b']
          assert node['execution_record']['d2b']['classification'] == 'D2b-S3'
          assert node['execution_record']['d2b']['rerun_performed'] is False
          assert node['acceptance_issue'].endswith('/190')
          assert node['production_historical_substrate_enabled'] is False
          events = json.loads(Path('research/acceptance/d2b/PROMOTION_EVENTS.json').read_text())
          assert [(e['from_status'], e['to_status']) for e in events['events']] == [
              ('proposed', 'discovery_supported'),
              ('discovery_supported', 'internally_replicated'),
          ]
          assert events['events'][1]['acceptor'] == 'zai:glm-5-turbo:independent-acceptance-plane'
          assert events['production_historical_substrate_enabled'] is False
          PY
          git diff --check
      - name: Commit clean promotion payload and remove assembly workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/promote-d2-internal-replication.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/mechanisms/registry.json research/acceptance/d2b .github/workflows/promote-d2-internal-replication.yml
          git diff --cached --name-status
          test "$(git diff --cached --name-only | wc -l)" -eq 6
          git commit -m "D2: promote stochastic capability reproduction to internally_replicated"
          git push origin HEAD:acceptance/d2-internally-replicated
