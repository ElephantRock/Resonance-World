name: Repair D2 Terminal Adapter Completed Flag Validation

on:
  push:
    branches: ["engineering/d2-terminal-adapter-qualification"]
    paths:
      - ".github/workflows/repair-d2-terminal-adapter-completed-flag.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply fail-closed completed-flag validation and regress it
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          script = Path('scripts/qualify_d2_terminal_adapter.py')
          text = script.read_text()
          old = '''    return {
                  "completed": bool(row["hermes_completed"]),
          '''
          new = '''    return {
                  "completed": (
                      bool(row["hermes_completed"])
                      if row.get("hermes_completed_flag_valid", True)
                      else None
                  ),
          '''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''        final = result.get("final_response")
                  final_text = final if isinstance(final, str) else ""
                  parse_valid, strategy = adapter.parse_response(final_text)
                  row.update(
                      {
                          "hermes_completed": result.get("completed") is True,
          '''
          new = '''        final = result.get("final_response")
                  final_text = final if isinstance(final, str) else ""
                  parse_valid, strategy = adapter.parse_response(final_text)
                  completed_value = result.get("completed")
                  row.update(
                      {
                          "hermes_completed_flag_valid": isinstance(completed_value, bool),
                          "hermes_completed": completed_value is True,
          '''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    return bool(
                  row.get("runtime_exception")
          '''
          new = '''    return bool(
                  row.get("runtime_exception")
                  or row.get("hermes_completed_flag_valid") is False
          '''
          assert old in text
          text = text.replace(old, new, 1)
          script.write_text(text)

          test = Path('tests/test_d2_terminal_adapter.py')
          text = test.read_text()
          old = '''    clean = {
                  "runtime_exception": False,
          '''
          new = '''    clean = {
                  "runtime_exception": False,
                  "hermes_completed_flag_valid": True,
          '''
          assert old in text
          text = text.replace(old, new, 1)
          old = '''    ambiguous = dict(clean)
              ambiguous["adapter_reason"] = "transport_not_exact_clean"
              assert script.probe_has_apparatus_failure(ambiguous) is True
          '''
          new = '''    invalid_completed = dict(clean)
              invalid_completed["hermes_completed_flag_valid"] = False
              assert script.probe_has_apparatus_failure(invalid_completed) is True

              ambiguous = dict(clean)
              ambiguous["adapter_reason"] = "transport_not_exact_clean"
              assert script.probe_has_apparatus_failure(ambiguous) is True
          '''
          assert old in text
          text = text.replace(old, new, 1)
          test.write_text(text)
          PY
          python -m pip install -e '.[dev]'
          pytest -q tests/test_provider_send_guard.py tests/test_d2_terminal_adapter.py
          ruff check \
            src/resonance_world/d2_terminal_adapter.py \
            src/resonance_world/d2_terminal_transport.py \
            scripts/qualify_d2_terminal_adapter.py \
            tests/test_d2_terminal_adapter.py
          rm .github/workflows/repair-d2-terminal-adapter-completed-flag.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/qualify_d2_terminal_adapter.py tests/test_d2_terminal_adapter.py \
            .github/workflows/repair-d2-terminal-adapter-completed-flag.yml
          git diff --cached --check
          git commit -m 'D2 terminal adapter: fail closed on invalid completed flag'
          git push origin HEAD:engineering/d2-terminal-adapter-qualification
