name: Terminal Iteration Structured Completion Qualification

on:
  push:
    branches: ["engineering/terminal-iteration-completion-semantics"]
    paths:
      - "research/terminal_iteration_completion/RUN_TERMINAL_ITERATION_COMPLETION"

permissions:
  contents: read

jobs:
  authorization-integrity:
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      candidate_sha: ${{ steps.auth.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - id: auth
        name: Verify sole-child activation and frozen terminal semantics contract
        shell: bash
        run: |
          set -euo pipefail
          marker='research/terminal_iteration_completion/RUN_TERMINAL_ITERATION_COMPLETION'
          test -f "$marker"
          candidate="$(sed -n 's/^candidate_sha=//p' "$marker")"
          issue="$(sed -n 's/^issue=//p' "$marker")"
          authorization="$(sed -n 's/^authorization=//p' "$marker")"
          test -n "$candidate"
          test "$issue" = '237'
          test "$authorization" = 'Autonomous_Operating_Charter_Amendment_A1_standing_execution_authority'
          test "$(git rev-parse HEAD^)" = "$candidate"
          test "$(git diff --name-only "$candidate" HEAD)" = "$marker"
          test "$(git diff --name-only "$candidate" HEAD | wc -l)" = '1'
          git merge-base --is-ancestor \
            '0e9553905abf1077550521d4ff7dc8f35b6076f5' "$candidate"
          git merge-base --is-ancestor \
            '47383f2b18c993965c89350609a4c9691897bdde' "$candidate"
          if git cat-file -e "${candidate}:${marker}" 2>/dev/null; then
            echo 'Frozen candidate already contains execution marker.' >&2
            exit 1
          fi
          test "$(git rev-parse "${candidate}:src/resonance_world/provider_send_guard.py")" = \
            '4b8896235d8048523d007400d0acfe85470f628c'
          test "$(git rev-parse "${candidate}:src/resonance_world/structured_completion.py")" = \
            'c318705e60b907b969d2b3757f688dd7c984de72'
          test "$(git show "${candidate}:research/terminal_iteration_completion/REQUEST_PLAN.json" | sha256sum | awk '{print $1}')" = \
            '4113c42aa681d81a44b92041e8cbeb23ac4855b300c51f75579f380272ea52c9'
          test "$(git show "${candidate}:research/terminal_iteration_completion/PROBES.json" | sha256sum | awk '{print $1}')" = \
            '1d2132d3dfca9f703b28eb2290e046b36886bc64b101d0b08659505d2ee1422a'
          test "$(git show "${candidate}:research/evidence/d2_trajectory_completion_envelope/RESULT.json" | sha256sum | awk '{print $1}')" = \
            'b0ca9a93cdc2c9568847f94c4524764cfddc66e90c8d02c3ef54889ee2044b9a'
          python - "$candidate" <<'PY'
          import json, subprocess, sys
          candidate = sys.argv[1]
          raw = subprocess.check_output([
              'git', 'show',
              f'{candidate}:research/terminal_iteration_completion/REQUEST_PLAN.json'
          ], text=True)
          p = json.loads(raw)
          assert p['schema'] == 'terminal-iteration-structured-completion-request-plan-v0.1'
          assert p['issue'] == 237
          assert p['engineering_only'] is True
          assert p['predecessor_trajectory_issue'] == 234
          assert p['predecessor_trajectory_result'] == 'FAIL'
          assert p['predecessor_evidence_merge_sha'] == '0e9553905abf1077550521d4ff7dc8f35b6076f5'
          assert p['predecessor_result_sha256'] == 'b0ca9a93cdc2c9568847f94c4524764cfddc66e90c8d02c3ef54889ee2044b9a'
          assert p['structured_completion_git_blob_sha'] == 'c318705e60b907b969d2b3757f688dd7c984de72'
          assert p['provider_send_guard_git_blob_sha'] == '4b8896235d8048523d007400d0acfe85470f628c'
          assert p['subscription_product'] == 'GLM Coding Plan'
          assert p['endpoint_base_url'] == 'https://api.z.ai/api/coding/paas/v4'
          assert p['provider_id'] == 'zai'
          assert p['api_mode'] == 'chat_completions'
          assert p['requested_model'] == 'glm-5.3'
          assert p['hermes_revision'] == '036cbdfa0a3158454a0a2a7a7388cf70353326b4'
          assert p['hermes_package_version'] == '0.8.0'
          assert p['hermes_run_agent_blob_sha'] == '4c0d3be4b0c2d364c550fa663d34f6545c9e6d20'
          assert p['openai_sdk_version'] == '2.21.0'
          assert p['httpx_version'] == '0.28.1'
          assert p['maximum_logical_calls'] == 4
          assert p['max_iterations'] == 2
          assert p['max_tokens'] == 64
          assert p['sampling_temperature'] == 0.0
          assert p['thinking'] == {'type':'disabled'}
          assert p['maximum_concurrency'] == 4
          assert p['maximum_physical_sends_per_logical_call'] == 36
          assert p['maximum_physical_sends_total'] == 72
          assert p['terminal_iteration_override_required_for_pass'] is True
          assert p['at_least_one_two_call_probe_required_for_pass'] is True
          assert p['all_four_probes_required_for_pass'] is True
          assert p['provider_execution_authorized'] is False
          assert p['workflow_rerun_allowed'] is False
          assert p['same_request_stream_rerun_allowed'] is False
          assert p['predecessor_stream_rerun_or_replacement_allowed'] is False
          assert p['scientific_scoring_performed'] is False
          assert p['registry_promotion_authorized'] is False
          assert p['acceptance_action_authorized'] is False
          assert p['historical_substrate_enabled'] is False
          PY
          echo "candidate_sha=$candidate" >> "$GITHUB_OUTPUT"

  execute-bounded-conformance:
    needs: authorization-integrity
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      GLM_BASE_URL: https://api.z.ai/api/coding/paas/v4
      TERMINAL_ITERATION_COMPLETION_AUTHORIZED: "1"
    steps:
      - name: Checkout Resonance World
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Checkout pinned Hermes Agent
        uses: actions/checkout@v4
        with:
          repository: hermes-agent-org/hermes
          ref: 036cbdfa0a3158454a0a2a7a7388cf70353326b4
          path: .hermes-src
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Reverify exact parent and pinned source contract
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = '1'
          test -n "${ZAI_API_KEY:-}"
          test "${GLM_BASE_URL}" = 'https://api.z.ai/api/coding/paas/v4'
          test "$(git rev-parse HEAD^)" = '${{ needs.authorization-integrity.outputs.candidate_sha }}'
          test "$(git rev-parse HEAD^:src/resonance_world/provider_send_guard.py)" = \
            '4b8896235d8048523d007400d0acfe85470f628c'
          test "$(git rev-parse HEAD^:src/resonance_world/structured_completion.py)" = \
            'c318705e60b907b969d2b3757f688dd7c984de72'
          test "$(git -C .hermes-src rev-parse HEAD)" = \
            '036cbdfa0a3158454a0a2a7a7388cf70353326b4'
          test "$(git -C .hermes-src rev-parse HEAD:run_agent.py)" = \
            '4c0d3be4b0c2d364c550fa663d34f6545c9e6d20'
          grep -Fq 'completed = final_response is not None and api_call_count < self.max_iterations' \
            .hermes-src/run_agent.py
          grep -Fq 'restart_with_length_continuation = True' .hermes-src/run_agent.py
          grep -Fq 'if restart_with_length_continuation:' .hermes-src/run_agent.py
          grep -Fq 't = threading.Thread(target=_call, daemon=True)' .hermes-src/run_agent.py
      - name: Install frozen supported-product environment
        run: |
          python -m pip install -e .
          python -m pip install ./.hermes-src 'openai==2.21.0' 'httpx==0.28.1'
          python - <<'PY'
          import importlib.metadata
          import httpx
          from openai._constants import DEFAULT_MAX_RETRIES
          assert importlib.metadata.version('hermes-agent') == '0.8.0'
          assert importlib.metadata.version('openai') == '2.21.0'
          assert importlib.metadata.version('httpx') == '0.28.1'
          assert httpx.__version__ == '0.28.1'
          assert DEFAULT_MAX_RETRIES == 2
          assert hasattr(httpx.Client, '_send_single_request')
          assert hasattr(httpx.AsyncClient, '_send_single_request')
          PY
      - name: Execute bounded terminal-iteration qualification once
        shell: bash
        run: |
          set -euo pipefail
          env \
            -u OPENROUTER_API_KEY \
            -u OPENAI_API_KEY \
            -u OPENAI_BASE_URL \
            -u ANTHROPIC_API_KEY \
            -u ANTHROPIC_TOKEN \
            -u NOUS_API_KEY \
            -u GLM_API_KEY \
            -u Z_AI_API_KEY \
            -u KIMI_API_KEY \
            -u MINIMAX_API_KEY \
            -u DEEPSEEK_API_KEY \
            -u DASHSCOPE_API_KEY \
            -u XAI_API_KEY \
            python scripts/qualify_terminal_iteration_completion.py \
              --execute \
              --output output/terminal-iteration-completion-result.json
      - name: Verify bounded result authority
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('output/terminal-iteration-completion-result.json').read_text())
          assert p['schema'] == 'terminal-iteration-structured-completion-result-v0.1'
          assert p['issue'] == 237
          assert p['engineering_only'] is True
          assert p['candidate_sha'] == '${{ needs.authorization-integrity.outputs.candidate_sha }}'
          assert p['predecessor_trajectory_issue'] == 234
          assert p['predecessor_trajectory_result_unchanged'] == 'FAIL'
          assert p['predecessor_stream_rerun_or_replacement_performed'] is False
          assert p['provider'] == 'Z.AI'
          assert p['subscription_product'] == 'GLM Coding Plan'
          assert p['provider_id'] == 'zai'
          assert p['api_mode'] == 'chat_completions'
          assert p['requested_model'] == 'glm-5.3'
          assert p['max_iterations'] == 2
          assert p['max_tokens'] == 64
          assert p['sampling_temperature'] == 0.0
          assert p['thinking'] == {'type':'disabled'}
          assert p['maximum_logical_calls'] == 4
          assert len(p['probes']) == 4
          assert p['maximum_physical_sends_per_logical_call'] == 36
          assert p['maximum_physical_sends_total'] == 72
          assert 0 <= p['physical_provider_sends_observed_total'] <= 72
          assert p['unexpected_outbound_http_requests_blocked'] >= 0
          assert p['provider_attempts_blocked_by_cap'] >= 0
          assert p['logical_attribution_mismatch_blocks'] >= 0
          assert isinstance(p['qualification_pass'], bool)
          assert p['scientific_scoring_performed'] is False
          assert p['source_acquisition_evidence_generated'] is False
          assert p['scientific_campaign_executed'] is False
          assert p['registry_promotion_authorized'] is False
          assert p['acceptance_action_authorized'] is False
          assert p['production_historical_substrate_enabled'] is False
          assert p['raw_credentials_persisted'] is False
          assert p['raw_provider_response_body_persisted'] is False
          assert p['raw_provider_error_body_persisted'] is False
          assert p['raw_provider_error_message_persisted'] is False
          assert p['same_request_stream_rerun_allowed'] is False
          for row in p['probes']:
              assert 0 <= row['physical_provider_sends_observed'] <= 36
              assert isinstance(row['adapter_accepted'], bool)
              assert isinstance(row['terminal_iteration_override_used'], bool)
              assert 'final_response_sha256' in row
              assert 'final_response_length' in row
              assert 'structured_parse_valid' in row
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: terminal-iteration-structured-completion-result
          path: output/terminal-iteration-completion-result.json
          if-no-files-found: error

  rerun-prohibited:
    if: ${{ github.run_attempt != 1 }}
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo 'Workflow reruns are prohibited for this request stream.' >&2
          exit 1
