name: W4-00 Architecture Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Resonance World audit head
        uses: actions/checkout@v4
        with:
          path: world

      - name: Checkout audited Resonance Field revision
        uses: actions/checkout@v4
        with:
          repository: ElephantRock/Resonance-Field
          ref: 0914a21249261fe61e02c5191f4a36df416c672f
          path: field

      - name: Checkout W3 baseline revision
        uses: actions/checkout@v4
        with:
          repository: ElephantRock/Resonance-World
          ref: b377c68abeb2151e57fc4c4c45e64c0d3fd92f98
          path: world-w3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install audit package
        run: python -m pip install -e world

      - name: Validate machine-readable architecture classification
        run: >-
          python -m resonance_world.w4_architecture_audit
          world/configs/w4/relationship-state-audit.json
          --output audit-summary.json

      - name: Probe pinned source revisions
        run: >-
          python -m resonance_world.w4_architecture_probe
          field world-w3 --output source-probe.json

      - name: Enforce W4-00 gates
        run: |
          python - <<'PY'
          import json

          audit = json.load(open('audit-summary.json', encoding='utf-8'))
          probe = json.load(open('source-probe.json', encoding='utf-8'))

          assert audit['classification'] == 'A_NO_NATIVE_PAIR_STATE'
          assert audit['native_relationship_state_count'] == 0
          assert audit['world_proxy_count'] == 1
          assert audit['behavioral_w4_allowed'] is False
          assert probe['classification'] == 'A_NO_NATIVE_PAIR_STATE'
          assert probe['field_individual_practice_verified'] is True
          assert probe['field_pair_owned_trace_state_absent'] is True
          assert probe['w3_coordination_exposure_is_world_derived'] is True
          assert probe['w3_coordination_exposure_has_direct_outcome_effect'] is True
          PY

      - name: Upload W4-00 audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: w4-00-architecture-audit
          path: |
            audit-summary.json
            source-probe.json

      - name: Publish authoritative W4-00 result
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 18 --repo ElephantRock/Resonance-World --body "## W4-00 Relationship-State Architecture Audit — complete

          - Classification: **A_NO_NATIVE_PAIR_STATE**
          - Field-native persistent relationship-state primitives: **0**
          - W3 World-derived coordination proxies: **1**
          - Behavioral W4 reset/ablation campaign allowed: **false**
          - W3 clarification: \`coordination_exposure\` is a World-derived proxy with a direct destination-law effect, not Field-native pair state.
          - Next phase: **W4A — Minimal Joint-Learning Substrate**

          Interpretation: W4-00 is an architecture/provenance audit, not evidence for or against relationship capital.

          Actions run: https://github.com/ElephantRock/Resonance-World/actions/runs/${GITHUB_RUN_ID}"
          gh issue close 18 --repo ElephantRock/Resonance-World --reason completed
