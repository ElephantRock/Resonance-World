name: W4A.1 General Teamwork

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate general-teamwork channel
        run: pytest -q tests/test_w4a_joint_learning.py tests/test_w4a1_general_teamwork.py
      - name: Enforce outcome-law blindness
        run: |
          python - <<'PY'
          import inspect
          from resonance_world.w4a_joint_learning import JointEnvironment

          params = set(inspect.signature(JointEnvironment.evaluate).parameters)
          forbidden = {
              'relationship_state', 'relationships', 'pair_memory',
              'partner_model', 'teamwork_model', 'teamwork_state',
              'coordination_exposure'
          }
          assert not params & forbidden, params & forbidden
          PY
      - name: Publish authoritative W4A.1 result
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 24 --repo ElephantRock/Resonance-World --body "## W4A.1 General Teamwork State — architecture validated

          - Partner-independent teamwork state: **available**
          - New-partner decisions can use prior teamwork experience: **yes**
          - General teamwork reset independent of pair state/practice: **yes**
          - Direct teamwork/relationship input to outcome law: **none**
          - Scientific teamwork/relationship-capital claim: **none**

          This closes the representational gap required for W4 C1/C2/C3/C4.

          Actions run: https://github.com/ElephantRock/Resonance-World/actions/runs/${GITHUB_RUN_ID}"
          gh issue close 24 --repo ElephantRock/Resonance-World --reason completed
