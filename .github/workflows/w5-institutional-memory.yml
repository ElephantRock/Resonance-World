name: W5 Institutional Memory

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/w5-institutional-memory.yml"
      - "configs/w5/**"
      - "docs/w5-status.md"
      - "src/resonance_world/w5_*.py"
      - "src/resonance_world/w5a_organization.py"
      - "tests/test_w5_*.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/w5-institutional-memory.yml"
      - "configs/w5/**"
      - "docs/w5-status.md"
      - "src/resonance_world/w5_*.py"
      - "src/resonance_world/w5a_organization.py"

permissions:
  contents: read
  issues: write

concurrency:
  group: w5-institutional-memory-${{ github.ref }}
  cancel-in-progress: false

env:
  FIELD_REPOSITORY: https://github.com/ElephantRock/Resonance-Field.git
  FIELD_SHA: 0914a21249261fe61e02c5191f4a36df416c672f
  PGHOST: localhost
  PGPORT: "5432"
  PGUSER: resonance
  PGPASSWORD: resonance

jobs:
  discovery-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: resonance
          POSTGRES_USER: resonance
          POSTGRES_PASSWORD: resonance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resonance -d resonance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout Resonance World
        uses: actions/checkout@v4
        with:
          path: world
      - name: Checkout pinned Resonance Field
        run: |
          git clone "$FIELD_REPOSITORY" field
          git -C field checkout "$FIELD_SHA"
          test "$(git -C field rev-parse HEAD)" = "$FIELD_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            world/pyproject.toml
            field/pyproject.toml
      - run: python -m pip install -e 'field[dev]' -e world
      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Develop five fresh source Fields
        env:
          DSN: postgresql://resonance:resonance@localhost:5432/resonance
        run: |
          mkdir -p "$GITHUB_WORKSPACE/source-step" "$GITHUB_WORKSPACE/raw"
          (
            cd field
            python -m resonance.experiments.lifecycle_step_cli \
              --config "$GITHUB_WORKSPACE/world/configs/w5/source-development-discovery.json" \
              --experiment 63 \
              --code-sha "$FIELD_SHA" \
              --dsn "$DSN" \
              --output-dir "$GITHUB_WORKSPACE/source-step"
          )
      - name: Export immutable Field evidence
        env:
          DSN: postgresql://resonance:resonance@localhost:5432/resonance
          CAMPAIGN: w5-stateful-source-development-discovery-v0.1
        run: |
          psql "$DSN" --csv -c "
            SELECT run_id::text, seed, arm_label, environment::text, metrics::text, completed_at
            FROM integration_campaign_runs
            WHERE campaign_name = '$CAMPAIGN'
              AND experiment_number = 63
              AND arm_label = 'immortal_control'
            ORDER BY seed
          " > raw/runs.csv
          psql "$DSN" --csv -c "
            SELECT o.run_id::text, o.cycle, o.task_id::text, o.task_domain,
                   o.required_skill, o.winner_agent_id::text, o.winner_slot,
                   o.success, o.winning_price, o.task_budget, o.created_at
            FROM integration_campaign_outcomes o
            JOIN integration_campaign_runs r ON r.run_id = o.run_id
            WHERE r.campaign_name = '$CAMPAIGN'
              AND r.experiment_number = 63
              AND r.arm_label = 'immortal_control'
            ORDER BY r.seed, o.cycle
          " > raw/outcomes.csv
          psql "$DSN" --csv -c "
            SELECT o.run_id::text, t.task_id::text, t.requester_agent_id::text
            FROM integration_campaign_outcomes o
            JOIN integration_campaign_runs r ON r.run_id = o.run_id
            JOIN market_tasks t ON t.task_id = o.task_id
            WHERE r.campaign_name = '$CAMPAIGN'
              AND r.experiment_number = 63
              AND r.arm_label = 'immortal_control'
            ORDER BY r.seed, t.task_id
          " > raw/tasks.csv
          psql "$DSN" --csv -c "
            SELECT o.run_id::text, b.task_id::text, b.bidder_agent_id::text,
                   b.price, b.confidence, b.status
            FROM integration_campaign_outcomes o
            JOIN integration_campaign_runs r ON r.run_id = o.run_id
            JOIN market_bids b ON b.task_id = o.task_id
            WHERE r.campaign_name = '$CAMPAIGN'
              AND r.experiment_number = 63
              AND r.arm_label = 'immortal_control'
            ORDER BY r.seed, b.task_id, b.bidder_agent_id
          " > raw/bids.csv
      - name: Materialize Field-derived individual state
        run: >-
          python -m resonance_world.w4_source_export
          raw/runs.csv raw/outcomes.csv raw/tasks.csv raw/bids.csv
          output/discovery-source
      - name: Enforce discovery source boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('output/discovery-source/w4-source-summary.json').read_text())
          assert data['field_count'] == 5, data
          assert data['agent_count'] == 60, data
          assert data['seeds'] == [146, 267, 388, 509, 630], data
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: w5-discovery-source
          path: |
            output/discovery-source
            raw
            source-step
          if-no-files-found: error
          retention-days: 90

  discovery:
    needs: discovery-sources
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: w5-discovery-source
          path: source
      - name: Execute W5-01 through W5-06
        run: >-
          python -m resonance_world.w5_institution discover
          source/output/discovery-source/capsules.private.jsonl
          configs/w5/institution-missions.json
          configs/w5/institution-campaign.json
          output/discovery
      - name: Enforce causal boundary and complete learning curve
        run: |
          python - <<'PY'
          import inspect
          import json
          from resonance_world.w5_institution import InstitutionEnvironment
          data = json.load(open('output/discovery/w5-discovery.json', encoding='utf-8'))
          assert data['discovery_classification'] in {
              'institutional_memory', 'institutional_harm', 'no_institutional_memory'
          }
          assert sorted(map(int, data['w5_02']['history_curve'])) == [0, 1, 2, 4, 8, 12]
          forbidden = {
              'organization', 'organization_id', 'organization_memory',
              'institutional_memory', 'organization_age'
          }
          assert not set(inspect.signature(InstitutionEnvironment.evaluate).parameters) & forbidden
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: w5-discovery-results
          path: output/discovery
          if-no-files-found: error
          retention-days: 90

  replication-sources:
    needs: discovery
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: resonance
          POSTGRES_USER: resonance
          POSTGRES_PASSWORD: resonance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resonance -d resonance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout Resonance World
        uses: actions/checkout@v4
        with:
          path: world
      - name: Checkout pinned Resonance Field
        run: |
          git clone "$FIELD_REPOSITORY" field
          git -C field checkout "$FIELD_SHA"
          test "$(git -C field rev-parse HEAD)" = "$FIELD_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            world/pyproject.toml
            field/pyproject.toml
      - run: python -m pip install -e 'field[dev]' -e world
      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Develop post-discovery replication Fields
        env:
          DSN: postgresql://resonance:resonance@localhost:5432/resonance
        run: |
          mkdir -p "$GITHUB_WORKSPACE/source-step" "$GITHUB_WORKSPACE/raw"
          (
            cd field
            python -m resonance.experiments.lifecycle_step_cli \
              --config "$GITHUB_WORKSPACE/world/configs/w5/source-development-replication.json" \
              --experiment 63 \
              --code-sha "$FIELD_SHA" \
              --dsn "$DSN" \
              --output-dir "$GITHUB_WORKSPACE/source-step"
          )
      - name: Export unseen Field evidence
        env:
          DSN: postgresql://resonance:resonance@localhost:5432/resonance
          CAMPAIGN: w5-stateful-source-development-replication-v0.1
        run: |
          psql "$DSN" --csv -c "
            SELECT run_id::text, seed, arm_label, environment::text, metrics::text, completed_at
            FROM integration_campaign_runs
            WHERE campaign_name = '$CAMPAIGN'
              AND experiment_number = 63
              AND arm_label = 'immortal_control'
            ORDER BY seed
          " > raw/runs.csv
          psql "$DSN" --csv -c "
            SELECT o.run_id::text, o.cycle, o.task_id::text, o.task_domain,
                   o.required_skill, o.winner_agent_id::text, o.winner_slot,
                   o.success, o.winning_price, o.task_budget, o.created_at
            FROM integration_campaign_outcomes o
            JOIN integration_campaign_runs r ON r.run_id = o.run_id
            WHERE r.campaign_name = '$CAMPAIGN'
              AND r.experiment_number = 63
              AND r.arm_label = 'immortal_control'
            ORDER BY r.seed, o.cycle
          " > raw/outcomes.csv
          psql "$DSN" --csv -c "
            SELECT o.run_id::text, t.task_id::text, t.requester_agent_id::text
            FROM integration_campaign_outcomes o
            JOIN integration_campaign_runs r ON r.run_id = o.run_id
            JOIN market_tasks t ON t.task_id = o.task_id
            WHERE r.campaign_name = '$CAMPAIGN'
              AND r.experiment_number = 63
              AND r.arm_label = 'immortal_control'
            ORDER BY r.seed, t.task_id
          " > raw/tasks.csv
          psql "$DSN" --csv -c "
            SELECT o.run_id::text, b.task_id::text, b.bidder_agent_id::text,
                   b.price, b.confidence, b.status
            FROM integration_campaign_outcomes o
            JOIN integration_campaign_runs r ON r.run_id = o.run_id
            JOIN market_bids b ON b.task_id = o.task_id
            WHERE r.campaign_name = '$CAMPAIGN'
              AND r.experiment_number = 63
              AND r.arm_label = 'immortal_control'
            ORDER BY r.seed, b.task_id, b.bidder_agent_id
          " > raw/bids.csv
      - run: >-
          python -m resonance_world.w4_source_export
          raw/runs.csv raw/outcomes.csv raw/tasks.csv raw/bids.csv
          output/replication-source
      - name: Enforce unseen source cohort
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('output/replication-source/w4-source-summary.json').read_text())
          assert data['field_count'] == 3, data
          assert data['agent_count'] == 36, data
          assert data['seeds'] == [751, 872, 993], data
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: w5-replication-source
          path: |
            output/replication-source
            raw
            source-step
          if-no-files-found: error
          retention-days: 90

  replication:
    needs: [discovery, replication-sources]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: w5-replication-source
          path: source
      - uses: actions/download-artifact@v4
        with:
          name: w5-discovery-results
          path: discovery
      - name: Execute W5-07 without retuning
        run: >-
          python -m resonance_world.w5_institution replicate
          source/output/replication-source/capsules.private.jsonl
          configs/w5/institution-missions.json
          configs/w5/institution-campaign.json
          discovery/w5-discovery.json
          output/replication
      - uses: actions/upload-artifact@v4
        with:
          name: w5-replication-results
          path: output/replication
          if-no-files-found: error
          retention-days: 90

  synthesize:
    needs: [discovery, replication]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: w5-discovery-results
          path: evidence/discovery
      - uses: actions/download-artifact@v4
        with:
          name: w5-replication-results
          path: evidence/replication
      - name: Synthesize W5
        run: >-
          python -m resonance_world.w5_institution synthesize
          evidence/discovery/w5-discovery.json
          evidence/replication/w5-07-replication.json
          output
      - uses: actions/upload-artifact@v4
        with:
          name: w5-evidence
          path: |
            output
            evidence
          if-no-files-found: error
          retention-days: 90
      - name: Publish authoritative W5 result
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('output/w5-synthesis.json').read_text())
          body = f'''## W5 Persistent Organization & Institutional Memory — complete

          - Status: **{data['status']}**
          - Discovery classification: **{data['discovery_classification']}**
          - W5-03 institutional-memory effect: **{data['w5_03_institutional_memory_effect']:.4%}**
          - W5-07 classification: **{data['replication_classification']}**
          - W5-07 institutional-memory effect: **{data['w5_07_institutional_memory_effect']:.4%}**
          - W5-07 positive Fields: **{data['w5_07_positive_fields']}/3**
          - W5-07 negative Fields: **{data['w5_07_negative_fields']}/3**
          - Replication gate: **{data['replication_gate']}**

          Interpretation boundary: deterministic Field-derived competence plus explicit World-side W4/W5A learning substrates. Organization memory affects routing only; the outcome law does not read institutional state.

          Actions run: https://github.com/ElephantRock/Resonance-World/actions/runs/{__import__('os').environ['GITHUB_RUN_ID']}
          '''
          Path('w5-comment.md').write_text(body)
          PY
          gh issue comment 34 --repo ElephantRock/Resonance-World --body-file w5-comment.md
          gh issue close 34 --repo ElephantRock/Resonance-World --reason completed
