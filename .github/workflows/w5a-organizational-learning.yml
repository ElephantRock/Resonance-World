name: W5A Organizational Learning Architecture

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/w5a-organizational-learning.yml"
      - "docs/w5a-organizational-learning.md"
      - "src/resonance_world/w5a_organization.py"
      - "tests/test_w5a_organization.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/w5a-organizational-learning.yml"
      - "docs/w5a-organizational-learning.md"
      - "src/resonance_world/w5a_organization.py"
      - "tests/test_w5a_organization.py"

permissions:
  contents: read
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q tests/test_w5a_organization.py
      - name: Enforce outcome-law blindness
        run: |
          python - <<'PY'
          import inspect
          from resonance_world.w5a_organization import OrganizationEnvironment
          forbidden = {
              'organization', 'organization_id', 'organization_memory',
              'institutional_memory', 'organization_age'
          }
          assert not set(inspect.signature(OrganizationEnvironment.evaluate).parameters) & forbidden
          PY
      - name: Publish authoritative W5A result
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 31 --repo ElephantRock/Resonance-World --body "W5A authoritative architecture PASS: organization identity survives 100% roster replacement; organization-owned memory is independently resettable; retained procedure can change routing on a new roster; individual and W4 pair state remain separate; the environment outcome law is organization-memory blind. No institutional-capital claim is made. Actions run: https://github.com/ElephantRock/Resonance-World/actions/runs/$GITHUB_RUN_ID"
          gh issue close 31 --repo ElephantRock/Resonance-World --reason completed
