name: W5B-00 Pair Module Architecture

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/w5b-00-pair-module.yml"
      - "docs/w5b-00-pair-module.md"
      - "src/resonance_world/w5b_pair_module.py"
      - "tests/test_w5b_pair_module.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/w5b-00-pair-module.yml"
      - "docs/w5b-00-pair-module.md"
      - "src/resonance_world/w5b_pair_module.py"
      - "tests/test_w5b_pair_module.py"

permissions:
  contents: read
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q tests/test_w5b_pair_module.py
      - name: Enforce module/outcome separation
        run: |
          python - <<'PY'
          import inspect
          from resonance_world.w4a_joint_learning import JointEnvironment
          forbidden = {
              'module', 'module_id', 'module_history', 'pair_module',
              'relationship_state', 'pair_memory'
          }
          parameters = set(inspect.signature(JointEnvironment.evaluate).parameters)
          assert not parameters & forbidden
          PY
      - name: Publish authoritative W5B-00 result
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 36 --repo ElephantRock/Resonance-World --body "W5B-00 authoritative architecture PASS: PairModule can content-address, restore, and reset W4 pair state; member replacement drops old partner-specific and pair-owned state rather than relabeling it onto the newcomer; only survivor-owned general-teamwork state may persist; JointEnvironment remains module-state blind. Architecture only—no module-performance or institutional-memory claim. Actions run: https://github.com/ElephantRock/Resonance-World/actions/runs/$GITHUB_RUN_ID"
          gh issue close 36 --repo ElephantRock/Resonance-World --reason completed
