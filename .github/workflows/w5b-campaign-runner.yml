name: W5B Campaign Runner

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "configs/w5b/**"
      - "docs/w5b-status.md"
      - "scripts/run_w5b_campaign.sh"
      - "src/resonance_world/w5b_*.py"
      - "tests/test_w5b_*.py"
  push:
    branches: [main, w5b/modular-social-capital]
    paths:
      - ".github/workflows/w5b-campaign-runner.yml"
      - "configs/w5b/**"
      - "docs/w5b-status.md"
      - "scripts/run_w5b_campaign.sh"
      - "src/resonance_world/w5b_*.py"
      - "tests/test_w5b_*.py"

permissions:
  contents: read
  issues: write

concurrency:
  group: w5b-campaign-${{ github.ref }}
  cancel-in-progress: false

env:
  FIELD_REPOSITORY: https://github.com/ElephantRock/Resonance-Field.git
  FIELD_SHA: 0914a21249261fe61e02c5191f4a36df416c672f
  PGHOST: localhost
  PGPORT: "5432"
  PGUSER: resonance
  PGPASSWORD: resonance

jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: resonance
          POSTGRES_USER: resonance
          POSTGRES_PASSWORD: resonance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resonance -d resonance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Announce pre-merge W5B run
        if: github.event_name == 'push' && github.ref == 'refs/heads/w5b/modular-social-capital'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh issue comment 37 --repo ElephantRock/Resonance-World
          --body "W5B pre-merge campaign started on head **$GITHUB_SHA**. Actions run: https://github.com/ElephantRock/Resonance-World/actions/runs/$GITHUB_RUN_ID"
      - name: Checkout pinned Resonance Field
        run: |
          git clone "$FIELD_REPOSITORY" ../field
          git -C ../field checkout "$FIELD_SHA"
          test "$(git -C ../field rev-parse HEAD)" = "$FIELD_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            ../field/pyproject.toml
      - run: python -m pip install -e '../field[dev]' -e .
      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Execute complete W5B campaign
        env:
          DSN: postgresql://resonance:resonance@localhost:5432/resonance
          FIELD_DIR: ${{ github.workspace }}/../field
        run: bash scripts/run_w5b_campaign.sh
      - uses: actions/upload-artifact@v4
        with:
          name: w5b-evidence
          path: output/w5b
          if-no-files-found: error
          retention-days: 90
      - name: Publish W5B evidence record
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads(Path('output/w5b/w5b-synthesis.json').read_text())
          discovery = data['discovery']
          replication = data['replication']
          ref = os.environ['GITHUB_REF']
          phase = 'AUTHORITATIVE MAIN' if ref == 'refs/heads/main' else 'PRE-MERGE REPRODUCTION'
          body = f'''## W5B Modular Social Capital — {phase}

- Status: **{data['status']}**
- W5B-01 discovery: **{discovery['w5b_01']['effect']:.4%} / {discovery['w5b_01']['classification']}**
- W5B-02 discovery: **{discovery['w5b_02']['effect']:.4%} / {discovery['w5b_02']['classification']}**
- W5B-03 discovery: **{discovery['w5b_03']['effect']:.4%} / {discovery['w5b_03']['classification']}**
- W5B-04 discovery: **{discovery['w5b_04']['effect']:.4%} / {discovery['w5b_04']['classification']}**
- W5B-01 replication: **{replication['w5b_01']['effect']:.4%} / {replication['w5b_01']['classification']}**
- W5B-02 replication: **{replication['w5b_02']['effect']:.4%} / {replication['w5b_02']['classification']}**
- W5B-03 replication: **{replication['w5b_03']['effect']:.4%} / {replication['w5b_03']['classification']}**
- W5B-04 replication: **{replication['w5b_04']['effect']:.4%} / {replication['w5b_04']['classification']}**
- Replication gate: **{data['replication_gate']}**
- Head SHA: **{os.environ['GITHUB_SHA']}**
- Actions run: https://github.com/ElephantRock/Resonance-World/actions/runs/{os.environ['GITHUB_RUN_ID']}

PairModule transports existing W4 state only. The outcome law does not read module identity/history, and no generic procedure interpreter is present.
'''
          Path('w5b-comment.md').write_text(body)
          PY
          gh issue comment 37 --repo ElephantRock/Resonance-World --body-file w5b-comment.md
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            gh issue close 37 --repo ElephantRock/Resonance-World --reason completed
          fi
