[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "resonance-world"
version = "0.1.0a0"
description = "Experimental multi-society runtime for Resonance World"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]
contextgraph = [
  "resonance-contextgraph @ git+https://github.com/ElephantRock/Resonance-ContextGraph.git@b896891108fd954869a8cd0423f6e8440ab0cdc0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/resonance_world"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/materialize_o1_benchmarks.py" = ["E302", "F403", "F405"]
"scripts/accept_o1_reconstruction.py" = ["E302", "F403", "F405"]
"scripts/o1_accept_metrics.py" = ["E302"]
"src/resonance_world/w4_relationship.py" = ["E501"]
"src/resonance_world/w6_mobility_campaign.py" = ["E501"]
"src/resonance_world/w8_campaign.py" = ["E501", "E701", "E702", "I001", "UP035"]
"src/resonance_world/w8_native_replacement.py" = ["E501", "F841", "UP035"]
"src/resonance_world/w9_allocation.py" = ["UP035"]
"src/resonance_world/w9_calibration_execution.py" = ["E501", "UP035"]
"src/resonance_world/w9_coalition.py" = ["E501", "UP035"]
"src/resonance_world/w9_integrated.py" = ["E501", "E741", "F841", "UP035"]
"src/resonance_world/w9_integrated_execution.py" = ["E501", "UP035"]
"src/resonance_world/w9_leasing.py" = ["UP035"]
"src/resonance_world/w9_long_horizon.py" = ["B007", "E501", "I001", "UP035"]
"src/resonance_world/w9_long_horizon_execution.py" = ["E501", "UP035"]
"src/resonance_world/w9_portfolio.py" = ["UP035"]
