[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "resonance-world"
version = "0.1.0a0"
description = "Experimental multi-society runtime for Resonance World"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]
contextgraph = [
  "resonance-contextgraph @ git+https://github.com/ElephantRock/Resonance-ContextGraph.git@v0.1.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/resonance_world"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"experiments/context_graph/run_cg10_balanced_stopping.py" = ["B007"]
"experiments/context_graph/run_cg4m_measurement_sufficiency.py" = ["E501"]
"experiments/context_graph/run_cg5_w3_active_measurement.py" = ["E501"]
"src/resonance_world/context_graph_w3_endogenous.py" = ["F402"]
"src/resonance_world/w4_relationship.py" = ["E501"]
"src/resonance_world/w6_mobility_campaign.py" = ["E501"]
"src/resonance_world/w8_campaign.py" = ["E501", "E701", "E702", "I001", "UP035"]
"src/resonance_world/w8_native_replacement.py" = ["E501", "F841", "UP035"]
"src/resonance_world/w9_allocation.py" = ["UP035"]
"src/resonance_world/w9_calibration_execution.py" = ["E501", "UP035"]
"src/resonance_world/w9_coalition.py" = ["E501", "UP035"]
"src/resonance_world/w9_leasing.py" = ["UP035"]
"src/resonance_world/w9_portfolio.py" = ["UP035"]
"src/resonance_world/w9_portfolio_development.py" = ["UP035"]
"tests/test_w8_campaign.py" = ["E501", "F401"]
"tests/test_w9_allocation.py" = ["I001"]
"tests/test_w9_calibration_execution.py" = ["I001"]
"tests/test_w9_coalition.py" = ["E501", "I001"]
"tests/test_w9_leasing.py" = ["I001"]
"tests/test_w9_portfolio.py" = ["I001"]
